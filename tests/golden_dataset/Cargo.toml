[package]
name = "golden-dataset"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arkavo-hrm = { path = "../../crates/arkavo-hrm" }
arkavo-critic = { path = "../../crates/arkavo-critic" }
arkavo-llm = { path = "../../crates/arkavo-llm", default-features = false }
arkavo-mcp-tools = { path = "../../crates/arkavo-mcp-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = "1.11"
rand = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
