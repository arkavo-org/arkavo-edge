# cargo-audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
ignore = [
    # rsa timing sidechannel (Marvin Attack) — no fixed version available.
    # Pulled in unconditionally by sqlx-macros-core -> sqlx-mysql (compile-time only).
    # Not used at runtime; project only uses sqlite backend.
    # Tracked upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # derivative unmaintained — transitive via ruint -> ark-ff
    "RUSTSEC-2024-0388",
    # atomic-polyfill unmaintained — transitive via heapless -> postcard -> irpc -> iroh-blobs.
    # Blocked on iroh updating to postcard 2.x which drops heapless 0.7.
    "RUSTSEC-2023-0089",
    # bincode unmaintained — transitive via hnsw_rs -> arkavo-memory.
    # hnsw_rs 0.3.4 is the latest published version; no upgrade path available.
    "RUSTSEC-2025-0141",
    # paste unmaintained — widely used transitive macro crate. No direct usage.
    "RUSTSEC-2024-0436",
    # proc-macro-error unmaintained — widely used transitive proc-macro crate.
    "RUSTSEC-2024-0370",
    # Bundled SQLite before 3.54.0 can return uninitialized memory when it
    # opens a database beside a crafted `-wal` file (CVE-2026-119375, local).
    # Fixed in libsqlite3-sys 0.39.0, which sqlx 0.8.x cannot accept
    # (sqlx 0.9.1 is a breaking major upgrade raising MSRV to 1.94). Every
    # database opened here is one this program created in the user's own data
    # directory; none comes from another party. Remove when upgrading to sqlx 0.9+.
    "RUSTSEC-2026-0459",
    # chrono unmaintained — used directly across workspace crates and
    # transitively by sqlx and schemars. No drop-in upgrade exists; migration
    # to jiff/time is tracked separately.
    "RUSTSEC-2026-0543",
    # heapless 0.7.17 unsound advisories (fixed only in >= 0.9.4) — transitive
    # via postcard 1.1.3 -> iroh-blobs / iroh-relay / iroh-tickets / irpc ->
    # arkavo-tdf-iroh. Blocked on iroh moving to postcard 2.x (still 2.0.0-rc.1).
    # postcard 1.1.3 only references heapless::Vec and heapless::String (and
    # iroh enables use-std), not SortedLinkedList, Deque, IndexMap, Spsc,
    # HistoryBuf, or pool.
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]
