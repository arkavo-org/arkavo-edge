# cargo-audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
ignore = [
    # rsa timing sidechannel (Marvin Attack) — no fixed version available.
    # Pulled in unconditionally by sqlx-macros-core -> sqlx-mysql (compile-time only).
    # Not used at runtime; project only uses sqlite backend.
    # Tracked upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # derivative unmaintained — transitive via alloy-primitives -> ruint -> ark-ff
    "RUSTSEC-2024-0388",
    # atomic-polyfill unmaintained — transitive via heapless -> postcard -> irpc -> iroh-blobs.
    # Blocked on iroh updating to postcard 2.x which drops heapless 0.7.
    "RUSTSEC-2023-0089",
    # bincode unmaintained — transitive via hnsw_rs -> arkavo-memory.
    # hnsw_rs 0.3.4 is the latest published version; no upgrade path available.
    "RUSTSEC-2025-0141",
    # paste unmaintained — widely used transitive macro crate. No direct usage.
    "RUSTSEC-2024-0436",
    # proc-macro-error unmaintained — widely used transitive proc-macro crate.
    "RUSTSEC-2024-0370",
]
