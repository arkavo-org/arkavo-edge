[workspace]
members = [
    "crates/arkavo",
    "crates/arkavo-cli",
    "crates/arkavo-terminal",
    "crates/arkavo-repo",
    "crates/arkavo-git",
    "crates/arkavo-protocol",
    "crates/arkavo-encryption",
    "crates/arkavo-vault",
    "crates/arkavo-test",
    "crates/arkavo-llm",
    "crates/arkavo-memory",
    "crates/arkavo-mcp",
]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2024"
authors = ["Arkavo Edge Contributors"]
license = "Apache-2.0"
repository = "https://github.com/arkavo/arkavo-edge"
description = "Developer-centric agentic CLI tool for AI-agent development and framework maintenance"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Individual lints
cargo = { level = "warn", priority = -1 }
default_trait_access = "warn"
enum_glob_use = "warn"
implicit_return = "warn"
# Things to consider later
# missing_docs_in_private_items = "warn"
# missing_errors_doc = "warn"
# missing_panics_doc = "warn"
# Restrictive lints
# expect_used = "warn"
# indexing_slicing = "warn"
# panic = "warn"
# print_stdout = "warn"
# todo = "warn"
# unwrap_used = "warn"
# Allow some pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
