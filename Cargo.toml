[workspace]
members = [
    "crates/arkavo",
    "crates/arkavo-cli",
    "crates/arkavo-terminal",
    "crates/arkavo-repo",
    "crates/arkavo-git",
    "crates/arkavo-protocol",
    "crates/arkavo-encryption",
    "crates/arkavo-vault",
    "crates/arkavo-test",
    "crates/arkavo-llm",
    "crates/arkavo-memory",
    "crates/arkavo-mcp",
]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2024"
authors = ["Arkavo Edge Contributors"]
license = "Apache-2.0"
repository = "https://github.com/arkavo/arkavo-edge"
description = "Developer-centric agentic CLI tool for AI-agent development and framework maintenance"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
iter_on_single_items = "allow"
unused_self = "allow"
return_self_not_must_use = "allow"
option_if_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
cognitive_complexity = "allow"
needless_raw_string_hashes = "allow"
derive_partial_eq_without_eq = "allow"
unnecessary_wraps = "allow"
map_unwrap_or = "allow"
branches_sharing_code = "allow"
match_same_arms = "allow"
ignored_unit_patterns = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_const_for_fn = "allow"
if_not_else = "allow"
needless_pass_by_value = "allow"
use_self = "allow"
cast_lossless = "allow"
redundant_closure_for_method_calls = "allow"
match_wildcard_for_single_variants = "allow"
trivial_regex = "allow"
items_after_statements = "allow"
explicit_iter_loop = "allow"
needless_borrow = "allow"
single_match_else = "allow"
manual_let_else = "allow"
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Individual lints
cargo = { level = "warn", priority = -1 }
default_trait_access = "warn"
enum_glob_use = "warn"
implicit_return = "allow"
# Things to consider later
# missing_docs_in_private_items = "warn"
# missing_errors_doc = "warn"
# missing_panics_doc = "warn"
# Restrictive lints
# expect_used = "warn"
# indexing_slicing = "warn"
# panic = "warn"
# print_stdout = "warn"
# todo = "warn"
# unwrap_used = "warn"
# Allow some pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
