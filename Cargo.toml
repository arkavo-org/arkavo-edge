[workspace]
members = [
    "crates/arkavo",
    "crates/arkavo-cli",
    "crates/arkavo-terminal",
    "crates/arkavo-repo",
    "crates/arkavo-git",
    "crates/arkavo-protocol",
    "crates/arkavo-encryption",
    "crates/arkavo-authorization",
    "crates/arkavo-test",
    "crates/arkavo-llm",
    "crates/arkavo-kimi",
    "crates/arkavo-memory",
    "crates/arkavo-mcp",
    "crates/arkavo-mcp-core",
    "crates/arkavo-mcp-runtime",
    "crates/arkavo-dataflow",
    "crates/arkavo-agui",
    "crates/arkavo-observability",
    "crates/arkavo-budget",
    "crates/arkavo-events",
    "crates/arkavo-debugger",
    "tools/xtask",
]
exclude = ["crates/arkavo-protocol/fuzz"]
resolver = "2"

[workspace.package]
version = "0.25.4"
edition = "2024"
authors = ["Arkavo Edge Contributors"]
license = "Apache-2.0"
repository = "https://github.com/arkavo/arkavo-edge"
description = "Developer-centric agentic CLI tool for AI-agent development and framework maintenance"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0.98"
tokio = "1.45"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.40", features = ["derive", "color"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
futures = "0.3.31"
async-trait = "0.1.88"

# Consolidated versions to reduce duplicates
base64 = "0.22.1"
jsonschema = "0.26.2"
thiserror = "2.0.12"
tempfile = "3.20"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls", "json"] }
regex = "1.11.1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }

# Terminal and UI
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }

# Git and filesystem
git2 = { version = "0.20.2", default-features = false }
ignore = "0.4.23"
walkdir = "2.5.0"

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "uuid", "chrono", "migrate"] }

# HTTP and networking
warp = { version = "0.3.7", features = ["tls"] }
jsonrpsee = { version = "0.24.9", features = ["client", "server", "ws-client", "macros"] }

# LLM and ML
tokenizers = { version = "0.21.2", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4.3", features = ["tokio"] }
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"

# Build optimization
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# Optimize for smaller, faster binaries in production
panic = "abort"
debug = 1

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
# Faster incremental compiles and safer dev runtime checks
incremental = true
debug-assertions = true
overflow-checks = true

# Speed up compiling build scripts and proc-macro deps in dev
[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 16
incremental = true

# Make tests run faster without full release optimizations
[profile.test]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
iter_on_single_items = "allow"
unused_self = "allow"
return_self_not_must_use = "allow"
option_if_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
cognitive_complexity = "allow"
needless_raw_string_hashes = "allow"
derive_partial_eq_without_eq = "allow"
unnecessary_wraps = "allow"
map_unwrap_or = "allow"
branches_sharing_code = "allow"
match_same_arms = "allow"
ignored_unit_patterns = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_const_for_fn = "allow"
if_not_else = "allow"
needless_pass_by_value = "allow"
use_self = "allow"
cast_lossless = "allow"
redundant_closure_for_method_calls = "allow"
match_wildcard_for_single_variants = "allow"
trivial_regex = "allow"
items_after_statements = "allow"
explicit_iter_loop = "allow"
needless_borrow = "allow"
single_match_else = "allow"
manual_let_else = "allow"
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Individual lints
cargo = { level = "warn", priority = -1 }
default_trait_access = "warn"
enum_glob_use = "warn"
implicit_return = "allow"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
# Note: Additional Clippy configurations for disallowed-methods are in .clippy.toml
# These configurations use syntax not supported in Cargo.toml
# Things to consider later
# missing_docs_in_private_items = "warn"
# missing_errors_doc = "warn"
# missing_panics_doc = "warn"
# Restrictive lints
# expect_used = "warn"
# indexing_slicing = "warn"
# panic = "warn"
# print_stdout = "warn"
# todo = "warn"
# unwrap_used = "warn"
# Allow some pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"

[workspace.metadata.clippy]
# Deny warnings in CI to catch TODO placeholders and other issues
deny-warnings = true
