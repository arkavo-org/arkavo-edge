default-members = [
    "crates/arkavo",
    "crates/arkavo-cli",
    "crates/arkavo-terminal",
    "crates/arkavo-repo",
    "crates/arkavo-git",
    "crates/arkavo-protocol",
    "crates/arkavo-authorization",
    "crates/arkavo-mcp-macos",
    "crates/arkavo-llm",
    "crates/arkavo-kimi",
    "crates/arkavo-deepseek",
    "crates/arkavo-qwen",
    "crates/arkavo-gemini",
    "crates/arkavo-memory",
    "crates/arkavo-mcp",
    "crates/arkavo-mcp-core",
    "crates/arkavo-mcp-runtime",
    "crates/arkavo-mcp-tools",
    "crates/arkavo-dataflow",
    "crates/arkavo-claude-code",
    "crates/arkavo-agui",
    "crates/arkavo-observability",
    "crates/arkavo-budget",
    "crates/arkavo-router",
    "crates/arkavo-context",
    "crates/arkavo-events",
    "crates/arkavo-debugger",
    "crates/arkavo-llama-cpp-sys",
    "crates/arkavo-llama-cpp",
    "crates/arkavo-code-search",
    "crates/arkavo-browser",
    "crates/arkavo-workspace",
    "crates/arkavo-bench",
    "crates/arkavo-ui-generator",
    "crates/arkavo-ui-core",
    "crates/arkavo-snpe",
    "crates/arkavo-orchestrator",
