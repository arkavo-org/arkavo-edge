    "crates/arkavo-memory",
    "crates/arkavo-mcp",
    "crates/arkavo-mcp-core",
    "crates/arkavo-mcp-runtime",
    "crates/arkavo-mcp-tools",
    "crates/arkavo-dataflow",
    "crates/arkavo-claude-code",
    "crates/arkavo-agui",
