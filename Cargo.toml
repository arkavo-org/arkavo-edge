exclude = ["crates/arkavo-protocol/fuzz"]
resolver = "2"

[workspace.package]

version = "0.47.4"
edition = "2024"
rust-version = "1.91.0"
authors = ["Arkavo Contributors"]
license = "Apache-2.0"
repository = "https://github.com/arkavo/arkavo-edge"
description = "Secure, collaborative automation for every day use. An open-source, privacy-first, low-cost platform."

[workspace.dependencies]
# Core dependencies
anyhow = "1.0.98"
tokio = "1.45"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.40", features = ["derive", "color", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
futures = "0.3.31"
async-trait = "0.1.88"
scopeguard = "1.2.0"
tokio-util = "0.7.12"

# Consolidated versions to reduce duplicates
base64 = "0.22.1"
jsonschema = { version = "0.26.2", default-features = false, features = ["resolve-http", "resolve-file"] }
thiserror = "2.0.12"
tempfile = "3.20"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1.11.1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }

# Common utilities
log = "0.4"
url = "2.5"
lru = "0.12"
async-stream = "0.3"
tower = "0.5"
semver = { version = "1.0", features = ["serde"] }
bytemuck = "1.20"
cfg-if = "1.0"
notify = "8.0"
sha2 = "0.10"
dirs = "6.0"
toml = "0.8"
rand = "0.8"
bincode = "1.3"
bytes = "1.8"
ed25519-dalek = "2.1"
qrcode = "0.14"
hex = "0.4"

# UI generation dependencies
handlebars = "6.2"

# Terminal and UI
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
indicatif = "0.18"

# Syntax highlighting (tree-sitter)
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"

# Git and filesystem
git2 = { version = "0.20.2", default-features = false }
glob = "0.3.1"
ignore = "0.4.23"
walkdir = "2.5.0"

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "uuid", "chrono", "migrate"] }

# HTTP and networking
jsonrpsee = { version = "0.24.9", features = ["client", "server", "ws-client", "macros"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2.0"
webpki-roots = "0.26"
governor = "0.6"
dashmap = "5.5"
crossbeam-queue = "0.3"
jsonwebtoken = "9.3"
urlencoding = "2.1"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
gethostname = "0.5"
if-addrs = "0.14"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
mdns-sd = "0.14"

# LLM and ML
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
torg-core = "0.1.3"
torg-mask = "0.1.3"
hf-hub = { git = "https://github.com/huggingface/hf-hub", default-features = false, features = ["tokio", "rustls-tls"] }
fastembed = "4"
hnsw_rs = "0.3"
tiktoken-rs = "0.6"

# Dev dependencies
criterion = { version = "0.5", features = ["async_tokio"] }
tonic = "0.12"
prost = "0.13"

# Build optimization
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
debug = false

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true
debug-assertions = true
overflow-checks = true

# Speed up compiling build scripts and proc-macro deps in dev
[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 16
incremental = true

# Profile for `cargo test`. Optimized for local development speed.
# This profile inherits from `dev` but overrides settings for test builds.
# It prioritizes fast compilation for quick test iterations.
[profile.test]
opt-level = 0          # No optimizations for fastest compilation
debug = 1              # Minimal debug info for better error messages
split-debuginfo = "unpacked" # Same as dev profile for consistency
codegen-units = 256    # Maximum parallelism during compilation
incremental = true     # Enable incremental compilation for local dev
debug-assertions = true  # Keep safety checks enabled for tests
overflow-checks = true   # Keep safety checks enabled for tests


[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
iter_on_single_items = "allow"
unused_self = "allow"
return_self_not_must_use = "allow"
option_if_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
cognitive_complexity = "allow"
needless_raw_string_hashes = "allow"
derive_partial_eq_without_eq = "allow"
unnecessary_wraps = "allow"
map_unwrap_or = "allow"
branches_sharing_code = "allow"
match_same_arms = "allow"
ignored_unit_patterns = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_const_for_fn = "allow"
if_not_else = "allow"
needless_pass_by_value = "allow"
use_self = "allow"
cast_lossless = "allow"
redundant_closure_for_method_calls = "allow"
match_wildcard_for_single_variants = "allow"
trivial_regex = "allow"
items_after_statements = "allow"
explicit_iter_loop = "allow"
needless_borrow = "allow"
single_match_else = "allow"
manual_let_else = "allow"
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Individual lints
cargo = { level = "warn", priority = -1 }
default_trait_access = "warn"
enum_glob_use = "warn"
implicit_return = "allow"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
# Note: Additional Clippy configurations for disallowed-methods are in .clippy.toml
# These configurations use syntax not supported in Cargo.toml
# Things to consider later
# missing_docs_in_private_items = "warn"
# missing_errors_doc = "warn"
# missing_panics_doc = "warn"
# Restrictive lints
# expect_used = "warn"
# indexing_slicing = "warn"
# panic = "warn"
# print_stdout = "warn"
# todo = "warn"
# unwrap_used = "warn"
# Allow some pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"

[workspace.metadata.clippy]
# Deny warnings in CI to catch TODO placeholders and other issues
deny-warnings = true
