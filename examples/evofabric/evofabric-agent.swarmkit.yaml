# Single-role SwarmKit — replaces the deprecated per-product config for evofabric.
spec_version: "1.0.0"
kit:
  id: ""
  name: "evofabric-agent"
  version: "0.1.0"
  description: "Propose and verify AST-level code modifications using typed operations"
  authors:
    - did: "did:web:arkavo.com"
      name: "Arkavo"
  created: "2026-07-11T00:00:00Z"
  expires: "2027-07-11T00:00:00Z"
  nonce: "ggCTPTv_TDoX0iiy0ScQdg"

objective:
  goal: "Propose and verify AST-level code modifications using typed operations"
  success_criteria:
    - "the proposed OpBundle parses and applies cleanly to the target file"
    - "the modified workspace compiles and its tests pass before anything is committed"

roles:
  - id: "evofabric-agent"
    role_type: "operator"
    description: "Reads a target source file, proposes a typed AST OpBundle, and commits only after verification."
    agent_provisioning:
      model:
        family: "ministral"
        size: "3B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.3
      budget:
        max_inference_calls: 32
        max_wallclock_ms: 120000
        max_total_tokens: 50000
      isolation:
        sandbox: "process"
        network_egress: false
    skills:
      - id: "skill:identity"
        version: "0.1.0"
        source: "inline"
        payload:
          name: "identity"
          description: "System identity"
          instructions: >-
            Propose and verify AST-level code modifications using typed
            operations. Read the target source file, propose an OpBundle of
            typed AST operations (never a raw text diff), apply it, and
            verify the result in an isolated workspace (cargo check and
            cargo test) before committing. Target AST nodes by semantic
            identity (function/type name), not line number.
          resources: []
    mcp_tools: []
    handoffs: []

coordination:
  topology: "hub-spoke"
  protocol: "a2a-jsonrpc-2.0"
  routing:
    strategy: "static"

constraints:
  global_budget:
    max_wallclock_seconds: 300
    max_total_tokens: 100000
    max_cost_usd: 0.50
  data_classifications:
    - "public"
  network:
    egress_allowed: false
    egress_allowlist: []

completion:
  rules:
    - "OpBundle applied, verified, and committed, or no change proposed"
  on_failure: abort
  max_retries: 0

provenance:
  signatures:
    - signer_did: "did:web:arkavo.com"
      algorithm: "ed25519"
      signature: "local-dev-unsigned"

runtime:
  mode: orchestrator
  mdns: true
  cloud_policy: ask_before_cloud
  local_dev: true
