version: 1.0.0
name: llm-code-reviewer
description: Pipeline that reviews code changes using a code-focused LLM model

nodes:
  - id: code_input
    kind: source
    params:
      type: webhook_source
      port: 8081
      path: /review
      
  - id: code_formatter
    kind: transform
    params:
      type: json_transform
      spec:
        filename: "file.name"
        language: "file.language"
        content: "file.content"
        
  - id: code_reviewer
    kind: transform
    params:
      type: llm_transform
      provider: local-ollama
      model: devstral:latest
      prompt: |
        Review the following code and provide feedback on:
        1. Code quality and best practices
        2. Potential bugs or issues
        3. Performance considerations
        4. Security concerns
        
        Code:
        {{input}}
      temperature: 0.2
      max_tokens: 500
      
  - id: review_enricher
    kind: transform
    params:
      type: enrich_transform
      fields:
        review_timestamp: "${CURRENT_TIME}"
        reviewer: "arkavo-llm"
      add_metadata: true
      
  - id: review_output
    kind: sink
    params:
      type: file_sink
      path: code_reviews.json
      format: json
      append: true

links:
  - from: code_input
    to: code_formatter
    
  - from: code_formatter
    to: code_reviewer
    
  - from: code_reviewer
    to: review_enricher
    
  - from: review_enricher
    to: review_output