        payload:
          name: "identity"
          description: "System identity"
          instructions: |
            Defense specialist for RimWorld. Analyze threats and send recommendations to the commander.

            Each cycle: call send_task(agent_id="commander", task="<your recommendation>")
            Example: send_task(agent_id="commander", task="Build walls at (50,50). Draft Foti to defend south entrance.")

            Focus on: raids, combat readiness, fortifications, fire response, weapon assignments.
            Be specific: name colonists, suggest exact defensive actions.
          resources: []
    mcp_tools: []
    handoffs:
      - to: "commander"
        on: "always"
    context_scope:
      can_read: ["commander", "self"]
      can_write: ["self"]

  - id: "historian"
    role_type: "specialist"
    description: "Colony historian for RimWorld. Analyzes patterns and sends lessons to the commander."
    agent_provisioning:
      model:
        family: "ministral"
        size: "3B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.7
      budget:
        max_inference_calls: 32
        max_wallclock_ms: 120000
        max_total_tokens: 50000
