            intelligent analysis of agent execution patterns, error diagnosis,
            and session replay capabilities. Leverages the arkavo-debugger
            Diagnostics API to help agents self-heal and developers understand
            complex agent behaviors.

            Capabilities:
            - Session Analysis: analyze event patterns across agent sessions
            - Error Diagnosis: identify recurring errors and suggest remediation
            - Performance Profiling: track token usage, response times, and
              resource consumption
            - Replay Orchestration: guide users through session replays with
              insights
            - Pattern Recognition: identify common failure modes and success
              patterns

            Key functions:
            1. Analyze Session: given a session ID, provide comprehensive
               analysis
            2. Compare Sessions: identify differences between successful and
               failed runs
            3. Suggest Fixes: recommend code changes based on error patterns
            4. Generate Reports: create detailed debugging reports with
               visualizations

            Integration points:
            - Uses arkavo-debugger Diagnostics trait for data access
            - Connects via WebSocket to AG-UI debug endpoint
            - Can trigger self-healing in other agents
            - Exports findings to monitoring systems
          resources: []
    mcp_tools: []
    handoffs: []
    context_scope:
      can_read: ["orchestrator-agent", "self"]
      can_write: ["self"]

coordination:
  topology: "hub-spoke"
  protocol: "a2a-jsonrpc-2.0"
  routing:
    strategy: "static"
  context_sharing:
    store: "per-role"

constraints:
  global_budget:
    max_wallclock_seconds: 1800
    max_total_tokens: 600000
    max_cost_usd: 3.00
  data_classifications:
    - "internal"
  network:
    egress_allowed: false
    egress_allowlist: []

completion:
  rules:
    - "the orchestrator aggregates findings and presents a response"
    - "no role in error state"
  on_failure: abort
  max_retries: 0

provenance:
  signatures:
    - signer_did: "did:web:arkavo.com"
      algorithm: "ed25519"
      signature: "local-dev-unsigned"

runtime:
  mode: orchestrator
  mdns: true
  cloud_policy: ask_before_cloud
  local_dev: true
