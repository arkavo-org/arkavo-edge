# Multi-role SwarmKit replacing the deprecated per-agent configs for
# orchestrator/, security/, code-review/, database/, testing/,
# documentation/, performance/, devops/, frontend/, architecture/,
# data-science/, debug/.
#
# Every AGENTS.md in this tree carried its own commented-out `mcp_servers:`
# block; consolidated here once instead of 12 times:
#   - orchestrator used the built-in memory server (`arkavo serve`):
#       mcp_servers:
#         - name: memory
#           command: arkavo
#           args: ["serve"]
#   - the 11 specialists used the optional filesystem/git npm servers
#     (`npm install -g @modelcontextprotocol/server-filesystem`), read-only
#     except for testing/documentation/devops which used `--allow-write`:
#       mcp_servers:
#         - name: filesystem
#           command: mcp-filesystem
#           args: ["--read-only"]   # or ["--allow-write"]
#         - name: git
#           command: mcp-git
#           args: ["--read-only"]
#     None of these servers are required to run the mesh; see README.md.
#
# `code-review/AGENTS.md` also carried a `swarm: code-review` field with no
# equivalent RoleSpec slot (it predates SwarmKit's own "swarm" concept and
# isn't read by the runtime) — dropped, noted in README.md.
# `discovery.mdns` (set on every role) maps to the single kit-level
# `runtime.mdns` below.
spec_version: "1.0.0"
kit:
  id: ""
  # Authored empty; populated at publish
  name: "software-development-lifecycle"
  version: "0.1.0"
  description: "12-agent knowledge-sharing mesh for software development: an orchestrator decomposes requests and coordinates 11 domain-specialist agents (security, code review, database, testing, documentation, performance, devops, frontend, architecture, data science, debug) that can also query each other directly."
  authors:
    - did: "did:web:arkavo.com"
      name: "Arkavo"
  created: "2026-07-11T00:00:00Z"
  expires: "2027-07-11T00:00:00Z"
  nonce: "sdlcMeshNonce0000001"

objective:
  goal: "Decompose complex tasks and coordinate specialized agents to achieve goals"
  success_criteria:
    - "the request is routed to the domain specialist(s) whose expertise it needs"
    - "specialists may query each other directly for cross-domain knowledge"
    - "the orchestrator aggregates findings into a coherent response"

roles:
  - id: "orchestrator-agent"
    role_type: "planner"
    description: "Decompose complex tasks and coordinate specialized agents to achieve goals"
    agent_provisioning:
      model:
        family: "ministral"
        size: "3B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.7
      budget:
        max_inference_calls: 32
        max_wallclock_ms: 120000
        max_total_tokens: 50000
      isolation:
        sandbox: "process"
        network_egress: false
    skills:
      - id: "skill:identity"
        version: "0.1.0"
        source: "inline"
        payload:
          name: "identity"
          description: "System identity"
          instructions: |
            Decompose complex tasks and coordinate specialized agents to achieve goals.

            Responsible for:
            - Understanding user requests
            - Breaking down complex tasks into subtasks
            - Identifying which specialized agents to involve
            - Coordinating agent-to-agent communication
            - Aggregating results from multiple agents
            - Presenting coherent responses to users
          resources: []
    mcp_tools: []
    handoffs:
      - to: "security-agent"
        on: "always"
      - to: "code-review-agent"
        on: "always"
      - to: "database-agent"
        on: "always"
      - to: "testing-agent"
        on: "always"
      - to: "documentation-agent"
        on: "always"
      - to: "performance-agent"
        on: "always"
      - to: "devops-agent"
        on: "always"
      - to: "frontend-agent"
        on: "always"
      - to: "architecture-agent"
        on: "always"
      - to: "data-science-agent"
        on: "always"
      - to: "debug-agent"
        on: "always"
    context_scope:
      can_read: ["self"]
      can_write: ["self"]

  - id: "security-agent"
    role_type: "specialist"
    description: "Analyze code for security vulnerabilities and suggest best practices"
    agent_provisioning:
