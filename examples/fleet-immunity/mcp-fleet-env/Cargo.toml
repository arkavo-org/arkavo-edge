[package]
name = "arkavo-mcp-fleet-env"
version = "0.1.0"
edition = "2021"
description = "MCP tools for fleet environment simulation - get_sector and inject_hazard (EXAMPLE ONLY)"
license = "Apache-2.0"

# NOTE: This crate is for the fleet-immunity example only.
# It is not part of the main Arkavo workspace.

[[bin]]
name = "arkavo-mcp-fleet-env"
path = "src/main.rs"

[lib]
name = "arkavo_mcp_fleet_env"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-std", "net"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
