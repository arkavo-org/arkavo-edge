[package]
name = "arkavo-mcp-fleet-env"
version = "0.1.0"
edition = "2021"
description = "MCP tools for fleet environment simulation - get_sector and inject_hazard (EXAMPLE ONLY)"
license = "Apache-2.0"

# NOTE: This crate is for the fleet-immunity example only.
# It is not part of the main Arkavo workspace.

[dependencies]
arkavo-mcp = { path = "../../../crates/arkavo-mcp" }
async-trait = "0.1.88"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["sync"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
