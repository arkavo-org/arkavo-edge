# Delivery Routes Configuration

routes:
  alpha:
    name: "Route A"
    sequence: [1, 2, 4, 3]
    description: "Loading Bay -> Storage A -> Cold Storage -> Storage B"

  beta:
    name: "Route B"
    sequence: [2, 3, 4, 1]
    description: "Storage A -> Storage B -> Cold Storage -> Loading Bay"

  gamma:
    name: "Route C"
    sequence: [3, 1, 2, 4]
    description: "Storage B -> Loading Bay -> Storage A -> Cold Storage"

timing:
  sector_transit_ms: 2000
  pause_at_sector_ms: 500
