# Usage:
# 1) Start Minecraft server (background):
#    docker compose up -d minecraft
#
# 2) Run the MCP server over *stdio* (foreground; Arkavo Edge should spawn this command):
#    docker compose run --rm mcp
#
# MCP stdio requirement: client launches server as a subprocess and communicates via stdin/stdout.  [oai_citation:0‡Model Context Protocol](https://modelcontextprotocol.io/specification/2025-03-26/basic/transports?utm_source=chatgpt.com)
# This MCP server is invoked via npx per repo instructions.  [oai_citation:1‡GitHub](https://github.com/yuniko-software/minecraft-mcp-server)

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: arkavo-minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"          # required  [oai_citation:2‡Docker Minecraft Server](https://docker-minecraft-server.readthedocs.io/en/latest/variables/?utm_source=chatgpt.com)
      ONLINE_MODE: "FALSE"  # simplest for bot demos (no Mojang auth); supported by itzg image  [oai_citation:3‡Docker Minecraft Server](https://docker-minecraft-server.readthedocs.io/en/latest/variables/?utm_source=chatgpt.com)
      DIFFICULTY: "easy"
      MODE: "survival"
      MOTD: "Arkavo Edge MCP Demo"
      # Supported version for minecraft-mcp-server
      VERSION: "1.21.8"
    volumes:
      - mc-data:/data

  mcp:
    image: node:20-alpine
    container_name: arkavo-minecraft-mcp
    depends_on:
      - minecraft
    working_dir: /work
    environment:
      # Mineflayer bot connection target (service name resolves via compose DNS)
      MC_HOST: "minecraft"
      MC_PORT: "25565"
      BOT_USERNAME: "Edge"
    # Keep stdio usable when run interactively (Arkavo Edge spawns `docker compose run --rm mcp`)
    stdin_open: true
    tty: true
    entrypoint: ["sh","-lc"]
    command:
      - >
        npx -y github:yuniko-software/minecraft-mcp-server
        --host "$$MC_HOST"
        --port "$$MC_PORT"
        --username "$$BOT_USERNAME"

volumes:
  mc-data:
