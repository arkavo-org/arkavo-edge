spec_version: "1.0.0"
kit:
  id: "blake3:tDt9D_VBrUJhs6_txeGLImi9WJYZ9ojNuzzGzckixDQ"
  name: "Code Review Kit"
  version: "0.1.0"
  description: >-
    Three roles — Code Reviewer, Security Auditor, Test Writer — produce a
    structured review of a code diff. Pipeline: reviewer → security_auditor
    → test_writer.
  authors:
    - did: "did:web:arkavo.com"
      name: "Arkavo"
  created: "2026-05-08T00:00:00Z"
  expires: "2026-08-06T00:00:00Z"
  nonce: "qZ8nF3vL5mTeR2K1jXcW0Q"

objective:
  goal: "Produce a structured code review (correctness, security, test coverage) for a code diff."
  success_criteria:
    - "all four code_review fields populated (style, correctness, security, tests)"
    - "no unsupported claims about the diff"
    - "rubric.weighted_score >= 0.75"

inputs:
  - name: "diff"
    type: "text"
    required: true
    classification: "internal"
  - name: "target_branch"
    type: "text"
    required: true
  - name: "language"
    type: "text"
    required: true

deliverables:
  - name: "code_review"
    type: "json"
    classification: "internal"

roles:
  - id: "reviewer"
    role_type: "code_reviewer"
    description: "Review the diff for correctness, design, naming, and style."
    agent_provisioning:
      model:
        family: "qwen3"
        size: "7B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.2
        thinking: true
      budget:
        max_inference_calls: 4
        max_wallclock_ms: 60000
        max_total_tokens: 16000
      context:
        max_context_tokens: 32000
        compaction_strategy: "summary"
        persistence: "ephemeral"
      isolation:
        sandbox: "process"
        network_egress: false
    skills:
      - id: "skill:code-review"
        version: "0.1.0"
        source: "inline"
        payload:
          name: "code-review"
          description: "Review a code diff for correctness, design, and naming."
          instructions: "Read the diff against target_branch. Identify correctness defects, design concerns, naming issues, and unclear logic. Reference file:line for each finding. Score each finding's severity (low / medium / high)."
          resources: []
        signature: "lJNJvNBN_-wJPWPoDfNIYQVgHVfh-bVanYM1EmhEZ_OJSX3dBZwksxJzO6I4CbqIk-rhKVVQfAqoi6kaqAlXDA"
        signed_by: "did:web:arkavo.com"
    mcp_tools: []
    tdf_attribute_release_policy:
      attributes:
        - "https://attr.arkavo.com/role/code_reviewer"
        - "https://attr.arkavo.com/clearance/internal"
      rule: "allOf"
    handoffs:
      - to: "security_auditor"
        on: "always"
    context_scope:
      can_read: ["self"]
      can_write: ["self"]

  - id: "security_auditor"
    role_type: "security_auditor"
    description: "Scan the diff for OWASP/CWE-class defects."
    agent_provisioning:
      model:
        family: "qwen3"
        size: "7B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.2
        thinking: true
      budget:
        max_inference_calls: 4
        max_wallclock_ms: 60000
        max_total_tokens: 16000
      context:
        max_context_tokens: 32000
        compaction_strategy: "summary"
        persistence: "ephemeral"
      isolation:
        sandbox: "process"
        network_egress: false
    skills:
      - id: "skill:security-audit"
        version: "0.1.0"
        source: "inline"
        payload:
          name: "security-audit"
          description: "Audit a code diff for security defects per OWASP / CWE."
          instructions: "Scan the diff for OWASP Top 10 issues (injection, broken auth, exposure, XXE, broken access, misconfiguration, XSS, deserialization, components-with-known-vulns, logging gaps) and any CWE-class defects. Output structured findings with CWE/CVE references where applicable."
          resources: []
        signature: "87x1ChxNnw_-eeUAO7m2HEKEg0BlQf49ZPJDhYitPKaLGt-TlYae7O448aZHbwUgEr2W6Ea441jiKBfKZoijDw"
        signed_by: "did:web:arkavo.com"
    mcp_tools: []
    tdf_attribute_release_policy:
      attributes:
        - "https://attr.arkavo.com/role/security_auditor"
        - "https://attr.arkavo.com/clearance/internal"
      rule: "allOf"
    handoffs:
      - to: "test_writer"
        on: "always"
    context_scope:
      can_read: ["reviewer", "self"]
      can_write: ["self"]

  - id: "test_writer"
    role_type: "test_author"
    description: "Write tests for changed code paths."
    agent_provisioning:
      model:
        family: "gemma-4"
        size: "9B"
        backend: "llama.cpp"
      inference:
        max_tokens: 1024
        temperature: 0.4
        thinking: false
      budget:
        max_inference_calls: 6
        max_wallclock_ms: 90000
        max_total_tokens: 24000
      context:
        max_context_tokens: 32000
        compaction_strategy: "tool_result"
        persistence: "ephemeral"
      isolation:
        sandbox: "process"
        network_egress: false
    skills:
      - id: "skill:test-write"
        version: "0.1.0"
        source: "inline"
        payload:
          name: "test-write"
          description: "Write tests for changed code paths."
          instructions: "For each changed function or module in the diff, write at least one unit test covering the new behavior and one negative-path test. Use the language conventions identified by the input.language field."
          resources: []
        signature: "HqkKyRXK751PXYhoWXtq-4OOf6Vi93qvJ4qdy-okz0h9dSgMlsA3KKpgwHjVUBIlewjhop0N4_eK-i0pHS8nBw"
        signed_by: "did:web:arkavo.com"
    mcp_tools: []
    tdf_attribute_release_policy:
      attributes:
        - "https://attr.arkavo.com/role/test_author"
        - "https://attr.arkavo.com/clearance/internal"
      rule: "allOf"
    handoffs: []
    context_scope:
      can_read: ["reviewer", "security_auditor", "self"]
      can_write: ["self"]

coordination:
  topology: "pipeline"
  protocol: "a2a-jsonrpc-2.0"
  routing:
    strategy: "static"
  context_sharing:
    store: "per-role"
    compaction:
      strategy: "tool_result"

constraints:
  global_budget:
    max_wallclock_seconds: 300
    max_total_tokens: 60000
    max_cost_usd: 0.20
  data_classifications:
    - "internal"
  network:
    egress_allowed: false
    egress_allowlist: []

evaluation:
  rubric:
    reference: "swarmkit-spec-draft-00#appendix-d"
    dimensions:
      - name: "correctness"
        weight: 0.30
        threshold: 0.7
      - name: "security_coverage"
        weight: 0.30
        threshold: 0.85
      - name: "test_completeness"
        weight: 0.25
        threshold: 0.7
      - name: "style_clarity"
        weight: 0.15
        threshold: 0.7
  critic_role: "reviewer"

completion:
  rules:
    - "all deliverables present"
    - "rubric.weighted_score >= 0.75"
    - "no role in error state"
  on_failure: "abort"
  max_retries: 1

provenance:
  signatures:
    - signer_did: "did:web:arkavo.com"
      algorithm: "ed25519"
      signature: "AAA"
