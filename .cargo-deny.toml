# cargo-deny configuration for arkavo-edge
# Helps track and prevent duplicate dependencies, security advisories, and license issues

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
ignore = []

[bans]
# Multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Skip expected duplicates that cannot be easily resolved
skip = [
    # C++ dependencies (candle, llama-cpp) - Feature-gated, expected duplicates
    { name = "thiserror", version = "=1.0.69" },  # candle ecosystem uses v1.x
    { name = "bitflags", version = "=1.3.2" },    # old Metal via core-graphics-types
    { name = "gemm", version = "0.17" },          # old candle deps
    { name = "raw-cpuid", version = "=10.7.0" },  # old gemm dependency
    { name = "sysctl", version = "=0.5.5" },      # old gemm dependency
    { name = "dyn-stack", version = "=0.10.0" },  # old gemm dependency

    # Dev/build dependencies - Different contexts (acceptable)
    { name = "itertools", version = "=0.10.5" },  # criterion dev-dependency
    { name = "itertools", version = "=0.12.1" },  # bindgen build-dependency
    { name = "itertools", version = "=0.13.0" },  # ratatui dependency (no stable 0.14 release yet)

    # Transitive deps requiring upstream updates
    { name = "tower", version = "=0.4.13" },      # jsonrpsee v0.24.x requirement
    { name = "base64", version = "=0.13.1" },     # spm_precompiled via tokenizers
    { name = "base64", version = "=0.21.7" },     # tiktoken-rs v0.6.0
    { name = "tungstenite", version = "=0.23.0" }, # chromiumoxide v0.7.0

    # Minor duplicates with low impact
    { name = "fancy-regex", version = "=0.13.0" }, # candle-transformers dependency
    { name = "fancy-regex", version = "=0.14.0" }, # tokenizers older version
    { name = "compact_str", version = "=0.8.1" },  # ratatui dependency
    { name = "bit-set", version = "=0.5.3" },      # old syntect dependency
    { name = "bit-vec", version = "=0.6.3" },      # old syntect dependency
]

# skip-tree entries ignore entire dependency trees
skip-tree = [
    # Candle and llama-cpp C++ ecosystems - feature-gated behind llm-local
    { name = "candle-core", version = "0.9.1" },
    { name = "candle-nn", version = "0.9.1" },
    { name = "candle-transformers", version = "0.9.1" },
]

[licenses]
unlicensed = "deny"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
deny = []
copyleft = "warn"
allow-osi-fsf-free = "both"
default = "deny"
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
