[package]
name = "arkavo-agent-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent authorization client for Arkavo Edge CLI"

[dependencies]
arkavo-crypto = { path = "../arkavo-crypto" }
arkavo-tls = { path = "../arkavo-tls", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "time"] }
chrono = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }
arkavo-tls = { path = "../arkavo-tls", features = ["fallback-aws-lc-rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
wiremock = "0.6"
