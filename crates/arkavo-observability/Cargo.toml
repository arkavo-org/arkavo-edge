[package]
name = "arkavo-observability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Observability infrastructure for Arkavo Edge"

[dependencies]
# Async trait
async-trait.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "sync"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Time
chrono.workspace = true

# Metrics
uuid.workspace = true

# Configuration
regex = { workspace = true }
toml = { workspace = true }

# System metrics
sysinfo = { workspace = true }

# ARP types for DecisionTrace
arkavo-arp = { path = "../arkavo-arp" }
arkavo-crypto = { path = "../arkavo-crypto", optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
signing = ["arkavo-crypto"]