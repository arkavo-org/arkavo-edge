[package]
name = "arkavo-dpop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DPoP proof-of-possession for arkavo-edge"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
ecdsa = { version = "0.16.9", features = ["signing", "verifying"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
