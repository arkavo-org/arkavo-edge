[package]
name = "arkavo-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI Core for the Arkavo agentic CLI tool - command parser and multi-step agent loop"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = ["memory"]
memory = ["arkavo-test/memory"]
embeddings = ["memory", "arkavo-memory/embeddings", "arkavo-test/embeddings"]

[dependencies]
arkavo-terminal = { path = "../arkavo-terminal" }
arkavo-git = { path = "../arkavo-git" }
arkavo-test = { path = "../arkavo-test" }
arkavo-llm = { path = "../arkavo-llm" }
arkavo-memory = { path = "../arkavo-memory", default-features = false }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-dataflow = { path = "../arkavo-dataflow" }
async-trait = "0.1"
log = "0.4"
anyhow = "1.0"
jsonschema = "0.26"
tokio = { version = "1.41", features = ["rt", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
lru = "0.12"
ignore = "0.4"
indicatif = "0.17"
tiktoken-rs = "0.6"
sha2 = "0.10"
[lints]
workspace = true
