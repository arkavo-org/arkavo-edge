[package]
name = "arkavo-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI Core for the Arkavo agentic CLI tool - command parser and multi-step agent loop"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
# Default features - portable across all platforms with pure Rust mDNS
default = ["memory", "mdns", "mcp-tools", "llm-remote", "llama-cpp", "web-ui"]
# Default features for Windows (no C++ dependencies)
windows-default = ["memory", "mdns", "llm-remote", "arkavo-agui/windows", "arkavo-router/windows", "web-ui"]
mcp-tools = ["dep:arkavo-mcp-macos", "dep:arkavo-mcp-tools", "dep:arkavo-mesh-tools", "arkavo-router/gemini"]
memory = []
embeddings = ["memory", "arkavo-memory/embeddings"]
mdns = ["mdns-sd", "arkavo-agui/mdns", "arkavo-protocol/mdns"]
llm-remote = ["arkavo-llm/llm-remote", "arkavo-dataflow/llm-remote", "arkavo-terminal/llm-remote", "arkavo-router/llm-remote"]
kimi = ["arkavo-llm/kimi"]
deepseek = ["arkavo-llm/deepseek"]
gemini = ["arkavo-llm/gemini", "arkavo-router/gemini"]
llama-cpp = ["arkavo-llm/llama-cpp", "arkavo-agui/llama-cpp", "arkavo-ui-core/llama-cpp", "arkavo-router/llama-cpp"]
snpe = ["arkavo-llm/snpe"]
cef-ui = ["dep:arkavo-cef", "arkavo-agui/cef-ui", "arkavo-ui-core/cef-ui"]
web-ui = ["arkavo-agui/web-ui", "arkavo-ui-core/web-ui"]
iroh = ["dep:arkavo-tdf-iroh"]

[dependencies]
arkavo-terminal = { path = "../arkavo-terminal", features = ["llm-remote"] }
arkavo-git = { path = "../arkavo-git" }
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-memory = { path = "../arkavo-memory", default-features = false }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-core = { path = "../arkavo-mcp-core" }
arkavo-mcp-runtime = { path = "../arkavo-mcp-runtime" }
arkavo-dataflow = { path = "../arkavo-dataflow", default-features = false, features = ["nl", "sandbox"] }
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-repo = { path = "../arkavo-repo" }
arkavo-router = { path = "../arkavo-router", default-features = false }
arkavo-agui = { path = "../arkavo-agui", default-features = false, features = ["mdns"] }
arkavo-ui-core = { path = "../arkavo-ui-core", default-features = false }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-orchestrator = { path = "../arkavo-orchestrator" }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-events = { path = "../arkavo-events" }
arkavo-github = { path = "../arkavo-github" }
arkavo-cef = { path = "../arkavo-cef", optional = true }
arkavo-device-identity = { path = "../arkavo-device-identity" }
arkavo-crypto = { path = "../arkavo-crypto" }
arkavo-registration = { path = "../arkavo-registration" }
arkavo-tdf = { path = "../arkavo-tdf", features = ["opentdf", "kas"] }
arkavo-tdf-iroh = { path = "../arkavo-tdf-iroh", optional = true }
mdns-sd = { workspace = true, optional = true }
async-trait = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "fs", "process"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true, features = ["cargo"] }
indicatif = { workspace = true }
tiktoken-rs = { workspace = true }
hf-hub = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
arkavo-kimi = { path = "../arkavo-kimi" }
arkavo-budget = { path = "../arkavo-budget" }

# macOS-only dependencies
[target.'cfg(target_os = "macos")'.dependencies]
arkavo-mcp-macos = { path = "../arkavo-mcp-macos", optional = true }

# Unix dependencies (macOS and Linux)
[target.'cfg(unix)'.dependencies]
arkavo-mcp-tools = { path = "../arkavo-mcp-tools", optional = true }
arkavo-mesh-tools = { path = "../arkavo-mesh-tools", optional = true }


[lints]
workspace = true
