[package]
name = "arkavo-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI Core for the Arkavo agentic CLI tool - command parser and multi-step agent loop"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
# Full defaults with all providers (cross-platform)
default = ["memory", "mdns", "mcp-tools", "llm-remote", "llama-cpp", "gemini", "deepseek", "kimi", "web-ui", "claude-agent", "kas", "iroh"]
# Minimal feature set for non-typical use cases
minimal = ["memory", "mdns", "mcp-tools"]
# Default features for Windows (no C++ dependencies)
windows-default = ["memory", "mdns", "mcp-tools", "llm-remote", "arkavo-agui/windows", "arkavo-router/windows", "web-ui"]
# MCP mesh networking and router integration
mcp-tools = ["dep:arkavo-mcp-mesh", "arkavo-router/gemini"]
# macOS-specific MCP integration (auto-enabled on macOS when mcp-tools is enabled)
mcp-macos = ["dep:arkavo-mcp-macos"]
# Claude Agent SDK integration (requires non-musl target for OAuth)
claude-agent = ["dep:arkavo-mcp-claude", "arkavo-server/claude-agent"]
memory = []
embeddings = ["memory", "arkavo-memory/embeddings"]
mdns = ["mdns-sd", "arkavo-agui/mdns", "arkavo-protocol/mdns", "arkavo-orchestrator/mdns"]
llm-remote = ["arkavo-llm/llm-remote", "arkavo-dataflow/llm-remote", "arkavo-terminal/llm-remote", "arkavo-router/llm-remote"]
kimi = ["arkavo-llm/kimi"]
deepseek = ["arkavo-llm/deepseek"]
gemini = ["arkavo-llm/gemini", "arkavo-router/gemini"]
llama-cpp = ["arkavo-llm/llama-cpp", "arkavo-agui/llama-cpp", "arkavo-ui-core/llama-cpp", "arkavo-router/llama-cpp", "arkavo-context/llama-cpp"]
snpe = ["arkavo-llm/snpe"]
cef-ui = ["dep:arkavo-cef", "arkavo-agui/cef-ui", "arkavo-ui-core/cef-ui"]
web-ui = ["arkavo-agui/web-ui", "arkavo-ui-core/web-ui"]
iroh = ["dep:arkavo-tdf-iroh", "arkavo-server/iroh"]
kas = ["arkavo-protocol/kas", "arkavo-tdf/kas", "arkavo-server/kas"]

[dependencies]
arkavo-terminal = { path = "../arkavo-terminal", features = ["llm-remote"] }
arkavo-git = { path = "../arkavo-git" }
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-memory = { path = "../arkavo-memory", default-features = false }
arkavo-context = { path = "../arkavo-context", default-features = false }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-identity = { path = "../arkavo-mcp-identity" }
arkavo-mcp-runtime = { path = "../arkavo-mcp-runtime" }
arkavo-dataflow = { path = "../arkavo-dataflow", default-features = false, features = ["nl", "sandbox"] }
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-session = { path = "../arkavo-session" }
arkavo-server = { path = "../arkavo-server" }
arkavo-repo = { path = "../arkavo-repo" }
arkavo-router = { path = "../arkavo-router", default-features = false, features = ["persistence"] }
arkavo-critic = { path = "../arkavo-critic" }
arkavo-agui = { path = "../arkavo-agui", default-features = false, features = ["mdns"] }
arkavo-ui-core = { path = "../arkavo-ui-core", default-features = false }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-orchestrator = { path = "../arkavo-orchestrator" }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-events = { path = "../arkavo-events" }
arkavo-hrm = { path = "../arkavo-hrm" }
arkavo-ucp = { path = "../arkavo-ucp" }
arkavo-github = { path = "../arkavo-github" }
arkavo-cef = { path = "../arkavo-cef", optional = true }
arkavo-device-identity = { path = "../arkavo-device-identity" }
arkavo-crypto = { path = "../arkavo-crypto" }
arkavo-gossip = { path = "../arkavo-gossip" }
arkavo-registration = { path = "../arkavo-registration" }
arkavo-agent-auth = { path = "../arkavo-agent-auth" }
arkavo-tdf = { path = "../arkavo-tdf", features = ["opentdf"] }
arkavo-tdf-iroh = { path = "../arkavo-tdf-iroh", optional = true }
arkavo-config-encryption = { path = "../arkavo-config-encryption" }
arkavo-config-bundle = { path = "../arkavo-config-bundle" }
base64 = { workspace = true }
mdns-sd = { workspace = true, optional = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "fs", "process"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true, features = ["cargo"] }
hf-hub = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }

# Cross-platform MCP tools (always available)
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-mcp-mesh = { path = "../arkavo-mcp-mesh", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Claude Agent SDK integration (optional, requires non-musl target for OAuth)
arkavo-mcp-claude = { path = "../arkavo-mcp-claude", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
arkavo-kimi = { path = "../arkavo-kimi" }
arkavo-budget = { path = "../arkavo-budget" }

# macOS-only dependencies
[target.'cfg(target_os = "macos")'.dependencies]
arkavo-mcp-macos = { path = "../arkavo-mcp-macos", optional = true }


[lints]
workspace = true
