[package]
name = "arkavo-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI Core for the Arkavo agentic CLI tool - command parser and multi-step agent loop"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = ["memory", "mdns", "local"]
memory = ["arkavo-test/memory"]
embeddings = ["memory", "arkavo-memory/embeddings", "arkavo-test/embeddings"]
mdns = ["zeroconf", "arkavo-agui/mdns", "arkavo-protocol/mdns"]
local = ["dep:arkavo-llm", "arkavo-llm/local", "arkavo-dataflow/local", "arkavo-terminal/llm-local"]
metal = ["arkavo-llm?/metal"]
llm-remote = ["dep:arkavo-llm", "arkavo-llm/llm-remote", "arkavo-dataflow/llm-remote", "arkavo-terminal/llm-remote"]

[dependencies]
arkavo-terminal = { path = "../arkavo-terminal", default-features = false }
arkavo-git = { path = "../arkavo-git" }
arkavo-test = { path = "../arkavo-test" }
arkavo-llm = { path = "../arkavo-llm", optional = true }
arkavo-memory = { path = "../arkavo-memory", default-features = false }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-dataflow = { path = "../arkavo-dataflow", default-features = false, features = ["nl", "sandbox", "llm-remote"] }
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-repo = { path = "../arkavo-repo" }
arkavo-agui = { path = "../arkavo-agui", default-features = false }
gethostname = "0.5"
zeroconf = { version = "0.14", optional = true }
async-trait = { workspace = true }
log = "0.4"
anyhow = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "fs", "process"] }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true, features = ["cargo"] }
indicatif = "0.17"
tiktoken-rs = "0.6"

# Automatically enable metal feature on macOS
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
arkavo-llm = { path = "../arkavo-llm", optional = true, features = ["metal"] }

[lints]
workspace = true
