<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkavo Agent Orchestration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Light mode colors */
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #95a5a6;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --info-color: #3498db;
            --hover-bg: #f8f9fa;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark mode colors */
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-muted: #7f8c8d;
                --border-color: #404040;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --success-color: #2ecc71;
                --error-color: #e74c3c;
                --info-color: #5dade2;
                --hover-bg: #3a3a3a;
            }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 30px;
            color: var(--text-primary);
        }
        
        .status {
            background: var(--bg-secondary);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px var(--shadow-color);
            border: 1px solid var(--border-color);
        }
        
        .status.connected {
            border-left: 4px solid var(--success-color);
        }
        
        .status.disconnected {
            border-left: 4px solid var(--error-color);
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .agent-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            border: 1px solid var(--border-color);
        }
        
        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-color);
            background: var(--hover-bg);
        }
        
        .agent-card h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .agent-card .purpose {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .agent-card .details {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .agent-card .details div {
            margin-bottom: 5px;
        }
        
        .no-agents {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .no-agents code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: var(--text-secondary);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            margin: 50px auto;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 20px var(--shadow-color);
            border: 1px solid var(--border-color);
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }
        
        .close:hover {
            color: var(--text-primary);
        }
        
        .method-select {
            margin: 20px 0;
        }
        
        .method-select select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .params-form {
            margin: 20px 0;
        }
        
        .param-field {
            margin-bottom: 15px;
        }
        
        .param-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .param-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .button {
            background: var(--info-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .response {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
        }
        
        .error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            border-color: var(--error-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arkavo Agent Orchestration</h1>
        
        <div class="status disconnected" id="status">
            <strong>Status:</strong> <span id="status-text">Connecting to discovery service...</span>
        </div>
        
        <div id="agents-container">
            <div class="no-agents">
                <h2>No agents discovered</h2>
                <p>Start an agent with: <code>arkavo agent run</code></p>
            </div>
        </div>
    </div>
    
    <div class="modal" id="agent-modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-agent-name"></h2>
            <p id="modal-agent-purpose" class="purpose"></p>
            
            <div id="modal-features" style="margin: 15px 0; padding: 10px; background: var(--bg-primary); border-radius: 4px; display: none;">
                <h4 style="margin-bottom: 10px;">Agent Features</h4>
                <div id="modal-features-content"></div>
            </div>
            
            <div class="method-select">
                <label for="method">Select method:</label>
                <select id="method" onchange="updateParams()">
                    <option value="">Loading methods...</option>
                </select>
            </div>
            
            <div class="params-form" id="params-form"></div>
            
            <button class="button" onclick="sendRequest()">Send Request</button>
            
            <button class="button" style="margin-left: 10px; background: var(--success-color);" onclick="testDiscoverFeatures()">Test Discover Features</button>
            
            <div id="response-container"></div>
        </div>
    </div>
    
    <script>
        let discoveredAgents = {};
        let currentAgent = null;
        let agentMethods = {};
        
        // Connect to SSE for agent discovery
        const eventSource = new EventSource('/events');
        
        eventSource.addEventListener('discovery', function(event) {
            const data = JSON.parse(event.data);
            updateAgents(data.agents || []);
        });
        
        eventSource.addEventListener('open', function() {
            document.getElementById('status').className = 'status connected';
            document.getElementById('status-text').textContent = 'Connected - Discovering agents...';
        });
        
        eventSource.addEventListener('error', function() {
            document.getElementById('status').className = 'status disconnected';
            document.getElementById('status-text').textContent = 'Disconnected - Retrying...';
        });
        
        function updateAgents(agents) {
            discoveredAgents = {};
            agents.forEach(agent => {
                discoveredAgents[agent.id] = agent;
            });
            
            renderAgents();
        }
        
        function renderAgents() {
            const container = document.getElementById('agents-container');
            
            if (Object.keys(discoveredAgents).length === 0) {
                container.innerHTML = `
                    <div class="no-agents">
                        <h2>No agents discovered</h2>
                        <p>Start an agent with: <code>arkavo agent run</code></p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="agents-grid" id="agents-grid"></div>';
            const grid = document.getElementById('agents-grid');
            
            Object.values(discoveredAgents).forEach(agent => {
                const card = document.createElement('div');
                card.className = 'agent-card';
                card.onclick = () => openAgent(agent);
                
                card.innerHTML = `
                    <h3>${agent.name}</h3>
                    <p class="purpose">${agent.purpose}</p>
                    <div class="details">
                        <div><strong>Model:</strong> ${agent.model}</div>
                        <div><strong>Endpoint:</strong> ${agent.endpoint}</div>
                        <div id="features-${agent.id}"></div>
                    </div>
                `;
                
                grid.appendChild(card);
                
                // Fetch discover features for each agent
                fetchDiscoverFeatures(agent);
            });
        }
        
        async function fetchDiscoverFeatures(agent) {
            try {
                const response = await fetch(`http://${agent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'agent_discover',
                        params: {},
                        id: Date.now()
                    })
                });
                
                const data = await response.json();
                const featuresDiv = document.getElementById(`features-${agent.id}`);
                
                if (data.result && data.result.length > 0 && data.result[0].metadata) {
                    const features = data.result[0].metadata;
                    let featuresHtml = '';
                    
                    // Check for MCP tools
                    if (features.mcp_tools && Array.isArray(features.mcp_tools) && features.mcp_tools.length > 0) {
                        featuresHtml += `<div style="margin-top: 8px; color: var(--info-color);"><strong>MCP Tools:</strong> ${features.mcp_tools.length} available</div>`;
                        
                        // Show first few tool names
                        const toolsToShow = features.mcp_tools.slice(0, 3);
                        const toolNames = toolsToShow.join(', ');
                        const moreTools = features.mcp_tools.length > 3 ? ` +${features.mcp_tools.length - 3} more` : '';
                        featuresHtml += `<div style="font-size: 11px; color: var(--text-muted); margin-left: 10px;">${toolNames}${moreTools}</div>`;
                    }
                    
                    // Check for MCP servers
                    if (features.mcp_servers && typeof features.mcp_servers === 'object' && Object.keys(features.mcp_servers).length > 0) {
                        const serverCount = Object.keys(features.mcp_servers).length;
                        featuresHtml += `<div style="margin-top: 8px; color: var(--success-color);"><strong>MCP Servers:</strong> ${serverCount} connected</div>`;
                        
                        // Show server names and statuses
                        const serverHtml = Object.entries(features.mcp_servers).map(([name, status]) => 
                            `${name}: ${status}`
                        ).slice(0, 2).join(', ');
                        const moreServers = serverCount > 2 ? ` +${serverCount - 2} more` : '';
                        featuresHtml += `<div style="font-size: 11px; color: var(--text-muted); margin-left: 10px;">${serverHtml}${moreServers}</div>`;
                    }
                    
                    featuresDiv.innerHTML = featuresHtml;
                }
            } catch (error) {
                console.error('Failed to fetch discover features:', error);
            }
        }
        
        async function openAgent(agent) {
            currentAgent = agent;
            document.getElementById('modal-agent-name').textContent = agent.name;
            document.getElementById('modal-agent-purpose').textContent = agent.purpose;
            document.getElementById('agent-modal').style.display = 'block';
            
            // Fetch agent discover features for modal
            try {
                const discoverResponse = await fetch(`http://${agent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'agent_discover',
                        params: {},
                        id: Date.now()
                    })
                });
                
                const discoverData = await discoverResponse.json();
                if (discoverData.result && discoverData.result.length > 0 && discoverData.result[0].metadata) {
                    const features = discoverData.result[0].metadata;
                    const modalFeatures = document.getElementById('modal-features');
                    const modalFeaturesContent = document.getElementById('modal-features-content');
                    
                    let featuresHtml = '';
                    
                    // Show MCP tools in detail
                    if (features.mcp_tools && Array.isArray(features.mcp_tools) && features.mcp_tools.length > 0) {
                        featuresHtml += '<div style="margin-bottom: 15px;">';
                        featuresHtml += `<h5>MCP Tools (${features.mcp_tools.length})</h5>`;
                        featuresHtml += '<ul style="margin: 5px 0; padding-left: 20px;">';
                        features.mcp_tools.forEach(tool => {
                            featuresHtml += `<li>${tool}</li>`;
                        });
                        featuresHtml += '</ul></div>';
                    }
                    
                    // Show MCP servers in detail
                    if (features.mcp_servers && typeof features.mcp_servers === 'object' && Object.keys(features.mcp_servers).length > 0) {
                        featuresHtml += '<div>';
                        featuresHtml += `<h5>MCP Servers</h5>`;
                        featuresHtml += '<ul style="margin: 5px 0; padding-left: 20px;">';
                        Object.entries(features.mcp_servers).forEach(([name, status]) => {
                            featuresHtml += `<li><strong>${name}:</strong> ${status}</li>`;
                        });
                        featuresHtml += '</ul></div>';
                    }
                    
                    if (featuresHtml) {
                        modalFeaturesContent.innerHTML = featuresHtml;
                        modalFeatures.style.display = 'block';
                    } else {
                        modalFeatures.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Failed to fetch discover features for modal:', error);
            }
            
            // Fetch available methods
            try {
                const response = await fetch(`http://${agent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'rpc.discover',
                        params: {},
                        id: 1
                    })
                });
                
                const data = await response.json();
                if (data.result && data.result.methods) {
                    agentMethods[agent.id] = data.result.methods;
                    updateMethodSelect(data.result.methods);
                }
            } catch (error) {
                console.error('Failed to fetch methods:', error);
                document.getElementById('method').innerHTML = '<option value="">Failed to load methods</option>';
            }
        }
        
        function updateMethodSelect(methods) {
            const select = document.getElementById('method');
            select.innerHTML = '<option value="">Select a method</option>';
            
            methods.forEach(method => {
                const option = document.createElement('option');
                option.value = method.name;
                option.textContent = method.name;
                select.appendChild(option);
            });
            
            // Auto-select promise_request for demo
            if (methods.find(m => m.name === 'promise_request')) {
                select.value = 'promise_request';
                updateParams();
            }
        }
        
        function updateParams() {
            const methodName = document.getElementById('method').value;
            const paramsForm = document.getElementById('params-form');
            
            if (!methodName || !currentAgent) {
                paramsForm.innerHTML = '';
                return;
            }
            
            const methods = agentMethods[currentAgent.id] || [];
            const method = methods.find(m => m.name === methodName);
            
            if (!method) {
                paramsForm.innerHTML = '';
                return;
            }
            
            // For promise_request, show specific fields
            if (methodName === 'promise_request') {
                paramsForm.innerHTML = `
                    <div class="param-field">
                        <label for="agent_id">Agent ID:</label>
                        <input type="text" id="agent_id" value="${currentAgent.id}" />
                    </div>
                    <div class="param-field">
                        <label for="promise_type">Promise Type:</label>
                        <input type="text" id="promise_type" value="generate_docs" />
                    </div>
                    <div class="param-field">
                        <label for="repo_url">Repository URL:</label>
                        <input type="text" id="repo_url" placeholder="https://github.com/arkavo-org/arkavo-edge" />
                    </div>
                `;
            } else {
                // Generic parameter fields based on method schema
                paramsForm.innerHTML = '<p>Parameters for this method</p>';
            }
        }
        
        async function sendRequest() {
            const methodName = document.getElementById('method').value;
            if (!methodName || !currentAgent) return;
            
            const responseContainer = document.getElementById('response-container');
            responseContainer.innerHTML = '<div class="response">Sending request...</div>';
            
            let params = {};
            
            // Collect parameters based on method
            if (methodName === 'promise_request') {
                const repoUrl = document.getElementById('repo_url').value;
                params = {
                    agent_id: document.getElementById('agent_id').value,
                    promise_type: document.getElementById('promise_type').value,
                    payload: repoUrl ? { repo_url: repoUrl } : null
                };
            }
            
            try {
                const response = await fetch(`http://${currentAgent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: methodName,
                        params: params,
                        id: Date.now()
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    responseContainer.innerHTML = `<div class="response error">Error: ${JSON.stringify(data.error, null, 2)}</div>`;
                } else {
                    responseContainer.innerHTML = `<div class="response">Response: ${JSON.stringify(data.result, null, 2)}</div>`;
                }
            } catch (error) {
                responseContainer.innerHTML = `<div class="response error">Request failed: ${error.message}</div>`;
            }
        }
        
        function closeModal() {
            document.getElementById('agent-modal').style.display = 'none';
            document.getElementById('response-container').innerHTML = '';
        }
        
        async function testDiscoverFeatures() {
            if (!currentAgent) return;
            
            const responseContainer = document.getElementById('response-container');
            responseContainer.innerHTML = '<div class="response">Testing DIDComm Discover Features...</div>';
            
            try {
                // Test discover_features_disclose (proactive disclosure)
                const discloseResponse = await fetch(`http://${currentAgent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'discover_features_disclose',
                        params: {},
                        id: Date.now()
                    })
                });
                
                const discloseData = await discloseResponse.json();
                
                // Test discover_features_query with filter
                const queryResponse = await fetch(`http://${currentAgent.endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'discover_features_query',
                        params: {
                            queries: [
                                { 'feature-type': 'protocol', match: 'https://didcomm.org/*' },
                                { 'feature-type': 'mcp-tool' }
                            ]
                        },
                        id: Date.now() + 1
                    })
                });
                
                const queryData = await queryResponse.json();
                
                let html = '<div class="response"><h4>DIDComm Discover Features Test Results</h4>';
                
                // Show proactive disclosure results
                html += '<h5>Proactive Disclosure (discover_features_disclose)</h5>';
                if (discloseData.result && discloseData.result.disclosures) {
                    html += `<p>Total features: ${discloseData.result.disclosures.length}</p>`;
                    html += '<ul style="max-height: 200px; overflow-y: auto;">';
                    discloseData.result.disclosures.forEach(feature => {
                        html += `<li><strong>${feature['feature-type']}:</strong> ${feature.id}`;
                        if (feature.roles) {
                            html += ` (roles: ${feature.roles.join(', ')})`;
                        }
                        html += '</li>';
                    });
                    html += '</ul>';
                } else if (discloseData.error) {
                    html += `<p class="error">Error: ${JSON.stringify(discloseData.error)}</p>`;
                }
                
                // Show query results
                html += '<h5>Filtered Query (protocols and MCP tools)</h5>';
                if (queryData.result && queryData.result.disclosures) {
                    html += `<p>Filtered features: ${queryData.result.disclosures.length}</p>`;
                    html += '<ul style="max-height: 200px; overflow-y: auto;">';
                    queryData.result.disclosures.forEach(feature => {
                        html += `<li><strong>${feature['feature-type']}:</strong> ${feature.id}`;
                        if (feature.roles) {
                            html += ` (roles: ${feature.roles.join(', ')})`;
                        }
                        html += '</li>';
                    });
                    html += '</ul>';
                } else if (queryData.error) {
                    html += `<p class="error">Error: ${JSON.stringify(queryData.error)}</p>`;
                }
                
                html += '</div>';
                responseContainer.innerHTML = html;
                
            } catch (error) {
                responseContainer.innerHTML = `<div class="response error">Request failed: ${error.message}</div>`;
            }
        }
        
    </script>
</body>
</html>
