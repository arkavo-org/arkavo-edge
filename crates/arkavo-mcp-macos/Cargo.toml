[package]
name = "arkavo-mcp-macos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "macOS-specific MCP tools for Arkavo - iOS simulator, XCTest, and Apple platform testing"
repository = "https://github.com/arkavo-com/arkavo-edge"
readme = "README.md"
keywords = ["mcp", "macos", "ios", "xctest", "simulator"]
categories = ["development-tools::testing", "development-tools"]

[features]
default = ["memory"]
# Enable memory tools (works with or without embeddings)
memory = ["arkavo-memory"]
# Enable embeddings support for memory tools
embeddings = ["memory", "arkavo-memory/embeddings"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Memory integration
arkavo-memory = { path = "../arkavo-memory", features = ["vector-search"], optional = true }

# MCP types
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-repo = { path = "../arkavo-repo" }
arkavo-git = { path = "../arkavo-git" }
arkavo-validation = { path = "../arkavo-validation" }

# Gherkin parsing
gherkin = "0.14"

# HTTP client for AI integration
reqwest = { workspace = true }

# Time handling
chrono = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Random number generation
rand = { workspace = true }

# Regular expressions for ANSI code stripping
regex = { workspace = true }

# Base64 encoding for screenshots
base64 = { workspace = true }

# Template engine for reporting
handlebars = { workspace = true }

# Test utilities
async-trait = { workspace = true }

# File system
glob = "0.3"

# JSON Schema validation
jsonschema = { workspace = true }

# System calls (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"


[dev-dependencies]
tempfile = { workspace = true }
[lints]
workspace = true
