[package]
name = "arkavo-server"
version.workspace = true
edition.workspace = true
authors = ["Arkavo Contributors"]
license = "Apache-2.0"
description = "A2A server implementation for the Arkavo agentic CLI tool"
repository.workspace = true
keywords = ["server", "a2a", "json-rpc", "agent", "protocol"]
categories = ["network-programming", "web-programming"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# JSON-RPC implementation
jsonrpsee = { workspace = true }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }

# Networking
reqwest = { workspace = true, features = ["stream"] }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true, features = ["std", "tls12"] }
webpki-roots = { workspace = true }

# Server dependencies
governor = { workspace = true, features = ["std", "jitter"] }
dashmap = { workspace = true }
crossbeam-queue = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# JWT authentication
jsonwebtoken = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
notify = { workspace = true }
rand = { workspace = true }
sysinfo = { workspace = true }
torg-core = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }

# Database
sqlx = { workspace = true }

# Schema generation
schemars = { workspace = true }

# mDNS dependencies
if-addrs = { workspace = true, optional = true }

# Metrics dependencies
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

# Arkavo internal dependencies
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-agent = { path = "../arkavo-agent" }
arkavo-security = { path = "../arkavo-security" }
arkavo-tasks = { path = "../arkavo-tasks" }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-memory = { path = "../arkavo-memory" }
arkavo-lesson-synthesis = { path = "../arkavo-lesson-synthesis" }
arkavo-llm = { path = "../arkavo-llm", default-features = false, features = ["kimi"] }
# Direct llama.cpp handle for LlamaTokenEstimator (real tokenizer); only under llama-cpp.
arkavo-llama-cpp = { path = "../arkavo-llama-cpp", optional = true }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-router = { path = "../arkavo-router", default-features = false, features = ["advisor-persistence", "persistence"] }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-events = { path = "../arkavo-events" }
arkavo-crypto = { path = "../arkavo-crypto" }
arkavo-evofabric = { path = "../arkavo-evofabric" }
arkavo-hrm = { path = "../arkavo-hrm" }
arkavo-mcp-mesh = { path = "../arkavo-mcp-mesh" }
arkavo-gossip = { path = "../arkavo-gossip" }
arkavo-autolearn = { path = "../arkavo-autolearn" }
arkavo-ensemble = { path = "../arkavo-ensemble" }
arkavo-ucp = { path = "../arkavo-ucp" }
arkavo-critic = { path = "../arkavo-critic" }
arkavo-trust = { path = "../arkavo-trust" }
arkavo-device-identity = { path = "../arkavo-device-identity" }
arkavo-arp = { path = "../arkavo-arp" }
arkavo-arp-runtime = { path = "../arkavo-arp-runtime" }
ed25519-dalek = { workspace = true }
arkavo-tdf = { path = "../arkavo-tdf", features = ["a2a"], optional = true }
arkavo-tdf-iroh = { path = "../arkavo-tdf-iroh" }
# kas-only: the agent-loop apply_swarmkit tool runs the orchestrator's
# apply_kit pipeline (match -> TDF-wrap -> ship over Iroh -> dispatch).
arkavo-orchestrator = { path = "../arkavo-orchestrator", optional = true }

# Claude Agent SDK integration (optional, requires non-musl target for OAuth)
arkavo-mcp-claude = { path = "../arkavo-mcp-claude", optional = true }

# Demo dependencies
clap = { workspace = true, optional = true }

[features]
default = ["kas"]
demo = ["clap", "tracing-subscriber"]
stub_handlers = []
mdns = ["if-addrs"]
metrics = ["dep:metrics", "metrics-exporter-prometheus"]
kas = ["dep:arkavo-tdf", "arkavo-router/tdf-encrypt", "arkavo-protocol/kas"]
iroh = []
# Agent-loop SwarmKit apply tool. Off by default: it pulls arkavo-orchestrator
# (which forces the router/llama-cpp stack), so standalone server builds stay
# light and C++-free unless this is explicitly enabled (the CLI turns it on).
swarm-apply = ["kas", "iroh", "dep:arkavo-orchestrator", "arkavo-orchestrator/kas"]
# The real LlamaTokenEstimator in agent_loop.rs is gated on this feature and
# calls Router::any_loaded_model() / min_feasible_context_size(), which only
# exist under arkavo-router's own llama-cpp feature. Propagate it here so the
# real tokenizer compiles and budget/window trimming stops falling back to the
# chars/4 MockEstimator.
llama-cpp = ["arkavo-llm/llama-cpp", "arkavo-router/llama-cpp", "dep:arkavo-llama-cpp"]
claude-agent = ["dep:arkavo-mcp-claude"]
# Taint-aware egress enforcement in the conductor's tool loop (SEQ-003, SEQ-014,
# SEQ-015). Off until the sequence-integrity work reaches GA.
taint = ["arkavo-protocol/taint", "arkavo-arp-runtime/taint"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
arkavo-test-macros = { path = "../arkavo-test-macros" }

[lints]
workspace = true
