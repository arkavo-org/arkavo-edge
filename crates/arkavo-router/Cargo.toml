[package]
name = "arkavo-router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Intelligent model routing for cost-optimized AI agent execution"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hf-hub = { workspace = true }
glob = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
rand_distr = "0.4"
regex = { workspace = true }
sha2 = { workspace = true }
dashmap = { workspace = true }
torg-core = { workspace = true }
torg-serde = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"], optional = true }

# Internal dependencies
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-gemini = { path = "../arkavo-gemini", optional = true }
arkavo-context = { path = "../arkavo-context", default-features = false }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-torg-circuits = { path = "../arkavo-torg-circuits" }
arkavo-critic = { path = "../arkavo-critic" }
arkavo-memory = { path = "../arkavo-memory", default-features = false, optional = true }
arkavo-tdf = { path = "../arkavo-tdf", optional = true, features = ["opentdf"] }
uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = ["llama-cpp", "gemini", "deepseek", "kimi", "glm", "xai"]
critic = []
advisor-persistence = ["dep:arkavo-memory"]
llama-cpp = ["arkavo-llm/llama-cpp"]
gemini = ["arkavo-llm/gemini", "arkavo-gemini"]
deepseek = ["arkavo-llm/deepseek"]
kimi = ["arkavo-llm/kimi"]
# GLM-5.2 routes through the generic OpenAI-compatible provider, which lives
# behind arkavo-llm's `llm-remote` feature.
glm = ["arkavo-llm/llm-remote"]
# Grok 4.5 (xAI) also uses the OpenAI-compatible provider.
xai = ["arkavo-llm/llm-remote"]
llm-remote = ["arkavo-llm/llm-remote", "arkavo-context/llm-remote"]
tdf-encrypt = ["dep:arkavo-tdf", "dep:arkavo-memory"]
persistence = ["sqlx"]
# Windows compatible features (no C++ dependencies)
windows = ["gemini", "llm-remote", "deepseek", "kimi", "glm", "xai"]

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "preflight"
harness = false

[lints]
workspace = true
