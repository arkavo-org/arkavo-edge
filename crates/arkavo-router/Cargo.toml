[package]
name = "arkavo-router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Intelligent model routing for cost-optimized AI agent execution"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hf-hub = { workspace = true }
glob = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
rand_distr = "0.4"
regex = { workspace = true }

# Internal dependencies
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-gemini = { path = "../arkavo-gemini", optional = true }
arkavo-context = { path = "../arkavo-context", default-features = false }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = ["llama-cpp", "gemini", "deepseek"]
llama-cpp = ["arkavo-llm/llama-cpp"]
gemini = ["arkavo-llm/gemini", "arkavo-gemini"]
deepseek = ["arkavo-llm/deepseek"]
llm-remote = ["arkavo-llm/llm-remote", "arkavo-context/llm-remote"]
# Windows compatible features (no C++ dependencies)
windows = ["gemini", "llm-remote", "deepseek"]

[lints]
workspace = true
