[package]
name = "arkavo-router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Intelligent model routing for cost-optimized AI agent execution"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hf-hub = { workspace = true }

# Internal dependencies
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-gemini = { path = "../arkavo-gemini", optional = true }
arkavo-context = { path = "../arkavo-context", default-features = false }
arkavo-observability = { path = "../arkavo-observability" }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["llama-cpp", "gemini"]
llama-cpp = ["arkavo-llm/llama-cpp", "llm-local"]
llm-local = ["arkavo-llm/llm-local", "arkavo-context/llm-local"]
gemini = ["arkavo-llm/gemini", "arkavo-gemini"]
llm-remote = ["arkavo-llm/llm-remote", "arkavo-context/llm-remote"]
# Windows compatible features (no C++ dependencies)
windows = ["gemini", "llm-remote"]

[lints]
workspace = true
