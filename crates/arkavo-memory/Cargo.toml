[package]
name = "arkavo-memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local-first memory server with vector search for Arkavo"
repository.workspace = true
keywords = ["cli", "ai", "agent", "memory", "vector-search"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
include = ["src/**/*", "models/**/*", "build.rs", "README.md"]


[features]
default = ["vector-search"]
# Enable vector search functionality
vector-search = ["dep:hnsw_rs"]
# Enable embedding support (requires ONNX Runtime)
embeddings = ["fastembed", "vector-search"]
# Skip model downloads in build script (for CI environments without curl/wget)
skip-model-download = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "fs"] }
fastembed = { version = "4", optional = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
log = "0.4"
thiserror = { workspace = true }
anyhow = { workspace = true }
hnsw_rs = { version = "0.3", optional = true }
arkavo-mcp = { path = "../arkavo-mcp" }
async-trait = { workspace = true }
bytemuck = "1.14"

[dev-dependencies]
arkavo-events = { path = "../arkavo-events" }
