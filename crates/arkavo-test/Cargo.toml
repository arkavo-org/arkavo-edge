[package]
name = "arkavo-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Test harness for the Arkavo agentic CLI tool - local test runner adapter for various languages"
repository = "https://github.com/arkavo-com/arkavo-edge"
readme = "README.md"
keywords = ["testing", "test-harness", "automation", "ios", "xctest"]
categories = ["development-tools::testing", "development-tools"]

[features]
default = ["memory"]
# Enable memory tools (works with or without embeddings)
memory = ["arkavo-memory"]
# Enable embeddings support for memory tools
embeddings = ["memory", "arkavo-memory/embeddings"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt", "macros", "process", "fs"] }

# Error handling
thiserror = { workspace = true }

# System calls (Unix)
libc = "0.2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Memory integration
arkavo-memory = { path = "../arkavo-memory", default-features = false, optional = true }

# MCP types
arkavo-mcp = { path = "../arkavo-mcp" }

# Git integration
arkavo-git = { path = "../arkavo-git" }

# Gherkin parsing
gherkin = "0.14"

# HTTP client for AI integration
reqwest = { workspace = true }

# Time handling
chrono = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Random number generation
rand = "0.8"

# Regular expressions for ANSI code stripping
regex = { workspace = true }

# Base64 encoding for screenshots
base64 = { workspace = true }

# Template engine for reporting
handlebars = "6.3"

# Test utilities
async-trait = { workspace = true }

# File system
glob = "0.3"
walkdir = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }

[[bin]]
name = "test_swift_discovery"
path = "src/bin/test_swift_discovery.rs"

[build-dependencies]
cc = "1.0"


[dev-dependencies]
tempfile = { workspace = true }
[lints]
workspace = true
