[package]
name = "arkavo-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Test harness for the Arkavo agentic CLI tool - local test runner adapter for various languages"
repository = "https://github.com/arkavo-com/arkavo-edge"
readme = "README.md"
keywords = ["testing", "test-harness", "automation", "ios", "xctest"]
categories = ["development-tools::testing", "development-tools"]

[features]
default = ["memory"]
# Enable memory tools (works with or without embeddings)
memory = ["arkavo-memory"]
# Enable embeddings support for memory tools
embeddings = ["memory", "arkavo-memory/embeddings"]

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP protocol
arkavo-protocol = { path = "../arkavo-protocol" }

# Memory integration
arkavo-memory = { path = "../arkavo-memory", default-features = false, optional = true }

# MCP types
arkavo-mcp = { path = "../arkavo-mcp" }

# Git integration
arkavo-git = { path = "../arkavo-git" }

# Gherkin parsing
gherkin = "0.14"

# State management
bincode = "1.3"

# HTTP client for AI integration
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# Template engine for reporting
handlebars = "6.3"

# Lazy static initialization
once_cell = "1.20"

# Test utilities
futures = "0.3"
async-trait = "0.1"

# File system
glob = "0.3"
walkdir = "2.5"

# JSON Schema validation
jsonschema = "0.26"

# XCTest bridge dependencies
warp = "0.3"

[build-dependencies]
cc = "1.0"


[dev-dependencies]
criterion = "0.5"
proptest = "1.6"
tempfile = "3.14"
[lints]
workspace = true
