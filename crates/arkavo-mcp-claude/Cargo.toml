[package]
name = "arkavo-mcp-claude"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Claude Agent SDK as MCP tools for Arkavo Edge"
repository.workspace = true

[features]
default = ["oauth"]
# OAuth support (requires native-tls compatible platform - not musl)
oauth = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
glob = { workspace = true }
futures = "0.3"

# Claude Agent SDK (vendored - rustls only, no OpenSSL)
anthropic-agent-sdk = { workspace = true }

# Internal dependencies
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-authorization = { path = "../arkavo-authorization" }
arkavo-events = { path = "../arkavo-events" }
arkavo-budget = { path = "../arkavo-budget" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
anyhow = { workspace = true }

[lints]
workspace = true