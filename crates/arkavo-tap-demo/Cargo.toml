[package]
name = "arkavo-tap-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local Trusted Agent Protocol harness: a development key registry, a merchant with simulated payment, a buyer CLI and the acceptance suite"

[[bin]]
name = "arkavo-tap-demo"
path = "src/main.rs"

[dependencies]
arkavo-tap = { path = "../arkavo-tap" }
arkavo-tap-http = { path = "../arkavo-tap-http" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
