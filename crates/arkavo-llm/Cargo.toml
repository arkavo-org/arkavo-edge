[package]
name = "arkavo-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM integration for Arkavo Edge"
readme = "README.md"
keywords = ["cli", "ai", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = []
local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers", "dep:bytemuck", "dep:cfg-if", "dep:sha2", "dep:indicatif"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
tokio-stream = "0.1"
base64 = "0.22"

# Local inference dependencies (optional)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
hf-hub = { version = "0.3", optional = true, features = ["tokio"] }
tokenizers = { version = "0.21", optional = true }
bytemuck = { version = "1.20", optional = true }
cfg-if = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
indicatif = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3.0"
serial_test = "3"
[lints]
workspace = true
