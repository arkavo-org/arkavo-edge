[package]
name = "arkavo-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM integration for Arkavo Edge"
readme = "README.md"
keywords = ["cli", "ai", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = []
llm-remote = []
llm-local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers", "dep:bytemuck", "dep:cfg-if", "dep:sha2", "dep:indicatif", "dep:dirs", "dep:toml", "dep:rand"]
local = ["llm-local"]  # Alias for compatibility
# Metal feature should only be used on macOS - handle in build configuration
metal = ["candle-core?/metal", "candle-nn?/metal", "candle-transformers?/metal"]
kimi = ["dep:arkavo-kimi", "llm-remote"]

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Local inference dependencies (optional)
# Note: Metal support is handled via the metal feature, not here
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
cfg-if = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# Kimi integration
arkavo-kimi = { path = "../arkavo-kimi", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = "3"
anyhow = { workspace = true }
[lints]
workspace = true
