[package]
name = "arkavo-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM integration for Arkavo Edge"
keywords = ["cli", "ai", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = ["llm-remote"]
local = ["llama-cpp"]  # Alias for local model support
llm-remote = ["dep:reqwest", "dep:url", "dep:bytes"]
kimi = ["dep:arkavo-kimi", "dep:reqwest"]
deepseek = ["dep:arkavo-deepseek", "dep:reqwest"]
qwen = ["dep:arkavo-qwen", "dep:reqwest"]
gemini = ["dep:arkavo-gemini"]
llama-cpp = ["dep:arkavo-llama-cpp", "dep:arkavo-kv-cache", "dep:scopeguard", "dep:tokio-util"]
snpe = ["dep:arkavo-snpe"]

[dependencies]
# Core dependencies - always needed for public API
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }

# Optional dependencies for specific features
reqwest = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

rand = { workspace = true }

# Provider integrations
arkavo-kimi = { path = "../arkavo-kimi", optional = true }
arkavo-deepseek = { path = "../arkavo-deepseek", optional = true }
arkavo-qwen = { path = "../arkavo-qwen", optional = true }
arkavo-gemini = { path = "../arkavo-gemini", optional = true }
arkavo-llama-cpp = { path = "../arkavo-llama-cpp", optional = true }
arkavo-kv-cache = { path = "../arkavo-kv-cache", optional = true }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-memory = { path = "../arkavo-memory" }

# llama-cpp specific dependencies
scopeguard = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
arkavo-snpe = { path = "../arkavo-snpe", optional = true }


[dev-dependencies]
tempfile = { workspace = true }
serial_test = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "concurrent_inference_benchmark"
harness = false

[[bench]]
name = "deltanet_throughput"
harness = false
[lints]
workspace = true
