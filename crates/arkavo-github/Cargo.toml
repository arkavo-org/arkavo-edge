[package]
name = "arkavo-github"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub integration for Arkavo - orchestration, polling, and automation"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
regex.workspace = true

# External dependencies
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
serde_json.workspace = true

# Workspace crates
arkavo-memory = { path = "../arkavo-memory" }
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-tls = { path = "../arkavo-tls", default-features = false }

# Additional dependencies
uuid = { workspace = true }

[dev-dependencies]
arkavo-tls = { path = "../arkavo-tls", features = ["fallback-aws-lc-rs"] }

[lints]
workspace = true
