[package]
name = "arkavo-bench"
version = "0.33.1"
edition = "2021"

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-workspace = { path = "../arkavo-workspace" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
