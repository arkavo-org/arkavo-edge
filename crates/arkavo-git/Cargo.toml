[package]
name = "arkavo-git"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Git integration for the Arkavo agentic CLI tool - handles auto-commit, branch management, and unified-diff previews"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent", "git"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[dependencies]
# Turn off all git2 defaults (ssh, https, vendored-libgit2, etc.)
# HTTPS is handled through the system git binary as a fallback
git2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
arkavo-process-env = { path = "../arkavo-process-env" }

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }

[features]
# Features section kept for future extensions
[lints]
workspace = true
