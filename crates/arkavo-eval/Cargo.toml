[package]
name = "arkavo-eval"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Local-model evaluation pipeline for Arkavo (eval contract, gate, verdict)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
blake3 = "1.5"
torg-core = { workspace = true }
arkavo-memory = { path = "../arkavo-memory", optional = true }

[features]
default = []
embeddings = ["dep:arkavo-memory", "arkavo-memory/embeddings"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
