[package]
name = "arkavo-agent"
version.workspace = true
edition.workspace = true
authors = ["Arkavo Contributors"]
license = "Apache-2.0"
description = "Agent lifecycle management for the Arkavo agentic CLI tool - handles configuration, registry, discovery, and registration"
repository.workspace = true
keywords = ["agent", "lifecycle", "registry", "discovery", "management"]
categories = ["development-tools", "network-programming"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Time handling
chrono = { workspace = true }

# Random number generation
rand = { workspace = true }

# Cryptographic hashing
sha2 = { workspace = true }

# Hex encoding
hex = { workspace = true }

# Base64 encoding
base64 = { workspace = true }

# Utilities
uuid = { workspace = true }

# Arkavo internal dependencies
arkavo-crypto = { path = "../arkavo-crypto" }
arkavo-protocol = { path = "../arkavo-protocol" }

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }

[features]
default = []
mdns = ["arkavo-protocol/mdns"]

[lints]
workspace = true
