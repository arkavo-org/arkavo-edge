<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <title>Arkavo UI - Blank Canvas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        #prompt-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        #prompt-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        button {
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover:not(:disabled) {
            background: #4a4a4a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #fff;
        }

        button.primary:hover:not(:disabled) {
            background: #3a8eef;
        }

        #status {
            font-size: 12px;
            color: #888;
        }

        #status.connected {
            color: #4ade80;
        }

        #status.error {
            color: #ef4444;
        }

        #main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #stage {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        #status-panel {
            width: 280px;
            background: #2a2a2a;
            border-right: 1px solid #3a3a3a;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #plan-panel {
            width: 300px;
            background: #2a2a2a;
            border-left: 1px solid #3a3a3a;
            padding: 16px;
            overflow-y: auto;
            display: none;
        }

        #plan-panel.visible {
            display: block;
        }

        .status-section {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 12px;
        }

        .status-section h4 {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #aaa;
        }

        .status-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .status-value.good {
            color: #4ade80;
        }

        .status-value.warning {
            color: #fbbf24;
        }

        .status-value.error {
            color: #ef4444;
        }

        .status-update-time {
            font-size: 10px;
            color: #666;
            text-align: right;
            margin-top: 8px;
        }

        .plan-item {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .plan-item-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .plan-item-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .plan-item-status {
            font-size: 11px;
            color: #4ade80;
        }

        .plan-item-status.pending {
            color: #888;
        }

        .plan-item-status.generating {
            color: #fbbf24;
        }

        #hint-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            pointer-events: none;
        }

        #hint-overlay h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 300;
        }

        #hint-overlay p {
            font-size: 16px;
        }

        #sandbox {
            display: none;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="text" id="prompt-input" placeholder="Describe what you want to build (e.g., 'bank account + portfolio page')" />
        <button id="generate-btn" class="primary">Generate</button>
        <button id="cancel-btn" disabled>Cancel</button>
        <button id="undo-btn" disabled>Undo</button>
        <button id="redo-btn" disabled>Redo</button>
        <span id="status">Connecting...</span>
    </div>

    <div id="main-container">
        <aside id="status-panel">
            <div class="status-section">
                <h4>System Status</h4>
                <div id="system-status-content">
                    <div class="status-item">
                        <span class="status-label">Loading...</span>
                        <span class="status-value">...</span>
                    </div>
                </div>
                <div class="status-update-time" id="status-update-time">Never</div>
            </div>

            <div class="status-section">
                <h4>MCP Tools</h4>
                <div id="mcp-status-content">
                    <div class="status-item">
                        <span class="status-label">Loading...</span>
                        <span class="status-value">...</span>
                    </div>
                </div>
            </div>

            <div class="status-section">
                <h4>Remote LLM</h4>
                <div id="remote-llm-status-content">
                    <div class="status-item">
                        <span class="status-label">Loading...</span>
                        <span class="status-value">...</span>
                    </div>
                </div>
            </div>
        </aside>

        <main id="stage">
            <div id="hint-overlay">
                <h1>Blank Canvas</h1>
                <p>Enter a prompt above to start generating your UI</p>
            </div>
        </main>

        <div id="plan-panel">
            <h3 style="margin-bottom: 12px;">Build Plan</h3>
            <div id="plan-items"></div>
        </div>
    </div>

    <div id="sandbox"></div>

    <script>
        // Initial prompt injected by server (if provided via --prompt flag)
        window.INITIAL_PROMPT = null;
    </script>
    <script src="/static/toolbar.js"></script>
</body>
</html>
