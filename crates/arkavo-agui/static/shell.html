<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <title>Arkavo UI - Agent Mesh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        #prompt-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        #prompt-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        button {
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover:not(:disabled) {
            background: #4a4a4a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #fff;
        }

        button.primary:hover:not(:disabled) {
            background: #3a8eef;
        }

        #status {
            font-size: 12px;
            color: #888;
        }

        #status.connected {
            color: #4ade80;
        }

        #status.error {
            color: #ef4444;
        }

        #main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #stage {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        #status-panel {
            width: 300px;
            background: #2a2a2a;
            border-right: 1px solid #3a3a3a;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-panel {
            width: 400px;
            background: #2a2a2a;
            border-left: 1px solid #3a3a3a;
            display: none;
            flex-direction: column;
        }

        #chat-panel.visible {
            display: flex;
        }

        #chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-header h3 {
            font-size: 14px;
            color: #e0e0e0;
        }

        #close-chat-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        #close-chat-btn:hover {
            color: #e0e0e0;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
        }

        .chat-message.user {
            background: #4a9eff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-message.agent {
            background: #3a3a3a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-message.system {
            background: #1a1a1a;
            color: #888;
            align-self: center;
            font-size: 12px;
            font-style: italic;
        }

        #chat-input-container {
            padding: 12px 16px;
            border-top: 1px solid #3a3a3a;
            display: flex;
            gap: 8px;
        }

        #chat-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            resize: none;
        }

        #chat-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        #send-chat-btn {
            background: #4a9eff;
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        #send-chat-btn:hover:not(:disabled) {
            background: #3a8eef;
        }

        .status-section {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 12px;
        }

        .status-section h4 {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #aaa;
        }

        .status-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .status-value.good {
            color: #4ade80;
        }

        .status-value.warning {
            color: #fbbf24;
        }

        .status-value.error {
            color: #ef4444;
        }

        .agent-card {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .agent-card:hover {
            border-color: #4a9eff;
            background: #333;
        }

        .agent-card.selected {
            border-color: #4a9eff;
            background: #2a3a4a;
        }

        .agent-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .agent-name {
            font-weight: 600;
            color: #e0e0e0;
            font-size: 14px;
        }

        .agent-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #4ade80;
            color: #1a1a1a;
        }

        .agent-status.offline {
            background: #ef4444;
            color: #fff;
        }

        .agent-details {
            font-size: 12px;
            color: #888;
        }

        .agent-details div {
            margin-bottom: 4px;
        }

        .agent-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .agent-tool-tag {
            font-size: 10px;
            padding: 2px 6px;
            background: #3a3a3a;
            border-radius: 3px;
            color: #aaa;
        }

        #hint-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            pointer-events: none;
        }

        #hint-overlay h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 300;
        }

        #hint-overlay p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="text" id="prompt-input" placeholder="Send a message to selected agent or describe UI to generate..." />
        <button id="generate-btn" class="primary">Send</button>
        <button id="cancel-btn" disabled>Cancel</button>
        <span id="status">Connecting...</span>
    </div>

    <div id="main-container">
        <aside id="status-panel">
            <div class="status-section">
                <h4>Mesh Agents</h4>
                <div id="agents-list">
                    <div class="status-item">
                        <span class="status-label">Discovering...</span>
                    </div>
                </div>
            </div>

            <div class="status-section">
                <h4>MCP Tools</h4>
                <div id="mcp-status-content">
                    <div class="status-item">
                        <span class="status-label">Loading...</span>
                        <span class="status-value">...</span>
                    </div>
                </div>
            </div>

            <div class="status-section">
                <h4>LLMs</h4>
                <div id="remote-llm-status-content">
                    <div class="status-item">
                        <span class="status-label">Loading...</span>
                        <span class="status-value">...</span>
                    </div>
                </div>
                <div class="status-update-time" id="status-update-time">Never</div>
            </div>
        </aside>

        <main id="stage">
            <div id="hint-overlay">
                <h1>Agent Mesh</h1>
                <p>Select an agent from the sidebar to start chatting</p>
                <p style="margin-top: 8px; font-size: 14px;">Or enter a prompt to generate UI</p>
            </div>
        </main>

        <aside id="chat-panel">
            <div id="chat-header">
                <h3 id="chat-agent-name">Agent Chat</h3>
                <button id="close-chat-btn">×</button>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <textarea id="chat-input" rows="1" placeholder="Type a message..."></textarea>
                <button id="send-chat-btn">Send</button>
            </div>
        </aside>
    </div>

    <script>
        window.INITIAL_PROMPT = null;
    </script>
    <script src="/static/toolbar.js"></script>
</body>
</html>
