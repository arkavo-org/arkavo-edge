<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkavo AG-UI Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --info-color: #3498db;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --success-color: #2ecc71;
                --error-color: #e74c3c;
                --info-color: #5dade2;
            }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .status {
            background: var(--bg-secondary);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        
        .status.connected {
            border-left: 4px solid var(--success-color);
        }
        
        .status.disconnected {
            border-left: 4px solid var(--error-color);
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .agent-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .agent-card:hover {
            border-color: var(--info-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .agent-card.selected {
            border-color: var(--info-color);
            background: var(--bg-primary);
        }
        
        .agent-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .agent-model {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .agent-purpose {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .agent-endpoint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-family: monospace;
        }
        
        .agent-features {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .feature-item {
            font-size: 12px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .feature-type {
            background: var(--info-color);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            text-transform: uppercase;
        }
        
        .feature-id {
            color: var(--text-secondary);
            word-break: break-all;
        }
        
        .loading-features {
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        .chat-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .message-user {
            background: var(--info-color);
            color: white;
            margin-left: 20%;
        }
        
        .message-assistant {
            background: var(--bg-primary);
            margin-right: 20%;
        }
        
        .message-role {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .input-container {
            display: flex;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: var(--info-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arkavo AG-UI Demo</h1>
        
        <div class="status disconnected" id="status">
            <strong>Status:</strong> <span id="status-text">No agent selected</span>
        </div>
        
        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be dynamically added here -->
        </div>
        
        <div class="chat-container" id="chatContainer" style="display: none;">
            <div id="messages"></div>
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        // Import AG-UI modules (in real app, use proper bundler)
        // For demo, we'll inline the essential parts
        
        class AgUiClient {
            constructor() {
                this.ws = null;
                this.currentAgentId = null;
                this.messages = [];
                this.isConnecting = false;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 10;
                this.reconnectDelay = 500;
                this.maxReconnectDelay = 8000;
            }
            
            // Initialize WebSocket connection to gateway
            initialize() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    return;
                }
                
                if (this.isConnecting) {
                    return;
                }
                
                this.isConnecting = true;
                const wsUrl = `ws://${window.location.host}/ws`;
                
                try {
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('WebSocket connected to gateway');
                        this.isConnecting = false;
                        this.reconnectAttempts = 0;
                        this.reconnectDelay = 500;
                        this.updateStatus('Gateway connected', true);
                        
                        // If we had a previously selected agent, reconnect to it
                        if (this.currentAgentId && discoveredAgents[this.currentAgentId]) {
                            this.connectToAgent(this.currentAgentId);
                        }
                    };
                    
                    this.ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        this.handleEvent(data);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.isConnecting = false;
                        this.updateStatus('Gateway error', false);
                    };
                    
                    this.ws.onclose = (event) => {
                        console.log('WebSocket closed:', event.code, event.reason);
                        this.isConnecting = false;
                        this.updateStatus('Gateway disconnected', false);
                        
                        // Reconnect if not a normal closure
                        if (event.code !== 1000) {
                            this.reconnect();
                        }
                    };
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                    this.isConnecting = false;
                    this.reconnect();
                }
            }
            
            reconnect() {
                if (this.reconnectAttempts >= this.maxReconnectAttempts) {
                    console.error('Max reconnection attempts reached');
                    this.updateStatus('Connection failed - refresh page', false);
                    return;
                }
                
                this.reconnectAttempts++;
                const delay = Math.min(
                    this.reconnectDelay * Math.pow(2, this.reconnectAttempts - 1),
                    this.maxReconnectDelay
                );
                
                console.log(`Reconnecting in ${delay}ms (attempt ${this.reconnectAttempts})`);
                this.updateStatus(`Reconnecting... (${this.reconnectAttempts}/${this.maxReconnectAttempts})`, false);
                
                setTimeout(() => {
                    this.initialize();
                }, delay);
            }
            
            // Connect to a specific agent (sends Connect event over existing WebSocket)
            connectToAgent(agentId) {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    console.error('WebSocket not connected to gateway');
                    return;
                }
                
                this.currentAgentId = agentId;
                const agent = discoveredAgents[agentId];
                
                // Send connect event to establish session with this agent
                this.send({
                    type: 'connect',
                    agentId: agentId,
                    aguiVersion: '1.0'
                });
                
                this.updateStatus(`Connecting to ${agent ? agent.name : agentId}...`, true);
            }
            
            send(event) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(event));
                }
            }
            
            handleEvent(event) {
                console.log('Received event:', event);
                
                switch (event.type) {
                    case 'messagesSnapshot':
                        this.messages = event.messages;
                        this.renderMessages();
                        break;
                        
                    case 'messageDelta':
                        this.handleMessageDelta(event);
                        break;
                        
                    case 'lifecycle.start':
                        document.getElementById('chatContainer').style.display = 'block';
                        const agent = discoveredAgents[this.currentAgentId];
                        this.updateStatus(`Connected to ${agent ? agent.name : this.currentAgentId}`, true);
                        break;
                        
                    case 'error':
                        alert(`Error: ${event.message}`);
                        break;
                }
            }
            
            handleMessageDelta(event) {
                // Simple implementation - just append text
                let message = this.messages.find(m => m.id === event.messageId);
                if (!message) {
                    message = {
                        id: event.messageId,
                        role: 'assistant',
                        content: ''
                    };
                    this.messages.push(message);
                }
                
                if (event.delta.type === 'text') {
                    message.content += event.delta.text;
                }
                
                this.renderMessages();
            }
            
            renderMessages() {
                const container = document.getElementById('messages');
                container.innerHTML = this.messages.map(msg => `
                    <div class="message message-${msg.role}">
                        <div class="message-role">${msg.role}</div>
                        <div class="message-content">${this.escapeHtml(msg.content)}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }
            
            sendUserMessage(content) {
                if (!this.currentAgentId) {
                    console.error('No agent selected');
                    return;
                }
                
                // Add to UI immediately
                const tempId = `user-${Date.now()}`;
                this.messages.push({
                    id: tempId,
                    role: 'user',
                    content: content
                });
                this.renderMessages();
                
                // Send to agent with the agent ID
                this.send({
                    type: 'userMessage',
                    agentId: this.currentAgentId,
                    content: content
                });
            }
            
            updateStatus(text, connected) {
                document.getElementById('status-text').textContent = text;
                document.getElementById('status').className = `status ${connected ? 'connected' : 'disconnected'}`;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // Global client instance
        const client = new AgUiClient();
        window.aguiClient = client;
        
        // Initialize WebSocket connection on page load
        client.initialize();
        
        // Discover agents via SSE
        const eventSource = new EventSource('/events');
        let discoveredAgents = {};
        let selectedAgentId = null;
        
        eventSource.addEventListener('discovery', function(event) {
            const data = JSON.parse(event.data);
            const grid = document.getElementById('agentsGrid');
            
            // Clear existing cards
            grid.innerHTML = '';
            
            // Clear agent cache
            discoveredAgents = {};
            
            // Add discovered agents
            data.agents.forEach(agent => {
                discoveredAgents[agent.id] = agent;
                
                const card = document.createElement('div');
                card.className = 'agent-card';
                card.id = `agent-card-${agent.id}`;
                card.innerHTML = `
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-model">${agent.model}</div>
                    <div class="agent-purpose">${agent.purpose}</div>
                    <div class="agent-endpoint">${agent.endpoint}</div>
                    <div class="agent-features" id="features-${agent.id}">
                        <div class="loading-features">Loading features...</div>
                    </div>
                `;
                
                card.onclick = () => selectAgent(agent.id);
                grid.appendChild(card);
                
                // Fetch discover features for this agent
                fetchDiscoverFeatures(agent);
            });
            
            // Re-select if previously selected agent is still available
            if (selectedAgentId && discoveredAgents[selectedAgentId]) {
                selectAgent(selectedAgentId);
            }
        });
        
        // Fetch discover features from agent
        async function fetchDiscoverFeatures(agent) {
            try {
                const response = await fetch(`/agent/${agent.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'discover_features_query',
                        params: {},
                        id: Date.now()
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.result && data.result.disclosures) {
                    displayFeatures(agent.id, data.result.disclosures);
                } else if (data.error) {
                    displayFeaturesError(agent.id, data.error.message);
                }
            } catch (error) {
                console.error('Failed to fetch features for agent', agent.id, error);
                displayFeaturesError(agent.id, error.message);
            }
        }
        
        // Display features in the agent card
        function displayFeatures(agentId, disclosures) {
            const featuresContainer = document.getElementById(`features-${agentId}`);
            if (!featuresContainer) return;
            
            if (disclosures.length === 0) {
                featuresContainer.innerHTML = '<div class="loading-features">No features disclosed</div>';
                return;
            }
            
            featuresContainer.innerHTML = disclosures.map(feature => `
                <div class="feature-item">
                    <span class="feature-type">${feature['feature-type']}</span>
                    <span class="feature-id">${feature.id}</span>
                </div>
            `).join('');
        }
        
        // Display error when features can't be fetched
        function displayFeaturesError(agentId, error) {
            const featuresContainer = document.getElementById(`features-${agentId}`);
            if (!featuresContainer) return;
            
            featuresContainer.innerHTML = `<div class="loading-features">Failed to load features</div>`;
        }
        
        // Select and connect to an agent
        window.selectAgent = function(agentId) {
            // Update UI selection
            document.querySelectorAll('.agent-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            const selectedCard = document.getElementById(`agent-card-${agentId}`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            
            selectedAgentId = agentId;
            
            // Connect to agent
            if (discoveredAgents[agentId]) {
                client.connectToAgent(agentId);
            }
        };
        
        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                client.sendUserMessage(message);
                input.value = '';
            }
        };
        
        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        };
    </script>
</body>
</html>
