[package]
name = "arkavo-agui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AG-UI protocol implementation and web gateway for Arkavo Edge"

[features]
default = ["mdns"]
mdns = ["dep:zeroconf"]

[dependencies]
# Core dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }

# Web server and WebSocket
warp = { workspace = true, features = ["websocket"] }
reqwest = { workspace = true }

# Protocol dependencies
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-dataflow = { path = "../arkavo-dataflow" }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-events = { path = "../arkavo-events" }
arkavo-memory = { path = "../arkavo-memory" }
anyhow = { workspace = true }
jsonrpsee = { workspace = true, features = ["ws-client"] }

# UUID for event IDs
uuid = { workspace = true }
chrono = { workspace = true }
rand = "0.8"

# mDNS discovery
zeroconf = { version = "0.14", optional = true }
bincode = "1.3"

[dev-dependencies]
uuid = { workspace = true }