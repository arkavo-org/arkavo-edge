[package]
name = "arkavo-agui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AG-UI protocol implementation and web gateway for Arkavo Edge"

[features]
default = ["mdns", "llama-cpp", "web-ui"]
web-ui = []  # Current warp-based web UI (default)
cef-ui = ["dep:arkavo-cef"]  # CEF-based native UI (macOS .pkg only)
mdns = ["dep:mdns-sd"]
llama-cpp = ["arkavo-router/llama-cpp"]
# Windows compatible features (no C++ dependencies)
windows = ["mdns", "arkavo-router/windows"]
# Auto-launch can decrypt .swarmkit.tdf files at gateway boot via opentdf-rs.
# Pulls in arkavo-tdf + arkavo-swarmkit-runtime/tdf. Off by default so
# headless deployments don't drag in opentdf-rs unnecessarily.
tdf = ["arkavo-swarmkit-runtime/tdf"]

[dependencies]
# Core dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

# Web server and WebSocket
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
reqwest = { workspace = true }

# Protocol dependencies
arkavo-agui-protocol = { path = "../arkavo-agui-protocol" }
arkavo-protocol = { path = "../arkavo-protocol" }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-dataflow = { path = "../arkavo-dataflow" }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-router = { path = "../arkavo-router", default-features = false }
arkavo-events = { path = "../arkavo-events" }
arkavo-memory = { path = "../arkavo-memory" }
arkavo-debugger = { path = "../arkavo-debugger" }
arkavo-ui-generator = { path = "../arkavo-ui-generator" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-validation = { path = "../arkavo-validation" }
arkavo-arp = { path = "../arkavo-arp" }
arkavo-policy-cache = { path = "../arkavo-policy-cache" }
arkavo-adaptation = { path = "../arkavo-adaptation" }
arkavo-arp-runtime = { path = "../arkavo-arp-runtime" }
arkavo-swarmkit = { path = "../arkavo-swarmkit" }
arkavo-swarmkit-runtime = { path = "../arkavo-swarmkit-runtime" }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
jsonrpsee = { workspace = true, features = ["ws-client"] }

# UUID for event IDs
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }

# mDNS discovery
mdns-sd = { workspace = true, optional = true }

# CEF renderer (optional)
arkavo-cef = { path = "../arkavo-cef", optional = true }

[dev-dependencies]
uuid = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
arkavo-memory = { path = "../arkavo-memory" }
arkavo-router = { path = "../arkavo-router", default-features = false }
arkavo-test-macros = { path = "../arkavo-test-macros" }
serial_test = "3"