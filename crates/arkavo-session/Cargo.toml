[package]
name = "arkavo-session"
version.workspace = true
edition.workspace = true
authors = ["Arkavo Contributors"]
license = "Apache-2.0"
description = "Communication session management for the Arkavo agentic CLI tool - chat, websocket, HTTP sessions, and push notifications"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["session", "chat", "websocket", "http", "communication"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }

# WebSocket with TLS support
tokio-tungstenite = { workspace = true }
rustls = { workspace = true, features = ["std", "tls12"] }
webpki-roots = { workspace = true }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
arkavo-arp = { path = "../arkavo-arp" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database for session persistence
sqlx = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }

# Token counting
tiktoken-rs = { workspace = true }

# Progress indicators
indicatif = { workspace = true }

# Protocol types (core dependency)
arkavo-protocol = { path = "../arkavo-protocol" }

# LLM interface for summarization
arkavo-llm = { path = "../arkavo-llm" }

# Memory storage
arkavo-memory = { path = "../arkavo-memory" }

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }

[lints]
workspace = true
