[package]
name = "arkavo-ui-generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-driven UI code generation for Arkavo Edge"

[features]
# Local inference is forwarded, never enabled here: this crate is a
# non-optional dependency of arkavo-agui, so hard-wiring `arkavo-llm/llama-cpp`
# linked llama.cpp into every cloud-only binary through feature unification.
llama-cpp = ["arkavo-llm/llama-cpp"]

[dependencies]
# Core dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Arkavo dependencies
arkavo-router = { path = "../arkavo-router", default-features = false, features = ["gemini", "llm-remote"] }
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-gemini = { path = "../arkavo-gemini" }
arkavo-observability = { path = "../arkavo-observability" }
base64 = { workspace = true }

# Model downloading
hf-hub = { workspace = true }
dirs = { workspace = true }

# Template rendering
regex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }

# Drives a GGUF through `LlamaCppProvider` directly, so it only builds when
# local inference is compiled in.
[[example]]
name = "vision_test"
required-features = ["llama-cpp"]

[dev-dependencies]
arkavo-browser = { path = "../arkavo-browser" }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = { workspace = true }
