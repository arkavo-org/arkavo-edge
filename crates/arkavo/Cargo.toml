[package]
name = "arkavo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Main binary for the Arkavo agentic CLI tool"

[features]
default = []
embeddings = ["arkavo-cli/embeddings"]

[dependencies]
arkavo-cli = { path = "../arkavo-cli", default-features = false }
anyhow = "1.0"

[build-dependencies]

[[bin]]
name = "arkavo"
path = "src/main.rs"