[package]
name = "arkavo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Main binary for the Arkavo agentic CLI tool"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
default = ["memory"]
memory = ["arkavo-cli/memory"]
embeddings = ["memory", "arkavo-cli/embeddings"]

[dependencies]
arkavo-cli = { path = "../arkavo-cli", default-features = false }
anyhow = "1.0"
atty = "0.2"

[build-dependencies]

[[bin]]
name = "arkavo"
path = "src/main.rs"
[lints]
workspace = true
