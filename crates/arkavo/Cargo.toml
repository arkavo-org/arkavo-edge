[package]
name = "arkavo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Main binary for the Arkavo agentic CLI tool"
repository.workspace = true
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
# Default features for Unix platforms (Linux, macOS)
default = ["memory", "mdns"]
# Default features for Windows (without mdns due to avahi dependency)
windows-default = ["memory", "llm-remote"]
memory = ["arkavo-cli/memory"]
embeddings = ["memory", "arkavo-cli/embeddings"]
mdns = ["arkavo-cli/mdns"]
local = ["arkavo-cli/local"]
metal = ["arkavo-cli/metal"]
llm-remote = ["arkavo-cli/llm-remote"]
kimi = ["arkavo-cli/kimi"]

[dependencies]
arkavo-cli = { path = "../arkavo-cli", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]

[[bin]]
name = "arkavo"
path = "src/main.rs"
[lints]
workspace = true
