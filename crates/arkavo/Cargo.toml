[package]
name = "arkavo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Main binary for the Arkavo agentic CLI tool"
repository.workspace = true
keywords = ["cli", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]


[features]
# Full defaults with all LLM providers
default = ["memory", "mdns", "mcp-tools", "llm-remote", "llama-cpp", "gemini", "deepseek", "kimi", "glm", "xai", "web-ui", "claude-agent"]
# Minimal feature set for non-typical use cases
minimal = ["memory", "mdns", "mcp-tools"]
# Default features for Windows
windows-default = ["memory", "mdns", "mcp-tools", "llm-remote", "web-ui"]
memory = ["arkavo-cli/memory"]
embeddings = ["memory", "arkavo-cli/embeddings"]
mdns = ["arkavo-cli/mdns"]
llm-remote = ["arkavo-cli/llm-remote"]
kimi = ["arkavo-cli/kimi"]
deepseek = ["arkavo-cli/deepseek"]
glm = ["arkavo-cli/glm"]
xai = ["arkavo-cli/xai"]
gemini = ["arkavo-cli/gemini"]
llama-cpp = ["arkavo-cli/llama-cpp"]
snpe = ["arkavo-cli/snpe"]
mcp-tools = ["arkavo-cli/mcp-tools"]
mcp-macos = ["arkavo-cli/mcp-macos"]
kas = ["arkavo-cli/kas"]
cef-ui = ["arkavo-cli/cef-ui"]
web-ui = ["arkavo-cli/web-ui"]
claude-agent = ["arkavo-cli/claude-agent"]
# Taint-aware egress enforcement (SEQ-003, SEQ-014, SEQ-015). Off until the
# sequence-integrity work reaches GA; the security suite builds a binary with it.
taint = ["arkavo-cli/taint"]
fingerprint = ["arkavo-cli/fingerprint"]

[dependencies]
arkavo-cli = { path = "../arkavo-cli", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[build-dependencies]

[[bin]]
name = "arkavo"
path = "src/main.rs"
[lints]
workspace = true
