[package]
name = "arkavo-device-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-bound identity management for arkavo-edge"

[dependencies]
uuid.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.1"
hex = "0.4"
dirs = "5.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true }
hex = "0.4"
dirs = "5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Security_Credentials"], optional = true }
hex = "0.4"
dirs = "5.0"

[features]
default = []
linux-keyring = ["dep:keyring"]
windows-credential = ["dep:windows"]
