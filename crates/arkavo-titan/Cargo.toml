[package]
name = "arkavo-titan"
version.workspace = true
edition.workspace = true
description = "Low-latency runtime anomaly detection for TØRG policy graphs"
license.workspace = true
repository.workspace = true

[dependencies]
torg-core = { workspace = true }
arkavo-sbe = { path = "../arkavo-sbe" }
