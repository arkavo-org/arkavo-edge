[package]
name = "arkavo-mcp-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Runtime implementation for Model Context Protocol (MCP) server"
repository.workspace = true
keywords = ["mcp", "server", "runtime", "protocol"]
categories = ["network-programming", "asynchronous"]

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-authorization = { path = "../arkavo-authorization" }
arkavo-llm = { path = "../arkavo-llm", default-features = false, features = ["llm-remote"] }
arkavo-memory = { path = "../arkavo-memory" }
arkavo-validation = { path = "../arkavo-validation" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Transport dependencies
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
http.workspace = true

# For the built-in tools
uuid.workspace = true
chrono.workspace = true
rand.workspace = true

[dev-dependencies]
arkavo-test-macros = { path = "../arkavo-test-macros" }

[lints]
workspace = true
