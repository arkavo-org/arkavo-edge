[package]
name = "arkavo-terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal UI for the Arkavo agentic CLI tool - GPU-accelerated terminal integration"

[features]
default = ["memory"]
memory = ["arkavo-memory"]

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
# Syntect with minimal features to reduce binary size
# Include default syntaxes for common languages
syntect = { version = "5.2", default-features = false, features = ["parsing", "regex-onig", "default-themes", "default-syntaxes"] }
tokio = { version = "1.42", features = ["rt", "macros", "sync"] }
anyhow = "1.0"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
arkavo-memory = { path = "../arkavo-memory", optional = true, default-features = false }

# For multi-terminal support
uuid = { version = "1.11", features = ["v4", "serde"] }

[[bin]]
name = "tui-benchmark"
path = "src/bin/benchmark.rs"