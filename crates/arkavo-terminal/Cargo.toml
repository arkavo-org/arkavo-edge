[package]
name = "arkavo-terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal UI for the Arkavo agentic CLI tool - GPU-accelerated terminal integration"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["terminal", "ui", "tui", "gpu", "cli"]
categories = ["command-line-interface", "command-line-utilities"]
readme = "CLAUDE.md"

[features]
default = ["llm-remote"]
llm-remote = ["dep:arkavo-llm", "arkavo-dataflow/llm-remote"]
llm-local = ["dep:arkavo-llm", "arkavo-dataflow/llm-local"]

[dependencies]
ratatui = { workspace = true }
crossterm = { workspace = true }
# Syntect with minimal features to reduce binary size
# Include default syntaxes for common languages
syntect = { workspace = true, features = ["parsing", "regex-onig", "default-themes", "default-syntaxes"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
anyhow = { workspace = true }
unicode-width = "0.2"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
arkavo-memory = { path = "../arkavo-memory", default-features = false }
arkavo-llm = { path = "../arkavo-llm", default-features = false, optional = true }
arkavo-dataflow = { path = "../arkavo-dataflow", default-features = false, features = ["nl", "sandbox", "llm-remote"] }
arkavo-test = { path = "../arkavo-test" }
tokio-stream = { workspace = true }
regex = { workspace = true }

# For multi-terminal support
uuid = { workspace = true }

# For Helix editor integration
tempfile = { workspace = true }

[[bin]]
name = "tui-benchmark"
path = "src/bin/benchmark.rs"
[lints]
workspace = true
