[package]
name = "arkavo-mcp-code-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fast code search tools for Arkavo - ripgrep, structural search, and AST parsing"
repository.workspace = true
keywords = ["code-search", "ripgrep", "ast", "refactoring"]
categories = ["development-tools", "parsing"]

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "test-util", "macros"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
streaming-iterator = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
