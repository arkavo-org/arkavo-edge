[package]
name = "arkavo-claude-code"
version = "0.1.0"
edition = "2021"
authors = ["Arkavo Contributors"]
description = "Claude Agent SDK integration for Arkavo Edge"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
glob = "0.3"
once_cell = "1.19"

# Internal dependencies
arkavo-mcp-core = { path = "../arkavo-mcp-core" }
arkavo-authorization = { path = "../arkavo-authorization" }
arkavo-events = { path = "../arkavo-events" }
arkavo-budget = { path = "../arkavo-budget" }
arkavo-observability = { path = "../arkavo-observability" }

[build-dependencies]
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
mockall = "0.13"
tokio-test = "0.4"