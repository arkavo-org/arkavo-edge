[package]
name = "arkavo-ui-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core UI abstractions and LLM integration for Arkavo Edge"

[features]
openai = ["arkavo-router/openai"]
default = []
cef-ui = ["arkavo-agui/cef-ui"]
web-ui = ["arkavo-agui/web-ui"]
llama-cpp = ["arkavo-llm/llama-cpp", "arkavo-router/llama-cpp"]
gemini = ["arkavo-llm/gemini", "arkavo-router/gemini"]
deepseek = ["arkavo-llm/deepseek", "arkavo-router/deepseek"]
kimi = ["arkavo-llm/kimi", "arkavo-router/kimi"]
glm = ["arkavo-router/glm"]
xai = ["arkavo-router/xai"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

# Error handling
anyhow = { workspace = true }
async-trait = { workspace = true }

# LLM and routing
arkavo-llm = { path = "../arkavo-llm", default-features = false }
arkavo-router = { path = "../arkavo-router", default-features = false }

# UI implementations (always available for adapters)
arkavo-agui = { path = "../arkavo-agui", default-features = false }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
