[package]
name = "arkavo-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Protocol adapters for the Arkavo agentic CLI tool - MCP & A2A client implementations"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["protocol", "mcp", "a2a", "adapter", "client"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# JSON-RPC implementation
jsonrpsee = { workspace = true }

# Networking with rustls
reqwest = { workspace = true, features = ["stream"] }

# Server dependencies
tower = { version = "0.4", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
governor = { version = "0.6", features = ["std", "jitter"] }
dashmap = { version = "5.5" }
crossbeam-queue = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# MCP support
arkavo-mcp-core = { path = "../arkavo-mcp-core" }

# LLM support for chat
arkavo-llm = { path = "../arkavo-llm" }

# Schema generation
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Demo dependencies
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# mDNS dependencies
gethostname = { version = "0.5", optional = true }

# Metrics dependencies
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }

[features]
demo = ["clap", "tracing-subscriber"]
stub_handlers = []
mdns = ["gethostname"]
metrics = ["dep:metrics", "metrics-exporter-prometheus"]

[dev-dependencies]
# For integration tests
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

[[example]]
name = "mdns_browser"
required-features = ["mdns", "demo"]

[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"

[[bin]]
name = "validate-schema"
path = "src/bin/validate-schema.rs"

[lints]
workspace = true
