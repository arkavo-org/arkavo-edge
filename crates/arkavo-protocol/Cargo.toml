[package]
name = "arkavo-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Protocol adapters for the Arkavo agentic CLI tool - MCP & A2A client implementations"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["protocol", "mcp", "a2a", "adapter", "client"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# JSON-RPC implementation
jsonrpsee = { workspace = true }

# Networking with rustls
reqwest = { workspace = true, features = ["stream"] }

# WebSocket with TLS support
tokio-tungstenite = { workspace = true }
rustls = { workspace = true, features = ["std", "tls12"] }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }

# Server dependencies
governor = { workspace = true, features = ["std", "jitter"] }
dashmap = { workspace = true }
crossbeam-queue = { workspace = true }

# HTTP server for well-known endpoints
axum = { workspace = true }
tower = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# JWT authentication
jsonwebtoken = { workspace = true }
urlencoding = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
notify = { workspace = true }

# Database
sqlx = { workspace = true }

# MCP support
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-mcp-tools = { path = "../arkavo-mcp-tools" }
arkavo-memory = { path = "../arkavo-memory" }

# LLM support for chat
arkavo-llm = { path = "../arkavo-llm", default-features = false, features = ["kimi"] }

# Router for intelligent model selection
arkavo-router = { path = "../arkavo-router" }

# Observability
arkavo-observability = { path = "../arkavo-observability" }

# Events for debugging
arkavo-events = { path = "../arkavo-events" }

# Crypto for registration
arkavo-crypto = { path = "../arkavo-crypto" }

# HRM for task orchestration
arkavo-hrm = { path = "../arkavo-hrm" }

# Gossip protocol for learning propagation
arkavo-gossip = { path = "../arkavo-gossip" }

# Additional utilities for registration
rand = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Schema generation
schemars = { workspace = true }

# Demo dependencies
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# mDNS dependencies
gethostname = { workspace = true, optional = true }

# Network interface detection
if-addrs = { workspace = true, optional = true }

# Metrics dependencies
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

[features]
demo = ["clap", "tracing-subscriber"]
stub_handlers = []
mdns = ["gethostname", "if-addrs"]
metrics = ["dep:metrics", "metrics-exporter-prometheus"]

[dev-dependencies]
# For integration tests
jsonrpsee = { workspace = true, features = ["server", "macros"] }
# For examples
tracing-subscriber = { workspace = true }
# For tests
tempfile = { workspace = true }

[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"
required-features = ["demo"]

[[bin]]
name = "validate-schema"
path = "src/bin/validate-schema.rs"
required-features = ["demo"]

[lints]
workspace = true
