[package]
name = "arkavo-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Protocol adapters for the Arkavo agentic CLI tool - MCP & A2A client implementations"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["protocol", "mcp", "a2a", "adapter", "client"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# JSON-RPC implementation
jsonrpsee = { workspace = true }

# Networking with rustls
reqwest = { workspace = true, features = ["stream"] }

# WebSocket with TLS support
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = { version = "2.0" }
webpki-roots = { version = "0.26" }

# Server dependencies
governor = { version = "0.6", features = ["std", "jitter"] }
dashmap = { version = "5.5" }
crossbeam-queue = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# JWT authentication
jsonwebtoken = { version = "9.3" }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# Database
sqlx = { workspace = true }

# MCP support
arkavo-mcp-core = { path = "../arkavo-mcp-core" }

# LLM support for chat
arkavo-llm = { path = "../arkavo-llm", features = ["kimi"] }

# Observability
arkavo-observability = { path = "../arkavo-observability" }

# Events for debugging
arkavo-events = { path = "../arkavo-events" }

# Schema generation
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Demo dependencies
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# mDNS dependencies
gethostname = { version = "0.5", optional = true }

# Network interface detection
get_if_addrs = { version = "0.5", optional = true }

# Metrics dependencies
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }

[features]
demo = ["clap", "tracing-subscriber"]
stub_handlers = []
mdns = ["gethostname", "get_if_addrs"]
metrics = ["dep:metrics", "metrics-exporter-prometheus"]

[dev-dependencies]
# For integration tests
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
# For examples
tracing-subscriber = { workspace = true }
# For tests
tempfile = { workspace = true }

[[example]]
name = "mdns_browser"
required-features = ["mdns", "demo"]


[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"

[[bin]]
name = "validate-schema"
path = "src/bin/validate-schema.rs"

[lints]
workspace = true
