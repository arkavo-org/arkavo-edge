[package]
name = "arkavo-context"
version = "0.1.0"
edition = "2021"
description = "Context compression for cost-optimized AI workflows"

[features]
default = []
llm-local = ["arkavo-llm/llm-local"]
llm-remote = ["arkavo-llm/llm-remote"]

[dependencies]
arkavo-llm = { path = "../arkavo-llm", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
tracing = "0.1"