[package]
name = "arkavo-context"
version = "0.1.0"
edition = "2021"
description = "Context compression for cost-optimized AI workflows"

[dependencies]
arkavo-llm = { path = "../arkavo-llm", features = ["llm-local", "llm-remote"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
