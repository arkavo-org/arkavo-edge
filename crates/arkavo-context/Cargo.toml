[package]
name = "arkavo-context"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Context compression for cost-optimized AI workflows"
repository.workspace = true

[features]
default = []
llm-remote = ["dep:arkavo-llm", "arkavo-llm/llm-remote"]
llama-cpp = ["dep:arkavo-llm", "arkavo-llm/llama-cpp"]
iroh-storage = ["arkavo-tdf", "arkavo-tdf-iroh"]

[dependencies]
arkavo-llm = { path = "../arkavo-llm", default-features = false, optional = true }
arkavo-tdf = { path = "../arkavo-tdf", optional = true }
arkavo-tdf-iroh = { path = "../arkavo-tdf-iroh", optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }