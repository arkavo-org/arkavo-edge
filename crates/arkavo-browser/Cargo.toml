[package]
name = "arkavo-browser"
version = "0.32.0"
edition = "2021"

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
async-trait = "0.1"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
