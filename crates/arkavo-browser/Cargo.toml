[package]
name = "arkavo-browser"
version = "0.33.1"
edition = "2021"

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
async-trait = "0.1"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util", "process"] }
