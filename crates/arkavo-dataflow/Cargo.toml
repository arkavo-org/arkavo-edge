[package]
name = "arkavo-dataflow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
default = ["nl", "sandbox", "llm-remote"]
nl = []
sandbox = []
llm-remote = ["dep:arkavo-llm", "arkavo-llm?/llm-remote"]
llm-local = ["dep:arkavo-llm", "arkavo-llm?/llm-local"]
local = ["llm-local"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
uuid = { workspace = true }
chrono = { workspace = true }
semver = { version = "1.0", features = ["serde"] }
jsonschema = { workspace = true }
async-trait = { workspace = true }
dashmap = "6.1"
futures = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
lazy-regex = "3.3"
flate2 = "1.0"
arkavo-llm = { path = "../arkavo-llm", optional = true, default-features = false }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-memory = { path = "../arkavo-memory" }
tokio-stream = "0.1"
tracing = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rand = "0.8"
ring = "0.17"
url = "2.5.4"

[dev-dependencies]

[lints]
workspace = true
