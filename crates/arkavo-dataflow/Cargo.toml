[package]
name = "arkavo-dataflow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
default = ["nl", "sandbox", "llm-remote"]
nl = []
sandbox = []
llm-remote = ["dep:arkavo-llm", "arkavo-llm?/llm-remote"]
llama-cpp = ["dep:arkavo-llm", "arkavo-llm?/llama-cpp"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
uuid = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
flate2 = "1.0"
arkavo-llm = { path = "../arkavo-llm", default-features = false, optional = true }
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-memory = { path = "../arkavo-memory" }
tokio-stream = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = { workspace = true }
keyring = { workspace = true }
url = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
