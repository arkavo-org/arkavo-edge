[package]
name = "arkavo-repo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Repository mapper for the Arkavo agentic CLI tool - builds semantic map of repositories and tracks changed files"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent", "repository"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
arkavo-git = { path = "../arkavo-git" }
arkavo-memory = { path = "../arkavo-memory", features = ["vector-search"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
indicatif = "0.17"
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiktoken-rs = "0.5"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.4", features = ["v4"] }
anyhow = "1.0"

[lints]
workspace = true
