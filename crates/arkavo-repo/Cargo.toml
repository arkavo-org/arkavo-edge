[package]
name = "arkavo-repo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Repository mapper for the Arkavo agentic CLI tool - builds semantic map of repositories and tracks changed files"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "ai", "agent", "repository"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
arkavo-git = { path = "../arkavo-git" }
arkavo-memory = { path = "../arkavo-memory", features = ["vector-search"] }
chrono = { workspace = true }
ignore = { workspace = true }
indicatif = { workspace = true }
lru = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
