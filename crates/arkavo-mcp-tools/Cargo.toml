[package]
name = "arkavo-mcp-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-platform MCP tools for Arkavo - Git, GitHub, filesystem, and code analysis"
repository.workspace = true
keywords = ["mcp", "tools", "git", "github", "cross-platform"]
categories = ["development-tools"]

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-git = { path = "../arkavo-git" }
arkavo-browser = { path = "../arkavo-browser" }
arkavo-observability = { path = "../arkavo-observability" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
chrono = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# For GitHub tools
base64 = { workspace = true }

# For Git tools
git2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true