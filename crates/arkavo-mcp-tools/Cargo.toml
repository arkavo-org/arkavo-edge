[package]
name = "arkavo-mcp-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-platform MCP tools for Arkavo - Git, GitHub, filesystem, and code analysis"
repository.workspace = true
keywords = ["mcp", "tools", "git", "github", "cross-platform"]
categories = ["development-tools"]

[dependencies]
arkavo-mcp = { path = "../arkavo-mcp" }
arkavo-git = { path = "../arkavo-git" }
arkavo-browser = { path = "../arkavo-browser" }
arkavo-observability = { path = "../arkavo-observability" }
arkavo-memory = { path = "../arkavo-memory" }
arkavo-validation = { path = "../arkavo-validation" }
async-recursion = "1.1"
async-trait = { workspace = true }
uuid = { version = "1.11", features = ["v4"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
chrono = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# For GitHub tools
base64 = { workspace = true }

# For Git tools
git2 = { workspace = true }

# For web search tool
reqwest = { workspace = true }

# For time synchronization
sntpc = "0.6"
chrono-tz = "0.9"

# For TDF tools
arkavo-tdf = { path = "../arkavo-tdf", features = ["opentdf"] }
arkavo-tdf-iroh = { path = "../arkavo-tdf-iroh", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[features]
default = ["iroh"]
ntp-server = []
iroh = ["dep:arkavo-tdf-iroh"]

[lints]
workspace = true

[[bench]]
name = "time_sync"
harness = false
