[package]
name = "arkavo-tdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core TDF (Trusted Data Format) abstraction layer with streaming support for Arkavo"
repository = "https://github.com/arkavo-com/arkavo-edge"
keywords = ["tdf", "opentdf", "encryption", "streaming", "security"]
categories = ["cryptography", "asynchronous"]

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

# opentdf-rs for real TDF encryption (optional)
opentdf = { git = "https://github.com/arkavo-org/opentdf-rs", default-features = false, features = ["rustls-tls"], optional = true }

# HTTP client for KAS (optional)
reqwest = { workspace = true, optional = true }

# A2A KAS capability dependencies (optional)
arkavo-crypto = { path = "../arkavo-crypto", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
testing = []  # Enables mock implementations
opentdf = ["dep:opentdf"]  # Real TDF encryption via opentdf-rs
kas = ["opentdf", "opentdf/kas", "dep:reqwest"]  # KAS client support
a2a = ["dep:arkavo-crypto"]  # A2A KAS capability over JSON-RPC

[lints]
workspace = true
