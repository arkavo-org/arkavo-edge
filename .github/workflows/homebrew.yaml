name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update Homebrew formula
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          
          # Download SHA256 checksums
          curl -sL "https://github.com/arkavo-org/arkavo-edge/releases/download/${VERSION}/arkavo-${VERSION}-aarch64-apple-darwin.tar.gz.sha256" -o macos.sha256
          curl -sL "https://github.com/arkavo-org/arkavo-edge/releases/download/${VERSION}/arkavo-${VERSION}-x86_64-linux.tar.gz.sha256" -o linux.sha256
          
          MACOS_SHA=$(cat macos.sha256 | cut -d' ' -f1)
          LINUX_SHA=$(cat linux.sha256 | cut -d' ' -f1)
          
          # Update formula
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/arkavo.rb
          sed -i "s/sha256 \".*\" # macos-arm64/sha256 \"${MACOS_SHA}\" # macos-arm64/" Formula/arkavo.rb
          sed -i "s/sha256 \".*\" # linux-x64/sha256 \"${LINUX_SHA}\" # linux-x64/" Formula/arkavo.rb
          
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/arkavo.rb
          git diff --staged --quiet || (git commit -m "Update Homebrew formula to ${{ github.event.release.tag_name }}" && git push)