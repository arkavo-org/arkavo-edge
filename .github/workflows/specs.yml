name: Behavior Specs Validation

on:
  push:
    branches: [main, feature/*, fix/*]
    paths:
      - 'specs/**'
      - '.github/workflows/specs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'specs/**'

jobs:
  validate:
    name: Validate Specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate schema
        run: |
          echo "Validating schema.json is valid JSON..."
          node -e "JSON.parse(require('fs').readFileSync('specs/schema.json'))"

      - name: Validate spec files against schema
        run: |
          echo "Validating all spec files..."
          for spec in specs/arkavo-edge/*.spec.yaml; do
            echo "Validating: $spec"
            ajv validate -s specs/schema.json -d "$spec" --strict=false || exit 1
          done
          echo "✅ All specs validated successfully"

      - name: Check YAML syntax
        run: |
          echo "Checking YAML syntax..."
          npm install -g yaml-lint
          for file in specs/**/*.yaml specs/**/*.yml; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              yamllint "$file" || exit 1
            fi
          done
          echo "✅ All YAML files have valid syntax"

      - name: Validate index.yaml
        run: |
          echo "Checking index.yaml structure..."
          node -e "
            const yaml = require('fs').readFileSync('specs/arkavo-edge/index.yaml', 'utf8');
            const index = require('js-yaml').load(yaml);
            
            // Check required fields
            if (!index.version) throw new Error('Missing version in index');
            if (!index.components) throw new Error('Missing components in index');
            if (!index.stats) throw new Error('Missing stats in index');
            
            // Check component references match files
            const fs = require('fs');
            for (const comp of index.components) {
              const specPath = 'specs/arkavo-edge/' + comp.file;
              if (!fs.existsSync(specPath)) {
                throw new Error('Component ' + comp.name + ' references missing file: ' + comp.file);
              }
            }
            
            console.log('✅ Index validation passed');
          "

  lint:
    name: Lint Specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required fields
        run: |
          echo "Checking all scenarios have required fields..."
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const path = require('path');
          
          const specsDir = 'specs/arkavo-edge';
          const files = fs.readdirSync(specsDir).filter(f => f.endsWith('.spec.yaml'));
          
          let errors = [];
          
          for (const file of files) {
            const content = fs.readFileSync(path.join(specsDir, file), 'utf8');
            const spec = yaml.load(content);
            
            // Check required top-level fields
            if (!spec.feature) errors.push(`${file}: Missing 'feature'`);
            if (!spec.module) errors.push(`${file}: Missing 'module'`);
            if (!spec.version) errors.push(`${file}: Missing 'version'`);
            if (!spec.invariants) errors.push(`${file}: Missing 'invariants'`);
            if (!spec.scenarios) errors.push(`${file}: Missing 'scenarios'`);
            
            // Check each scenario
            for (const scenario of spec.scenarios || []) {
              if (!scenario.id) errors.push(`${file}: Scenario missing 'id'`);
              if (!scenario.name) errors.push(`${file}: Scenario missing 'name'`);
              if (!scenario.criticality) errors.push(`${file}: Scenario ${scenario.id} missing 'criticality'`);
              if (!scenario.given) errors.push(`${file}: Scenario ${scenario.id} missing 'given'`);
              if (!scenario.when) errors.push(`${file}: Scenario ${scenario.id} missing 'when'`);
              if (!scenario.then) errors.push(`${file}: Scenario ${scenario.id} missing 'then'`);
              
              // Check criticality values
              const validCriticality = ['critical', 'high', 'medium', 'low'];
              if (scenario.criticality && !validCriticality.includes(scenario.criticality)) {
                errors.push(`${file}: Scenario ${scenario.id} has invalid criticality: ${scenario.criticality}`);
              }
              
              // Check ID format
              if (scenario.id && !/^[A-Z]+-\d+$/.test(scenario.id)) {
                errors.push(`${file}: Scenario ${scenario.id} has invalid ID format`);
              }
            }
          }
          
          if (errors.length > 0) {
            console.error('❌ Validation errors:');
            errors.forEach(e => console.error('  - ' + e));
            process.exit(1);
          }
          
          console.log('✅ All specs have required fields');
          EOF

  stats:
    name: Generate Spec Statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate coverage stats
        run: |
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const path = require('path');
          
          const specsDir = 'specs/arkavo-edge';
          const files = fs.readdirSync(specsDir).filter(f => f.endsWith('.spec.yaml'));
          
          let totalScenarios = 0;
          let criticalScenarios = 0;
          let highScenarios = 0;
          let byComponent = {};
          
          for (const file of files) {
            const content = fs.readFileSync(path.join(specsDir, file), 'utf8');
            const spec = yaml.load(content);
            
            const count = spec.scenarios?.length || 0;
            const critical = spec.scenarios?.filter(s => s.criticality === 'critical').length || 0;
            const high = spec.scenarios?.filter(s => s.criticality === 'high').length || 0;
            
            totalScenarios += count;
            criticalScenarios += critical;
            highScenarios += high;
            
            byComponent[spec.feature || file] = {
              scenarios: count,
              critical: critical,
              high: high
            };
          }
          
          console.log('\n📊 Specification Statistics');
          console.log('==========================');
          console.log(`Total Scenarios: ${totalScenarios}`);
          console.log(`Critical: ${criticalScenarios}`);
          console.log(`High: ${highScenarios}`);
          console.log('\nBy Component:');
          for (const [name, stats] of Object.entries(byComponent)) {
            console.log(`  ${name}: ${stats.scenarios} (${stats.critical} critical, ${stats.high} high)`);
          }
          console.log('');
          EOF
