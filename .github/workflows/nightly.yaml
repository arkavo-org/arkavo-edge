name: Nightly

on:
  schedule:
    # Run nightly fuzzing and regression tests
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Run comprehensive regression tests nightly
  nightly-regression:
    name: Nightly Regression Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        
      - name: Run all regression tests
        run: |
          # Run all issue-specific regression tests
          cargo test -p arkavo-test --test regression_issue_114 -- --nocapture
          
          # Add more regression tests as issues are fixed
          # cargo test -p arkavo-test --test regression_issue_XXX -- --nocapture
          
      - name: Verify zero-config principle
        run: |
          # Test that arkavo works without any configuration
          cargo build --release -p arkavo
          ./target/release/arkavo --version
          
          # Test in clean environment
          env -i ./target/release/arkavo --version || true

  fuzz:
    name: Fuzz arkavo-protocol
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [fuzz_rate_limit, fuzz_json_rpc, fuzz_rate_limit_concurrent]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
        
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: crates/arkavo-protocol/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
            
      - name: Run fuzzing
        working-directory: crates/arkavo-protocol
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
        env:
          RUST_BACKTRACE: 1
          
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/arkavo-protocol/fuzz/artifacts/