name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Create Release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} does not exist"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: true
          make_latest: false  # Don't mark as latest until smoke tests pass
          generate_release_notes: true
          body: |
            ## Arkavo Edge ${{ steps.version.outputs.version }}

            Release of the Arkavo agentic CLI tool.

            ### Installation

            Download the appropriate binary for your platform and place it in your PATH.

            ### Binaries

            #### Linux
            - **x86_64 full featured** (glibc, local LLM + remote LLM + mDNS): arkavo-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            - **x86_64 static/slim** (musl, memory + mDNS): arkavo-${{ steps.version.outputs.version }}-x86_64-linux-musl.tar.gz
            - **ARM64/Raspberry Pi 5** (glibc, local LLM + remote LLM + mDNS): arkavo-${{ steps.version.outputs.version }}-aarch64-linux.tar.gz
            - **Debian package** (x86_64, full featured): arkavo_${{ steps.version.outputs.version }}_amd64.deb

            #### macOS
            - **ARM64 CLI** (web browser UI): arkavo-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            - **ARM64 .pkg** (native CEF window): Coming soon - full-featured with native UI

            #### Windows
            - **x86_64** (memory + remote LLM): arkavo-${{ steps.version.outputs.version }}-x86_64-windows.zip

            Choose the musl build for containers/Alpine Linux with remote LLM support. Choose the glibc build for desktop Linux with both local and remote LLM support. ARM64 build is optimized for Raspberry Pi 5 (16GB) - see [deployment guide](https://github.com/arkavo-org/arkavo-edge/blob/main/docs/raspberry-pi-deployment.md). Windows builds include memory and remote LLM support (iOS testing capabilities are not available on Windows).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x86_64:
    needs: release
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            features: default
            artifact_suffix: x86_64-linux
            needs_musl: false
          - target: x86_64-unknown-linux-musl
            features: memory,mdns,mcp-tools
            artifact_suffix: x86_64-linux-musl
            needs_musl: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GLM-4.7 MoE gating fix + Ministral3 arch (94242a62c Jan 21 2025)
          git checkout 94242a62c
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - name: Install dependencies for glibc build
        if: matrix.needs_musl == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-client-dev libavahi-common-dev

      - name: Install musl tools and dependencies
        if: matrix.needs_musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: musl-g++
          AR_x86_64_unknown_linux_musl: ar
          CXXFLAGS_x86_64_unknown_linux_musl: "-static"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}
          fi

      - name: Prepare binary
        run: |
          cd target/${{ matrix.target }}/release
          strip arkavo
          # Check binary size
          SIZE=$(stat --format=%s arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi
          tar -czf arkavo-${{ needs.release.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz arkavo
          shasum -a 256 arkavo-${{ needs.release.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz > arkavo-${{ needs.release.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz.sha256

      - name: Create .deb package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p debian/DEBIAN
          mkdir -p debian/usr/bin
          cp target/${{ matrix.target }}/release/arkavo debian/usr/bin/
          cat > debian/DEBIAN/control << EOF
          Package: arkavo
          Version: ${{ needs.release.outputs.version }}
          Architecture: amd64
          Maintainer: Arkavo LLC <support@arkavo.com>
          Description: Arkavo Edge - AI-agent development CLI tool (full featured)
           Arkavo Edge is an open-source agentic CLI tool that provides
           developer-centric capabilities for AI-agent development and
           framework maintenance. This is the full featured build with
           local LLM support, memory features, and mDNS discovery
           using pure Rust implementation (no system dependencies).
          Section: devel
          Priority: optional
          Homepage: https://github.com/arkavo/arkavo-edge
          EOF
          dpkg-deb --build debian arkavo_${{ needs.release.outputs.version }}_amd64.deb
          dpkg-deb --info arkavo_${{ needs.release.outputs.version }}_amd64.deb
          shasum -a 256 arkavo_${{ needs.release.outputs.version }}_amd64.deb > arkavo_${{ needs.release.outputs.version }}_amd64.deb.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            target/${{ matrix.target }}/release/arkavo-${{ needs.release.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz
            target/${{ matrix.target }}/release/arkavo-${{ needs.release.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz.sha256
            arkavo_${{ needs.release.outputs.version }}_amd64.deb
            arkavo_${{ needs.release.outputs.version }}_amd64.deb.sha256
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    needs: release
    name: Build Linux (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GLM-4.7 MoE gating fix + Ministral3 arch (94242a62c Jan 21 2025)
          git checkout 94242a62c
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu
          profile: minimal
          override: true

      - name: Install ARM64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev crossbuild-essential-arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          aarch64-linux-gnu-strip arkavo
          # Check binary size
          SIZE=$(stat --format=%s arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi
          tar -czf arkavo-${{ needs.release.outputs.version }}-aarch64-linux.tar.gz arkavo
          shasum -a 256 arkavo-${{ needs.release.outputs.version }}-aarch64-linux.tar.gz > arkavo-${{ needs.release.outputs.version }}-aarch64-linux.tar.gz.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            target/aarch64-unknown-linux-gnu/release/arkavo-${{ needs.release.outputs.version }}-aarch64-linux.tar.gz
            target/aarch64-unknown-linux-gnu/release/arkavo-${{ needs.release.outputs.version }}-aarch64-linux.tar.gz.sha256
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: release
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GLM-4.7 MoE gating fix + Ministral3 arch (94242a62c Jan 21 2025)
          git checkout 94242a62c
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      - name: Install CMake
        run: brew install cmake

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          profile: minimal
          override: true

      - name: Decode and import signing certificate
        timeout-minutes: 5
        run: |
          echo "Creating and configuring keychain..."
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "Importing certificate..."
          security import /tmp/certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          echo "Verifying certificate import..."
          security find-identity -v -p codesigning build.keychain

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target aarch64-apple-darwin
          # Note: This builds with default features (web-ui) for Homebrew/CLI distribution
          # For .pkg distribution with native CEF renderer, use: --features cef-ui

      - name: Strip binary
        run: |
          strip target/aarch64-apple-darwin/release/arkavo
          
      - name: Check binary size
        run: |
          SIZE=$(stat -f%z target/aarch64-apple-darwin/release/arkavo 2>/dev/null || stat --format=%s target/aarch64-apple-darwin/release/arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi

      - name: Codesign binary
        timeout-minutes: 5
        run: |
          echo "Starting codesign process..."
          codesign --verbose --force --keychain build.keychain --options=runtime --timestamp --sign "Developer ID Application: Arkavo LLC (M8GS7ZT95Y)" target/aarch64-apple-darwin/release/arkavo
          echo "Codesign completed successfully"

      - name: Create ZIP for notarization
        run: |
          cd target/aarch64-apple-darwin/release
          zip arkavo.zip arkavo

      - name: Notarize binary
        run: |
          cd target/aarch64-apple-darwin/release
          xcrun notarytool submit arkavo.zip \
            --apple-id ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APPLE_APP_PASSWORD }} \
            --team-id M8GS7ZT95Y \
            --wait \
            --timeout 600 || {
              echo "Notarization failed. Please check Apple Developer account status and credentials."
              exit 1
            }

      - name: Validate notarization
        run: |
          cd target/aarch64-apple-darwin/release
          # checked online by Gatekeeper
          spctl -a -v arkavo || echo "Note: spctl may fail in CI but the binary is notarized"

      - name: Cleanup temporary files
        run: |
          cd target/aarch64-apple-darwin/release
          rm -f arkavo.zip

      - name: Prepare binary
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czf arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz arkavo
          shasum -a 256 arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz > arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            target/aarch64-apple-darwin/release/arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz
            target/aarch64-apple-darwin/release/arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz.sha256
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-pkg:
    needs: release
    name: Build macOS .pkg Installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GLM-4.7 MoE gating fix + Ministral3 arch (94242a62c Jan 21 2025)
          git checkout 94242a62c
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-pkg"

      - name: Import signing certificates
        env:
          MACOS_CERT_APP: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_APP_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERT_INST: ${{ secrets.MACOS_CERT_INSTALLER }}
          MACOS_CERT_INST_PWD: ${{ secrets.MACOS_CERT_INSTALLER_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_APP" ] && [ -z "$MACOS_CERT_INST" ]; then
            echo "⚠️ No certificates configured - builds will be unsigned"
            exit 1
          fi

          echo "Creating and configuring keychain..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import Developer ID Application certificate
          if [ -n "$MACOS_CERT_APP" ]; then
            echo "Importing Application certificate..."
            echo "$MACOS_CERT_APP" | base64 --decode > /tmp/cert-app.p12
            security import /tmp/cert-app.p12 -k build.keychain -P "$MACOS_CERT_APP_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
            rm /tmp/cert-app.p12
          fi

          # Import Developer ID Installer certificate
          if [ -n "$MACOS_CERT_INST" ]; then
            echo "Importing Installer certificate..."
            echo "$MACOS_CERT_INST" | base64 --decode > /tmp/cert-installer.p12
            security import /tmp/cert-installer.p12 -k build.keychain -P "$MACOS_CERT_INST_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
            rm /tmp/cert-installer.p12
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          echo "✅ Certificates imported successfully"
          echo "Available identities:"
          security find-identity -v build.keychain

      - name: Cache CEF framework
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ hashFiles('scripts/setup-cef.sh') }}
          restore-keys: |
            cef-${{ runner.os }}-

      - name: Download and build CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          echo "Downloading CEF (~100MB)..."
          ./scripts/setup-cef.sh
          echo "✅ CEF setup complete"

      - name: Verify CEF cache
        if: steps.cache-cef.outputs.cache-hit == 'true'
        run: |
          echo "✅ CEF loaded from cache"
          ls -lh vendor/cef/ || echo "CEF cache verification failed"

      - name: Build ARM64 binary with CEF
        run: cargo build --release --target aarch64-apple-darwin --features cef-ui

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z target/aarch64-apple-darwin/release/arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi

      - name: Create app bundle
        run: |
          mkdir -p Arkavo.app/Contents/MacOS
          mkdir -p Arkavo.app/Contents/Resources
          mkdir -p Arkavo.app/Contents/Frameworks

          # Copy the binary as arkavo (main executable)
          # It auto-detects app bundle context and launches UI
          cp target/aarch64-apple-darwin/release/arkavo Arkavo.app/Contents/MacOS/arkavo

          cp packaging/macos/Info.plist Arkavo.app/Contents/Info.plist

          # Copy CEF framework (~100MB)
          if [ -d "vendor/cef/Release/Chromium Embedded Framework.framework" ]; then
            cp -R "vendor/cef/Release/Chromium Embedded Framework.framework" Arkavo.app/Contents/Frameworks/
            echo "✅ CEF framework included in bundle"
          else
            echo "⚠️ CEF framework not found - .pkg will not include CEF support"
          fi

          # Find and copy the CEF renderer binary
          echo "Looking for CEF renderer binary..."
          RENDERER_PATH=$(find target/aarch64-apple-darwin/release/build -name "arkavo-cef-renderer" -path "*/out/bin/arkavo-cef-renderer.app/Contents/MacOS/arkavo-cef-renderer" | head -1)
          if [ -n "$RENDERER_PATH" ] && [ -f "$RENDERER_PATH" ]; then
            echo "Found CEF renderer at: $RENDERER_PATH"
            cp "$RENDERER_PATH" Arkavo.app/Contents/MacOS/arkavo-cef-renderer
            chmod +x Arkavo.app/Contents/MacOS/arkavo-cef-renderer
            echo "✅ CEF renderer included in bundle"
          else
            echo "⚠️ CEF renderer not found - UI may not work"
            echo "Searched in: target/aarch64-apple-darwin/release/build"
            find target/aarch64-apple-darwin/release/build -name "arkavo-cef*" -type d | head -5
          fi

          # Update version in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.release.outputs.version }}" Arkavo.app/Contents/Info.plist

          # Make executable
          chmod +x Arkavo.app/Contents/MacOS/arkavo

      - name: Codesign app
        run: |
          # Check if certificates are available
          CERT_APP=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')

          if [ -z "$CERT_APP" ]; then
            echo "ERROR: Developer ID Application certificate not found"
            exit 1
          fi

          echo "Signing app with hardened runtime using: $CERT_APP"

          # Sign the CEF framework first (it's already signed by Chromium, need to re-sign)
          if [ -d "Arkavo.app/Contents/Frameworks/Chromium Embedded Framework.framework" ]; then
            echo "Re-signing CEF framework..."
            # List the actual structure for debugging
            ls -la "Arkavo.app/Contents/Frameworks/Chromium Embedded Framework.framework/" || true

            # Find and sign the actual framework binary (may be directly in the framework or in subdirectories)
            # Sign from innermost to outermost
            find "Arkavo.app/Contents/Frameworks/Chromium Embedded Framework.framework" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | while IFS= read -r -d '' f; do
              echo "Signing: $f"
              codesign --force --options runtime --timestamp \
                --keychain build.keychain \
                --sign "$CERT_APP" \
                "$f" 2>&1 || true
            done

            # Sign any helper executables
            find "Arkavo.app/Contents/Frameworks/Chromium Embedded Framework.framework" -type f -perm +111 ! -name "*.dylib" ! -name "*.so" -print0 | while IFS= read -r -d '' f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "Signing executable: $f"
                codesign --force --options runtime --timestamp \
                  --keychain build.keychain \
                  --sign "$CERT_APP" \
                  "$f" 2>&1 || true
              fi
            done

            # Sign the framework bundle itself with deep to catch anything we missed
            echo "Signing CEF framework bundle..."
            codesign --force --deep --options runtime --timestamp \
              --keychain build.keychain \
              --sign "$CERT_APP" \
              "Arkavo.app/Contents/Frameworks/Chromium Embedded Framework.framework"
          fi

          # Sign the CEF renderer binary if it exists
          if [ -f "Arkavo.app/Contents/MacOS/arkavo-cef-renderer" ]; then
            echo "Signing CEF renderer..."
            codesign --force --options runtime --timestamp \
              --entitlements packaging/macos/entitlements.plist \
              --keychain build.keychain \
              --sign "$CERT_APP" \
              Arkavo.app/Contents/MacOS/arkavo-cef-renderer
          fi

          # Sign the main binary with entitlements
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --keychain build.keychain \
            --sign "$CERT_APP" \
            Arkavo.app/Contents/MacOS/arkavo

          # Sign the app bundle itself  (without --deep)
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --keychain build.keychain \
            --sign "$CERT_APP" \
            Arkavo.app

          codesign --verify --strict --verbose=4 Arkavo.app
          echo "✅ App signed successfully"

      - name: Build component pkg
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          mkdir -p pkgroot/Applications
          cp -R Arkavo.app pkgroot/Applications/

          pkgbuild \
            --root pkgroot \
            --identifier com.arkavo.edge \
            --version "$VERSION" \
            --install-location / \
            arkavo-$VERSION.component.pkg

      - name: Sign installer
        run: |
          VERSION="${{ needs.release.outputs.version }}"

          # Check if installer certificate is available
          CERT_INSTALLER=$(security find-identity -v build.keychain 2>/dev/null | grep "Developer ID Installer" | head -1 | awk -F'"' '{print $2}')

          if [ -z "$CERT_INSTALLER" ]; then
            echo "ERROR: Developer ID Installer certificate not found"
            exit 1
          fi

          echo "Signing installer with: $CERT_INSTALLER"
          productsign \
            --keychain build.keychain \
            --sign "$CERT_INSTALLER" \
            arkavo-$VERSION.component.pkg \
            arkavo-$VERSION-macos-arm64.pkg

          rm arkavo-$VERSION.component.pkg
          echo "✅ Installer signed successfully"

      - name: Submit to notary service (wait)
        id: notarize
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: M8GS7ZT95Y
        run: |
          set -euo pipefail
          OUT_JSON="notary-submit.json"
          xcrun notarytool submit "arkavo-${VERSION}-macos-arm64.pkg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait \
            --output-format json | tee "$OUT_JSON"

          STATUS=$(python3 -c "import json; print(json.load(open('$OUT_JSON'))['status'])")
          ID=$(python3 -c "import json; print(json.load(open('$OUT_JSON'))['id'])")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "submission_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Submission status: $STATUS  id: $ID"

          # Exit with error if not Accepted
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            exit 1
          fi

      - name: Fetch notary log (always)
        if: ${{ always() }}
        id: fetchlog
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: M8GS7ZT95Y
        run: |
          set +e  # Don't exit on error
          ID="${{ steps.notarize.outputs.submission_id || '' }}"

          if [[ -z "$ID" ]]; then
            echo "No submission id captured; try history fallback…"
            HISTORY_JSON=$(xcrun notarytool history --apple-id "$APPLE_ID" \
                 --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" \
                 --output-format json 2>/dev/null || echo "{}")
            ID=$(echo "$HISTORY_JSON" | python3 -c "import json,sys; h=json.load(sys.stdin).get('history',[]); print(h[0]['id'] if h else '')" 2>/dev/null || echo "")
          fi

          if [[ -z "$ID" ]]; then
            echo "Still no submission id; cannot fetch log." | tee notary.log
            exit 0
          fi

          echo "Fetching notary log for $ID…"
          xcrun notarytool log "$ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            notary.json 2>&1 || echo "Failed to fetch log" > notary.json

          # Create readable log
          if [ -f notary.json ]; then
            python3 -c "import json,sys; j=json.load(open('notary.json')); print(json.dumps(j.get('issues') or j.get('log') or j, indent=2))" > notary.log 2>&1 || cp notary.json notary.log
          else
            echo "No log file generated" > notary.log
          fi

      - name: Upload notary logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: notarization-logs
          path: |
            notary.json
            notary.log

      - name: Staple (only on Accepted)
        if: ${{ steps.notarize.outputs.status == 'Accepted' }}
        run: |
          xcrun stapler staple "arkavo-${{ needs.release.outputs.version }}-macos-arm64.pkg"
          echo "✅ Pkg notarized and stapled successfully"

      - name: Generate checksum
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          shasum -a 256 arkavo-$VERSION-macos-arm64.pkg > arkavo-$VERSION-macos-arm64.pkg.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            arkavo-${{ needs.release.outputs.version }}-macos-arm64.pkg
            arkavo-${{ needs.release.outputs.version }}-macos-arm64.pkg.sha256
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-x86_64:
    needs: release
    name: Build Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        shell: bash
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GLM-4.7 MoE gating fix + Ministral3 arch (94242a62c Jan 21 2025)
          git checkout 94242a62c
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Install C++ build tools for future llama.cpp support
      # Note: Currently building with windows-default (no C++ deps), but this
      # ensures we're ready when llama.cpp is enabled on Windows
      - name: Setup MSVC C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # Refresh environment variables in PowerShell
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

      - name: Build Windows binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features windows-default -p arkavo

      - name: Create release package
        run: |
          New-Item -ItemType Directory -Force -Path release-package
          Copy-Item target\x86_64-pc-windows-msvc\release\arkavo.exe release-package\
          
          # Create ZIP archive
          Compress-Archive -Path release-package\arkavo.exe -DestinationPath arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip
          
          # Generate checksum
          $hash = Get-FileHash -Path arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip" | Out-File -FilePath arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: |
            arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip
            arkavo-${{ needs.release.outputs.version }}-x86_64-windows.zip.sha256
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test-linux:
    needs: [release, build-linux-x86_64]
    name: Smoke Test Linux Binary
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - container: alpine:latest
            binary: arkavo-${{ needs.release.outputs.version }}-x86_64-linux-musl.tar.gz
            test_deb: false
          - container: ubuntu:latest
            binary: arkavo-${{ needs.release.outputs.version }}-x86_64-linux.tar.gz
            test_deb: true
          - container: ubuntu:22.04
            binary: arkavo-${{ needs.release.outputs.version }}-x86_64-linux.tar.gz
            test_deb: true
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install dependencies
        run: |
          if [[ "${{ matrix.container }}" == alpine* ]]; then
            apk add --no-cache curl ca-certificates
          else
            apt-get update
            apt-get install -y curl ca-certificates
            # No runtime dependencies needed - pure Rust implementation
          fi

      - name: Download and test tar.gz binary
        run: |
          curl -L -o arkavo.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.version }}/${{ matrix.binary }}
          tar -xzf arkavo.tar.gz
          chmod +x arkavo
          ./arkavo --version

      - name: Download and test .deb package
        if: matrix.test_deb
        run: |
          curl -L -o arkavo.deb https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.version }}/arkavo_${{ needs.release.outputs.version }}_amd64.deb
          apt-get install -y ./arkavo.deb
          arkavo --version

  smoke-test-macos:
    needs: [release, build-macos-arm64]
    name: Smoke Test macOS Binary
    runs-on: macos-latest
    steps:
      - name: Download and test binary
        run: |
          curl -L -o arkavo.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.version }}/arkavo-${{ needs.release.outputs.version }}-aarch64-apple-darwin.tar.gz
          tar -xzf arkavo.tar.gz
          chmod +x arkavo
          ./arkavo --version

  publish-release:
    needs: [release, smoke-test-linux, smoke-test-macos]
    name: Publish Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Trigger Homebrew tap update
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          
          # Use PAT if available, otherwise fall back to manual trigger
          if [ -n "${{ secrets.HOMEBREW_UPDATE_TOKEN }}" ]; then
            echo "Using HOMEBREW_UPDATE_TOKEN to trigger workflow"
            curl -X POST \
              -H "Authorization: token ${{ secrets.HOMEBREW_UPDATE_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/arkavo-org/homebrew-arkavo/dispatches \
              -d "{\"event_type\": \"update-formula\", \"client_payload\": {\"version\": \"${VERSION}\"}}"
          else
            echo "⚠️ HOMEBREW_UPDATE_TOKEN not configured. Please manually trigger the Homebrew formula update."
            echo "To fix: Add a Personal Access Token with 'repo' scope as HOMEBREW_UPDATE_TOKEN secret"
            echo "Manual trigger: gh workflow run 'Update Formula' --repo arkavo-org/homebrew-arkavo -f version=${VERSION}"
          fi

      - name: Update release to published and latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          prerelease: false
          make_latest: true  # Mark as latest after all tests pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
