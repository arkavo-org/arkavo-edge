  # Zero-config and portability verification
  zero-config-check:
    name: Zero Configuration Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Check for hardcoded paths
        run: |
          echo "Verifying no hardcoded paths..."
          
          PATTERNS=(
            "/Applications/Xcode.app"
            "/usr/local/bin"
            "/opt/homebrew"
            "$HOME/Library"
            "~/.config"
          )
          
          for pattern in "${PATTERNS[@]}"; do
            # Exclude arkavo-mcp-macos (macOS-specific paths) and arkavo-agui (CEF renderer search paths with fallback)
            if grep -r "$pattern" crates/ --include="*.rs" --exclude-dir=target --exclude-dir=arkavo-mcp-macos --exclude-dir=arkavo-agui | grep -v test | grep -v comment | grep -v "require_xcode_message"; then
              echo "::error::Found hardcoded path: $pattern"
              exit 1
            fi
          done
          
      - name: Check for required environment variables
        run: |
          echo "Verifying no required environment variables..."

          # Check for env::var calls that require configuration
          # Exclude build.rs files and test files, and allow standard env vars and optional API keys
          if grep -r 'env::var("[A-Z_]*")\.\(expect\|unwrap\)' crates/ --include="*.rs" --exclude="build.rs" | grep -v test | grep -v "CARGO\|RUST\|PATH\|HOME\|TEMP\|TMP\|USER\|OUT_DIR\|OPENAI_API_KEY\|ANTHROPIC_API_KEY\|MOONSHOT_API_KEY\|DEEPSEEK_API_KEY\|DEEPSEEK_MODEL\|GEMINI_API_KEY\|GEMINI_MODEL\|KIMI_API_KEY\|KIMI_MODEL\|ANTHROPIC_MODEL\|ANTHROPIC_BASE_URL"; then
            echo "::error::Found required environment variables"
            exit 1
          fi

  # Verify no OpenSSL dependency for musl builds
  no-openssl-check:
    name: Verify No OpenSSL Dependency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          # Remove Microsoft apt sources that cause 403 errors on GitHub runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "no-openssl"

      - name: Check for OpenSSL in musl dependency tree
        run: |
          set +e  # Don't exit on error - we want to handle errors ourselves
          echo "Checking musl target for OpenSSL dependencies..."

          # Check only the arkavo binary with musl-specific features (memory,mdns,mcp-tools)
          # This matches the actual musl build configuration and excludes features like
          # claude-agent that are only used on glibc targets
          MUSL_FEATURES="memory,mdns,mcp-tools"

          # Check for openssl - if it's found in the tree (not the error message), fail
          OPENSSL_CHECK=$(cargo tree --target x86_64-unknown-linux-musl -e normal -i openssl -p arkavo --no-default-features --features "$MUSL_FEATURES" 2>&1)
          OPENSSL_EXIT=$?

          if [ $OPENSSL_EXIT -ne 0 ] && ! echo "$OPENSSL_CHECK" | grep -q "did not match any packages"; then
            echo "::error::cargo tree failed to check OpenSSL dependencies"
            echo "$OPENSSL_CHECK"
            exit 1
          fi

          if echo "$OPENSSL_CHECK" | grep -q "openssl v" ; then
            echo "::error::Found OpenSSL dependency in musl build! This will cause cross-compilation failures."
            echo "::error::Use rustls instead of native-tls for all TLS dependencies."
            echo "$OPENSSL_CHECK"
            exit 1
          fi

          # Check for native-tls - if it's found in the tree (not the error message), fail
          NATIVE_TLS_CHECK=$(cargo tree --target x86_64-unknown-linux-musl -e normal -i native-tls -p arkavo --no-default-features --features "$MUSL_FEATURES" 2>&1)
          NATIVE_TLS_EXIT=$?

          if [ $NATIVE_TLS_EXIT -ne 0 ] && ! echo "$NATIVE_TLS_CHECK" | grep -q "did not match any packages"; then
            echo "::error::cargo tree failed to check native-tls dependencies"
            echo "$NATIVE_TLS_CHECK"
            exit 1
          fi

          if echo "$NATIVE_TLS_CHECK" | grep -q "native-tls v" ; then
            echo "::error::Found native-tls dependency in musl build! This will cause cross-compilation failures."
            echo "::error::Configure reqwest and other HTTP clients with default-features = false, features = [\"rustls-tls\"]"
            echo "$NATIVE_TLS_CHECK"
            exit 1
          fi

          echo "✅ No OpenSSL or native-tls dependencies found in musl build (features: $MUSL_FEATURES)"
          set -e  # Re-enable exit on error

  # Behavior spec validation
  validate-specs:
    name: Validate Behavior Specs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd /tmp
          npm init -y
          npm install ajv ajv-formats js-yaml
      
      - name: Validate spec schema
        run: |
          node << 'NODE_SCRIPT'
          const Ajv = require('/tmp/node_modules/ajv');
          const addFormats = require('/tmp/node_modules/ajv-formats');
          const fs = require('fs');
          const yaml = require('/tmp/node_modules/js-yaml');
          
          const ajv = new Ajv({strict: false});
          addFormats(ajv);
          
          const schema = JSON.parse(fs.readFileSync('specs/schema.json'));
          const validate = ajv.compile(schema);
          
          let failed = false;
          const files = fs.readdirSync('specs/arkavo-edge').filter(f => f.endsWith('.spec.yaml'));
          
          if (files.length === 0) {
            console.error('❌ No spec files found in specs/arkavo-edge/');
            process.exit(1);
          }
          
          for (const file of files) {
            const content = fs.readFileSync('specs/arkavo-edge/' + file, 'utf8');
            const spec = yaml.load(content);
            
            if (!validate(spec)) {
              console.error('❌ ' + file + ':');
              validate.errors.forEach(e => console.error('  - ' + e.instancePath + ': ' + e.message));
              failed = true;
            } else {
              console.log('✅ ' + file);
            }
          }
          
          process.exit(failed ? 1 : 0);
          NODE_SCRIPT
      
      - name: Check required fields
        run: |
          node << 'NODE_SCRIPT'
          const fs = require('fs');
          const yaml = require('/tmp/node_modules/js-yaml');
          const path = require('path');
          
          const specsDir = 'specs/arkavo-edge';
          const files = fs.readdirSync(specsDir).filter(f => f.endsWith('.spec.yaml'));
          
          if (files.length === 0) {
            console.error('❌ No spec files found in ' + specsDir);
            process.exit(1);
          }
          
          let errors = [];
          let totalScenarios = 0;
          
          for (const file of files) {
            const content = fs.readFileSync(path.join(specsDir, file), 'utf8');
            const spec = yaml.load(content);
            
            if (!spec.feature) errors.push(file + ': Missing feature');
            if (!spec.module) errors.push(file + ': Missing module');
            if (!spec.version) errors.push(file + ': Missing version');
            if (!spec.invariants) errors.push(file + ': Missing invariants');
            if (!spec.scenarios) errors.push(file + ': Missing scenarios');
            
            totalScenarios += spec.scenarios?.length || 0;
            
            for (const s of spec.scenarios || []) {
              if (!s.id) errors.push(file + ': Scenario missing id');
              if (!s.name) errors.push(file + ': Scenario missing name');
              if (!s.criticality) errors.push(file + ': ' + s.id + ' missing criticality');
              if (!['critical','high','medium','low'].includes(s.criticality)) {
                errors.push(file + ': ' + s.id + ' invalid criticality');
              }
              if (!s.given) errors.push(file + ': ' + s.id + ' missing given');
              if (!s.when) errors.push(file + ': ' + s.id + ' missing when');
              if (!s.then) errors.push(file + ': ' + s.id + ' missing then');
              if (s.id && !/^[A-Z]+-\d+$/.test(s.id)) {
                errors.push(file + ': ' + s.id + ' invalid id format');
              }
            }
          }
          
          if (totalScenarios === 0) {
            console.error('❌ No scenarios found across all spec files');
            process.exit(1);
          }
          
          if (errors.length) {
            console.error('❌ Errors:');
            errors.forEach(e => console.error('  - ' + e));
            process.exit(1);
          }
          console.log('✅ All required fields present (' + totalScenarios + ' scenarios)');
          NODE_SCRIPT
      
      - name: Check index sync
        run: |
          node << 'NODE_SCRIPT'
          const fs = require('fs');
          const yaml = require('/tmp/node_modules/js-yaml');
          
          const index = yaml.load(fs.readFileSync('specs/arkavo-edge/index.yaml', 'utf8'));
          
          if (!index.components || index.components.length === 0) {
            console.error('❌ No components found in index.yaml');
            process.exit(1);
          }
          
          let failed = false;
          for (const comp of index.components || []) {
            if (!fs.existsSync('specs/arkavo-edge/' + comp.file)) {
              console.error('❌ Missing file: ' + comp.file);
              failed = true;
              continue;
            }

            const spec = yaml.load(fs.readFileSync('specs/arkavo-edge/' + comp.file, 'utf8'));
            const actualCount = spec.scenarios?.length || 0;
            if (comp.scenario_count !== actualCount) {
              console.error('❌ ' + comp.file + ': index says ' + comp.scenario_count + ' but found ' + actualCount);
              failed = true;
            }
          }

          const specFiles = fs.readdirSync('specs/arkavo-edge').filter(f => f.endsWith('.spec.yaml'));
          const indexedFiles = new Set((index.components || []).map(c => c.file));
          for (const file of specFiles) {
            if (!indexedFiles.has(file)) {
              console.error('❌ ' + file + ' not listed in index.yaml');
              failed = true;
            }
          }

          if (failed) process.exit(1);
          console.log('✅ Index synchronized (' + index.components.length + ' components)');
          NODE_SCRIPT
      
      - name: Generate stats
        run: |
          node << 'NODE_SCRIPT'
          const fs = require('fs');
          const yaml = require('/tmp/node_modules/js-yaml');
          const path = require('path');
          
          const files = fs.readdirSync('specs/arkavo-edge').filter(f => f.endsWith('.spec.yaml'));
          
          if (files.length === 0) {
            console.error('❌ No spec files found');
            process.exit(1);
          }
          
          let total = 0, critical = 0, high = 0;
          
          console.log('\n📊 Spec Statistics');
          console.log('==================');
          
          for (const file of files) {
            const spec = yaml.load(fs.readFileSync(path.join('specs/arkavo-edge', file), 'utf8'));
            const count = spec.scenarios?.length || 0;
            const crit = spec.scenarios?.filter(s => s.criticality === 'critical').length || 0;
            const h = spec.scenarios?.filter(s => s.criticality === 'high').length || 0;
            total += count; critical += crit; high += h;
            console.log((file + ':').padEnd(35) + count + ' (C:' + crit + ' H:' + h + ')');
          }
          
          console.log('─────────────────────────────────────');
          console.log(('Total:').padEnd(35) + total + ' (C:' + critical + ' H:' + high + ')');
          
          if (total === 0) {
            console.error('❌ No scenarios found');
            process.exit(1);
          }
          NODE_SCRIPT

  spec-coverage:
    name: Spec Coverage Report
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp && git checkout ef570f63087b6a5a2930210a13f87990e8113927

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "xtask"

      - name: Generate coverage report
        id: coverage
        run: |
          cargo run -p xtask -- spec-test coverage --markdown --fail-under 1 > report.md 2>gate_result.txt || true
          echo "gate_exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Validate spec-to-code refs
        run: |
          cargo run -p xtask -- spec-test validate-refs --skip-wip --fail

      - name: Generate traceability report and coverage diff
        run: |
          cargo run -p xtask -- spec-test export-html --output traceability.html
          PAGES_URL="https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/traceability.json"
          if curl -sf -o baseline.json "$PAGES_URL"; then
            cargo run -p xtask -- spec-test diff --baseline baseline.json --output diff.md
          else
            echo "No baseline on GitHub Pages yet — skipping diff"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- spec-coverage-report -->"

          # Combine delta (if available) + full report into one comment
          {
            if [ -f diff.md ]; then
              cat diff.md
              echo ""
            fi
            cat report.md
          } > comment.md

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -X PATCH -f body="$(cat comment.md)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi

      - name: Quality gate check
        run: |
          if grep -q "QUALITY_GATE_FAILED" gate_result.txt; then
            echo "::error::Spec coverage quality gate failed"
            cat gate_result.txt
            exit 1
          fi

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: traceability.html
          retention-days: 30

  # Final check that depends on all critical jobs
  release-readiness:
    name: Release Readiness
    needs: [version-check, format, test-and-lint, cargo-deny, cargo-audit, smoke-test-linux, smoke-test-macos, binary-smoke-test, performance-check, validate-openrpc, validate-doc-snippets, zero-config-check, validate-xtask-schema, no-openssl-check, validate-specs, spec-coverage]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.version-check.result }}" != "success" || \
                "${{ needs.format.result }}" != "success" || \
                "${{ needs.test-and-lint.result }}" != "success" || \
                "${{ needs.cargo-deny.result }}" != "success" || \
                "${{ needs.cargo-audit.result }}" != "success" || \
                "${{ needs.smoke-test-linux.result }}" != "success" || \
                "${{ needs.smoke-test-macos.result }}" != "success" || \
                "${{ needs.binary-smoke-test.result }}" != "success" || \
                "${{ needs.performance-check.result }}" != "success" || \
                "${{ needs.validate-openrpc.result }}" != "success" || \
                "${{ needs.validate-doc-snippets.result }}" != "success" || \
                "${{ needs.zero-config-check.result }}" != "success" || \
                "${{ needs.validate-xtask-schema.result }}" != "success" || \
                "${{ needs.no-openssl-check.result }}" != "success" || \
                "${{ needs.validate-specs.result }}" != "success" || \
                "${{ needs.spec-coverage.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed! This PR is ready for merge."
