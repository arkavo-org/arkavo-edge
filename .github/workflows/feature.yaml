name: Feature

# Feature Strategy:
# - Default features include: memory, mdns (portable across all platforms)
# - mdns uses pure Rust implementation (mdns-sd crate, no system dependencies)
# - All builds include mdns since it's now pure Rust
# - coverage tests may exclude some features due to tarpaulin limitations
#
# Platform Build Optimization:
# - Linux builds: Always run (fast, cheap, primary development platform)
# - macOS builds: Only run when platform-specific changes detected or manually requested
# - Windows builds: Only run when platform-specific changes detected or manually requested
# - To force platform builds, add PR labels: 'build:macos', 'build:windows', or 'build:all-platforms'
# - This optimization reduces CI costs by ~96% for typical PRs while maintaining safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 10

jobs:
  # Version check from PR
  version-check:
    name: Verify Version Increment
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR branch version
        id: pr_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR branch version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          git fetch origin main:main
          MAIN_VERSION=$(git show main:Cargo.toml | grep '^version =' | head -n 1 | cut -d'"' -f2)
          echo "version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $MAIN_VERSION"

      - name: Compare versions
        run: |
          PR_VERSION="${{ steps.pr_version.outputs.version }}"
          MAIN_VERSION="${{ steps.main_version.outputs.version }}"

          echo "Comparing versions:"
          echo "  Main branch: $MAIN_VERSION"
          echo "  PR branch:   $PR_VERSION"

          # Function to compare semantic versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "❌ ERROR: Version has not been incremented!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            echo ""
            echo "Please update the version in Cargo.toml to a higher version number."
            echo "For example, if current is 0.1.0, you could use 0.1.1, 0.2.0, or 1.0.0"
            exit 1
          elif version_gt "$MAIN_VERSION" "$PR_VERSION"; then
            echo "❌ ERROR: PR version is lower than main branch version!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            exit 1
          else
            echo "✅ Version has been properly incremented from $MAIN_VERSION to $PR_VERSION"
          fi

      - name: Check version format
        run: |
          VERSION="${{ steps.pr_version.outputs.version }}"

          # Verify semantic versioning format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERROR: Invalid version format!"
            echo "Version must follow semantic versioning (X.Y.Z)"
            echo "Current version: $VERSION"
            exit 1
          fi

          echo "✅ Version format is valid: $VERSION"


  # Quick checks that can run in parallel
  format:
    name: Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "clippy"
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "test"
      # No system dependencies needed for pure Rust build
      - name: Run tests
        run: |
          cargo test --workspace --exclude arkavo-memory --exclude arkavo-mcp-macos --exclude arkavo-llm
          cargo test -p arkavo-memory --lib
          cargo test -p arkavo-memory --test mcp_integration_test
          cargo test -p arkavo-llm --lib --no-default-features --features llm-remote
          cargo test -p arkavo-dataflow test_auth_manager_constants -- --nocapture
          cargo test -p arkavo-dataflow test_auth_manager_handles_invalid_master_key -- --nocapture
          cargo test -p arkavo-dataflow test_auth_manager_keychain_fallback -- --nocapture

  test-kimi-feature:
    name: Test Kimi Feature
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "test-kimi"
      
      - name: Test arkavo-kimi crate
        run: |
          # Test the arkavo-kimi crate directly (14 tests, should be fast)
          cargo test -p arkavo-kimi --all-targets
      
      - name: Test arkavo-llm with kimi feature
        run: |
          # Test arkavo-llm with kimi feature enabled (no live API calls)
          cargo test -p arkavo-llm --lib --no-default-features --features kimi
      
      - name: Check kimi dependencies
        run: |
          # Quick check that kimi feature doesn't add unexpected dependencies
          # Use cargo tree to analyze dependencies instead of building twice
          echo "=== Dependencies without kimi feature ==="
          cargo tree -p arkavo --no-default-features --edges normal --prefix none | sort > /tmp/deps-base.txt
          echo "=== Dependencies with kimi feature ==="
          cargo tree -p arkavo --no-default-features --features kimi --edges normal --prefix none | sort > /tmp/deps-kimi.txt
          echo "=== New dependencies added by kimi feature ==="
          comm -13 /tmp/deps-base.txt /tmp/deps-kimi.txt || true
          
          # Count new dependencies
          NEW_DEPS=$(comm -13 /tmp/deps-base.txt /tmp/deps-kimi.txt | wc -l)
          echo "Kimi feature adds $NEW_DEPS new dependencies"
          
          # Fail if kimi adds too many dependencies (more than 20)
          if [ $NEW_DEPS -gt 20 ]; then
            echo "ERROR: Kimi feature adds too many dependencies ($NEW_DEPS > 20)!"
            exit 1
          fi

# Detect if platform-specific builds are needed
  check-platform-changes:
      name: Detect Platform-Specific Changes
      runs-on: ubuntu-22.04
      timeout-minutes: 5
      outputs:
        macos_needed: ${{ steps.check.outputs.macos_needed }}
        windows_needed: ${{ steps.check.outputs.windows_needed }}
        version_valid: ${{ steps.check.outputs.version_valid }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Full history for accurate diffs
            
        - name: Verify checkout
          run: |
            echo "Repository checked out successfully"
            echo "Current directory: $(pwd)"
            echo "Git status:"
            git status --short
            
        - name: Detect platform-specific changes
          id: check
          run: |
            set -e
            set -o pipefail
            
            echo "::group::Environment Information"
            echo "Event: ${{ github.event_name }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "SHA: ${{ github.sha }}"
            echo "::endgroup::"
            
            # Determine base and head SHAs
            echo "::group::Determining Commit Range"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.sha }}"
              echo "Pull Request Mode"
              echo "Base SHA: $BASE_SHA"
              echo "Head SHA: $HEAD_SHA"
              
              # Verify SHAs exist
              if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
                echo "::error::Base SHA $BASE_SHA not found"
                exit 1
              fi
              
              if ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
                echo "::error::Head SHA $HEAD_SHA not found"
                exit 1
              fi
            else
              # For push events
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                BASE_SHA="HEAD^"
                HEAD_SHA="HEAD"
                echo "Push Event Mode (comparing with parent)"
              else
                # First commit - compare against empty tree
                BASE_SHA="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
                HEAD_SHA="HEAD"
                echo "First Commit Mode (comparing with empty tree)"
              fi
              echo "Base: $BASE_SHA"
              echo "Head: $HEAD_SHA"
            fi
            echo "::endgroup::"
            
            # Get changed files
            echo "::group::Getting Changed Files"
            if ! CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>&1); then
              echo "::error::Failed to get changed files: $CHANGED_FILES"
              exit 1
            fi
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "::warning::No changed files detected"
              CHANGED_FILES=""
            else
              FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)
              echo "Total files changed: $FILE_COUNT"
              echo ""
              echo "Changed files:"
              echo "$CHANGED_FILES" | head -20 | while read -r file; do
                echo "  - $file"
              done
              if [ "$FILE_COUNT" -gt 20 ]; then
                echo "  ... and $((FILE_COUNT - 20)) more files"
              fi
            fi
            echo "::endgroup::"
            
            # Version validation
            echo "::group::Version Validation"
            VERSION_VALID=true
            
            if [ -f "Cargo.toml" ]; then
              CURRENT_VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2 || echo "")
              
              if [ -n "$CURRENT_VERSION" ]; then
                echo "Current version: $CURRENT_VERSION"
                
                # Validate version format
                if echo "$CURRENT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                  echo "✓ Version format is valid (semantic versioning)"
                  
                  # For PRs, compare with base version
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    BASE_VERSION=$(git show "$BASE_SHA:Cargo.toml" 2>/dev/null | grep '^version =' | head -n 1 | cut -d'"' -f2 || echo "0.0.0")
                    echo "Base version: $BASE_VERSION"
                    
                    if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
                      echo "::warning::Version has not been incremented from $BASE_VERSION"
                      VERSION_VALID=false
                    else
                      echo "✓ Version incremented: $BASE_VERSION → $CURRENT_VERSION"
                    fi
                  fi
                else
                  echo "::error::Invalid version format: $CURRENT_VERSION (expected X.Y.Z)"
                  VERSION_VALID=false
                fi
              else
                echo "::warning::Could not extract version from Cargo.toml"
                VERSION_VALID=false
              fi
            else
              echo "::warning::Cargo.toml not found"
              VERSION_VALID=false
            fi
            echo "::endgroup::"
            
            # Platform detection helper function
            check_pattern() {
              local pattern="$1"
              local description="$2"
              
              if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
                echo "  ✓ Match: $description"
                return 0
              fi
              return 1
            }
            
            # macOS build detection
            echo "::group::macOS Build Detection"
            MACOS_NEEDED=false
            
            if check_pattern '^crates/arkavo-mcp-macos/' 'macOS-specific crate (arkavo-mcp-macos)'; then
              MACOS_NEEDED=true
            fi
            
            if check_pattern '^\.github/workflows/' 'Workflow configuration files'; then
              MACOS_NEEDED=true
            fi
            
            if check_pattern '^Cargo\.(toml|lock)$' 'Root dependency files'; then
              MACOS_NEEDED=true
            fi
            
            if check_pattern '^crates/(arkavo-cli|arkavo)/' 'Core crates (arkavo-cli, arkavo)'; then
              MACOS_NEEDED=true
            fi
            
            echo "Decision: macOS build needed = $MACOS_NEEDED"
            echo "::endgroup::"
            
            # Windows build detection
            echo "::group::Windows Build Detection"
            WINDOWS_NEEDED=false
            
            if check_pattern '^\.github/workflows/' 'Workflow configuration files'; then
              WINDOWS_NEEDED=true
            fi
            
            if check_pattern '^Cargo\.(toml|lock)$' 'Root dependency files'; then
              WINDOWS_NEEDED=true
            fi
            
            if check_pattern '^crates/(arkavo-cli|arkavo)/' 'Core crates (arkavo-cli, arkavo)'; then
              WINDOWS_NEEDED=true
            fi
            
            echo "Decision: Windows build needed = $WINDOWS_NEEDED"
            echo "::endgroup::"
            
            # Documentation-only check
            echo "::group::Documentation-Only Check"
            if echo "$CHANGED_FILES" | grep -qE '\.md$|^docs/|^README'; then
              NON_DOC_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '\.md$|^docs/|^README' || true)
              
              if [ -z "$NON_DOC_CHANGES" ]; then
                echo "✓ All changes are documentation-only"
                MACOS_NEEDED=false
                WINDOWS_NEEDED=false
                echo "Overriding: macOS build = false"
                echo "Overriding: Windows build = false"
              else
                echo "Mixed changes detected (code + documentation)"
              fi
            else
              echo "No documentation files changed"
            fi
            echo "::endgroup::"
            
            # Validate outputs
            echo "::group::Validating Outputs"
            validate_boolean() {
              local value="$1"
              local name="$2"
              if [ "$value" != "true" ] && [ "$value" != "false" ]; then
                echo "::error::Invalid boolean value for $name: $value"
                return 1
              fi
              echo "✓ $name is valid: $value"
              return 0
            }
            
            if ! validate_boolean "$MACOS_NEEDED" "macos_needed"; then
              exit 1
            fi
            
            if ! validate_boolean "$WINDOWS_NEEDED" "windows_needed"; then
              exit 1
            fi
            
            if ! validate_boolean "$VERSION_VALID" "version_valid"; then
              exit 1
            fi
            echo "::endgroup::"
            
            # Set outputs
            echo "macos_needed=$MACOS_NEEDED" >> $GITHUB_OUTPUT
            echo "windows_needed=$WINDOWS_NEEDED" >> $GITHUB_OUTPUT
            echo "version_valid=$VERSION_VALID" >> $GITHUB_OUTPUT
            
            # Final summary
            echo ""
            echo "::notice::=== Build Decision Summary ==="
            echo "::notice::macOS build needed: $MACOS_NEEDED"
            echo "::notice::Windows build needed: $WINDOWS_NEEDED"
            echo "::notice::Version validation: $VERSION_VALID"
            echo ""
            
            if [ "$MACOS_NEEDED" = "false" ] && [ "$WINDOWS_NEEDED" = "false" ]; then
              echo "::notice::💡 Tip: To force platform builds, add labels 'build:macos', 'build:windows', or 'build:all-platforms'"
            fi
  build-macos:
    name: Build macOS (ARM64)
    needs: [test, clippy, check-platform-changes]
    # Only run if platform-specific changes detected OR manually requested via labels
    if: |
      needs.check-platform-changes.outputs.macos_needed == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'build:macos') ||
      contains(github.event.pull_request.labels.*.name, 'build:all-platforms')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-aarch64"

      - name: Install idb-companion
        run: |
          brew tap facebook/fb
          brew install idb-companion

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z target/aarch64-apple-darwin/release/arkavo 2>/dev/null || stat --format=%s target/aarch64-apple-darwin/release/arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi

      - name: Prepare release artifact with ONNX Runtime
        run: |
          mkdir -p release-package
          cp target/aarch64-apple-darwin/release/arkavo release-package/
          # Download ONNX Runtime for macOS ARM64
          curl -L -o ort-osx.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-osx-arm64-1.18.0.tgz
          mkdir -p ort-temp
          tar -xzf ort-osx.tgz -C ort-temp --strip-components=1
          # Copy the dylib next to the binary for zero-config
          cp ort-temp/lib/libonnxruntime*.dylib release-package/
          chmod +x release-package/arkavo

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-aarch64-apple-darwin
          path: release-package/
          retention-days: 1

  # Windows build job
  build-windows:
    name: Build Windows
    needs: [test, clippy, check-platform-changes]
    # Only run if platform-specific changes detected OR manually requested via labels
    if: |
      needs.check-platform-changes.outputs.windows_needed == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'build:windows') ||
      contains(github.event.pull_request.labels.*.name, 'build:all-platforms')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-windows"

      - name: Build Windows binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features windows-default -p arkavo

      - name: Check binary
        run: |
          Get-ChildItem target\x86_64-pc-windows-msvc\release\arkavo.exe | Select-Object Name, Length
          $size = (Get-Item target\x86_64-pc-windows-msvc\release\arkavo.exe).Length / 1MB
          Write-Host "Binary size: $([math]::Round($size, 2))MB"
          if ($size -gt 60) {
            Write-Error "Binary size exceeds 60MB limit"
            exit 1
          }
          Write-Host "✅ Binary size is within limit"

      - name: Prepare release artifact
        run: |
          New-Item -ItemType Directory -Force -Path release-package
          Copy-Item target\x86_64-pc-windows-msvc\release\arkavo.exe release-package\
          Write-Output "Windows build with memory and remote LLM support" > release-package\features.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-x86_64-windows
          path: release-package/
          retention-days: 1

  # Performance check can run independently
  performance-check:
    name: Performance Check
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-linux
      - name: Check binary size
        run: |
          SIZE=$(du -b arkavo-x86_64-linux | cut -f1)
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "Binary size: $SIZE_MB MB"

          if [ $SIZE_MB -gt 60 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi
          echo "✅ Binary size is within limit (${SIZE_MB}MB ≤ 60MB)"

  # Smoke tests depend on builds
  smoke-test-linux:
    name: Smoke Test Linux (${{ matrix.container }})
    needs: build-linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        container:
          - alpine:latest
          - ubuntu:latest
          - ubuntu:22.04
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Download musl binary for Alpine
        if: contains(matrix.container, 'alpine')
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-linux-musl

      - name: Download glibc binary for Ubuntu
        if: contains(matrix.container, 'ubuntu')
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-linux

      - name: Test binary
        run: |
          chmod +x arkavo*
          ./arkavo* --version

  smoke-test-macos:
    name: Smoke Test macOS
    needs: build-macos
    # Only run if build-macos ran
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: arkavo-aarch64-apple-darwin

      - name: Test binary
        run: |
          chmod +x arkavo
          # Test with bundled ONNX Runtime library
          ./arkavo --version

  smoke-test-windows:
    name: Smoke Test Windows
    needs: build-windows
    # Only run if build-windows ran
    if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: windows-2022
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-windows

      - name: Test binary
        run: |
          .\arkavo.exe --version
          # Test help command
          .\arkavo.exe --help

  # Binary functionality smoke test
  binary-smoke-test:
    name: Binary Smoke Test
    needs: [build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-linux
          path: ./
      
      # No runtime dependencies needed for pure Rust mDNS
      
      - name: Test binary size
        run: |
          echo "=== Binary Size Check ==="
          chmod +x arkavo-x86_64-linux
          
          SIZE=$(stat --format=%s arkavo-x86_64-linux)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          
          # Check against the standard 60MB limit
          if [ $SIZE_MB -gt 60 ]; then
            echo "❌ ERROR: Binary (${SIZE_MB}MB) exceeds 60MB limit"
            exit 1
          fi
          
          # Note if it's optimized (under 40MB means no heavy ML deps)
          if [ $SIZE_MB -le 40 ]; then
            echo "✅ Binary is highly optimized (${SIZE_MB}MB ≤ 40MB - no heavy ML deps)"
          else
            echo "✅ Binary size is within limit (${SIZE_MB}MB ≤ 60MB)"
          fi
      
      - name: Test basic commands
        run: |
          echo "=== Testing Basic Commands ==="
          
          # Test version
          ./arkavo-x86_64-linux --version || exit 1
          echo "✅ --version works"
          
          # Test help
          ./arkavo-x86_64-linux --help > help.txt || exit 1
          echo "✅ --help works"
          
          # Verify expected commands are present
          grep -q "serve" help.txt || { echo "❌ 'serve' command missing"; exit 1; }
          grep -q "agent" help.txt || { echo "❌ 'agent' command missing"; exit 1; }
          grep -q "model" help.txt || { echo "❌ 'model' command missing"; exit 1; }
          echo "✅ Expected commands present"
      
      - name: Test server startup
        run: |
          echo "=== Testing Server Startup ==="
          
          # Try to start the server and check it responds
          timeout 5 ./arkavo-x86_64-linux serve 2>&1 | tee server.log || true
          
          # Check for expected startup messages
          if grep -qE "Starting|Listening|serve|Server" server.log; then
            echo "✅ Server startup messages detected"
          else
            echo "⚠️ Server might not have started properly"
            cat server.log
          fi
      
      - name: Test model list command
        run: |
          echo "=== Testing Model Commands ==="
          
          # Test model list (should work even without models)
          ./arkavo-x86_64-linux model list 2>&1 | tee models.log || true
          
          # Should at least not crash
          if grep -qE "model|Model|No models" models.log; then
            echo "✅ Model list command works"
          else
            echo "⚠️ Unexpected model list output"
          fi
      
      - name: Test agent command
        run: |
          echo "=== Testing Agent Commands ==="
          
          # Test agent help
          ./arkavo-x86_64-linux agent --help 2>&1 | tee agent.log || exit 1
          
          if grep -q "run" agent.log; then
            echo "✅ Agent subcommands available"
          else
            echo "❌ Agent command not working properly"
            exit 1
          fi
      
      - name: Verify no heavy dependencies
        run: |
          echo "=== Checking Binary Dependencies ==="
          
          # Use ldd to check shared libraries (won't show Rust static deps, but can catch some issues)
          ldd arkavo-x86_64-linux | tee deps.log || true
          
          # Basic check - should not have unusual number of dependencies
          DEP_COUNT=$(ldd arkavo-x86_64-linux | wc -l)
          echo "Shared library dependencies: $DEP_COUNT"
          
          if [ $DEP_COUNT -gt 50 ]; then
            echo "⚠️ Unusually high number of dependencies"
          fi
          
          echo "✅ Dependency check complete"

  # Schema validation jobs
  validate-openrpc:
    name: Validate OpenRPC Schema
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "schema"

      - name: Install validation tools
        run: |
          # Install jq for JSON validation
          sudo apt-get update
          sudo apt-get install -y jq

          # Install oasdiff for breaking change detection (Go binary, no npm)
          wget -q -O oasdiff.tar.gz https://github.com/Tufin/oasdiff/releases/download/v1.10.0/oasdiff_1.10.0_linux_amd64.tar.gz
          tar -xzf oasdiff.tar.gz
          sudo mv oasdiff /usr/local/bin/
          rm oasdiff.tar.gz

      - name: Build schema tools
        run: |
          cargo build -p arkavo-protocol --bin export-schema --bin validate-schema || echo "Schema tools not yet available"

      - name: Generate and validate schemas
        run: |
          # Check if export-schema exists
          if cargo run -p arkavo-protocol --bin export-schema > schema.json 2>/dev/null; then
            # Create schemas directory
            mkdir -p schemas/openrpc schemas/config schemas/wire/v1
            cp schema.json schemas/openrpc/

            # Basic JSON validation with jq
            if ! jq . schema.json > /dev/null 2>&1; then
              echo "❌ Invalid JSON in schema"
              exit 1
            fi

            # Validate OpenRPC structure
            echo "Validating OpenRPC schema structure..."

            # Check required fields
            if ! jq -e '.openrpc' schema.json > /dev/null; then
              echo "❌ Missing required field: openrpc"
              exit 1
            fi

            if ! jq -e '.info' schema.json > /dev/null; then
              echo "❌ Missing required field: info"
              exit 1
            fi

            if ! jq -e '.methods' schema.json > /dev/null; then
              echo "❌ Missing required field: methods"
              exit 1
            fi

            # Validate OpenRPC version
            OPENRPC_VERSION=$(jq -r '.openrpc' schema.json)
            if [[ ! "$OPENRPC_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid OpenRPC version: $OPENRPC_VERSION"
              exit 1
            fi

            # Check method structure
            jq -e '.methods[] | select(.name == null or .params == null or .result == null)' schema.json > /dev/null && {
              echo "❌ Methods must have name, params, and result fields"
              exit 1
            } || true

            # Validate method names follow convention
            INVALID_METHODS=$(jq -r '.methods[].name | select(test("^[a-z_]+$") | not)' schema.json || true)
            if [ -n "$INVALID_METHODS" ]; then
              echo "⚠️  Warning: Method names should be lowercase with underscores:"
              echo "$INVALID_METHODS"
            fi

            # Check for method descriptions
            METHODS_WITHOUT_DESC=$(jq -r '.methods[] | select(.description == null) | .name' schema.json || true)
            if [ -n "$METHODS_WITHOUT_DESC" ]; then
              echo "⚠️  Warning: Methods without descriptions:"
              echo "$METHODS_WITHOUT_DESC"
            fi

            # Run Rust-based validation
            if cargo run -p arkavo-protocol --bin validate-schema 2>/dev/null; then
              echo "✅ Rust schema validation passed"
            fi

            echo "✅ Schema validation completed"
          else
            echo "⚠️ Schema export not yet implemented - skipping validation"
          fi

  check-schema-backwards-compatibility:
    name: Check Schema Backwards Compatibility
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "schema-compat"

      - name: Install jq for JSON comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check for breaking changes
        run: |
          # Check if export-schema binary exists
          if cargo run -p arkavo-protocol --bin export-schema > /dev/null 2>&1; then
            # Generate current schema
            cargo run -p arkavo-protocol --bin export-schema > schema-current.json

            # Checkout base branch
            git checkout ${{ github.base_ref }}

            # Check if export-schema exists in base
            if cargo run -p arkavo-protocol --bin export-schema > schema-base.json 2>/dev/null; then
              # Switch back to PR branch
              git checkout -

              # Check for breaking changes using jq
              echo "Checking for breaking changes..."

              # Extract method names from both schemas
              BASE_METHODS=$(jq -r '.methods[].name' schema-base.json | sort)
              CURRENT_METHODS=$(jq -r '.methods[].name' schema-current.json | sort)

              # Check for removed methods (breaking change)
              REMOVED_METHODS=$(comm -23 <(echo "$BASE_METHODS") <(echo "$CURRENT_METHODS"))
              if [ -n "$REMOVED_METHODS" ]; then
                echo "❌ Breaking change: Methods removed:"
                echo "$REMOVED_METHODS"
                exit 1
              fi

              # Check for changes in required parameters
              for method in $BASE_METHODS; do
                if echo "$CURRENT_METHODS" | grep -q "^$method$"; then
                  # Get required params from base
                  BASE_REQUIRED=$(jq -r ".methods[] | select(.name == \"$method\") | .params[] | select(.required == true) | .name" schema-base.json 2>/dev/null | sort || true)
                  # Get required params from current
                  CURRENT_REQUIRED=$(jq -r ".methods[] | select(.name == \"$method\") | .params[] | select(.required == true) | .name" schema-current.json 2>/dev/null | sort || true)

                  # Check for removed required params (breaking change)
                  if [ -n "$BASE_REQUIRED" ]; then
                    REMOVED_PARAMS=$(comm -23 <(echo "$BASE_REQUIRED") <(echo "$CURRENT_REQUIRED") || true)
                    if [ -n "$REMOVED_PARAMS" ]; then
                      echo "❌ Breaking change: Required parameters removed from $method:"
                      echo "$REMOVED_PARAMS"
                      exit 1
                    fi
                  fi
                fi
              done

              echo "✅ No breaking changes detected"
            else
              echo "⚠️ Schema export doesn't exist in base branch - skipping compatibility check"
            fi
          else
            echo "⚠️ Schema export not yet implemented - skipping compatibility check"
          fi

  validate-doc-snippets:
    name: Validate Documentation Code Snippets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable

      - name: Test documentation examples
        run: |
          # Test Rust doc examples
          cargo test --doc -p arkavo-protocol || echo "No doc tests in arkavo-protocol"

      - name: Validate JSON snippets in docs
        run: |
          # Extract and validate JSON snippets from markdown files
          for md in docs/**/*.md README.md; do
            if [ -f "$md" ]; then
              echo "Checking $md for JSON snippets..."
              # Extract JSON code blocks and validate them
              awk '/```json/{flag=1;next}/```/{flag=0}flag' "$md" > temp.json || true
              if [ -s temp.json ]; then
                jq . temp.json > /dev/null 2>&1 || echo "Invalid JSON in $md"
              fi
            fi
          done

  validate-xtask-schema:
    name: Validate Schemas with xtask
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "xtask"
      - name: Run schema validation
        run: cargo run -p xtask -- schema-gen --check

  # Regression tests - ensuring fixed bugs stay fixed
  regression-tests:
    name: Regression Tests
    needs: [test, clippy]  # Run after tests pass to save macOS runner costs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Issue #114: Test on macOS without Xcode
          - os: macos-latest
            test_name: "Issue #114 - No Xcode Prompts"
            issue: 114
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "regression-${{ matrix.issue }}"

      # Issue #114: xcodebuild runtime dependency
      - name: Test Issue #114 - xcodebuild should not trigger prompts
        if: matrix.issue == 114
        run: |
          echo "Testing regression for issue #114..."
          
          # Build without default features to avoid embeddings
          echo "Building arkavo-mcp-macos..."
          cargo build -p arkavo-mcp-macos --no-default-features || exit 1
          
          # Run the regression test
          echo "Running regression test..."
          cargo test -p arkavo-mcp-macos --no-default-features --test regression_issue_114 -- --nocapture || {
            echo "::error::Regression test failed"
            exit 1
          }
          
          # Test that discovery tools don't prompt
          echo "Testing Swift discovery tool..."
          cd crates/arkavo-mcp-macos
          
          # Create a minimal PATH that excludes Xcode but includes Rust
          CARGO_BIN="${HOME}/.cargo/bin"
          if [ ! -d "$CARGO_BIN" ]; then
            # GitHub Actions might have cargo in a different location
            CARGO_BIN=$(dirname $(which cargo))
          fi
          
          MINIMAL_PATH="/usr/bin:/bin:/usr/sbin:/sbin:${CARGO_BIN}"
          echo "Using PATH: $MINIMAL_PATH"
          
          PATH="$MINIMAL_PATH" cargo run --bin test_swift_discovery 2>&1 | tee output.log || true
          
          # Ensure no prompt-related output
          if grep -i "command line tools\|xcode-select" output.log; then
            echo "::error::Regression failure: Found Xcode installation prompt"
            exit 1
          fi
          
          echo "✅ Issue #114 regression test passed"

  # Zero-config and portability verification
  zero-config-check:
    name: Zero Configuration Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Check for hardcoded paths
        run: |
          echo "Verifying no hardcoded paths..."
          
          PATTERNS=(
            "/Applications/Xcode.app"
            "/usr/local/bin"
            "/opt/homebrew"
            "$HOME/Library"
            "~/.config"
          )
          
          for pattern in "${PATTERNS[@]}"; do
            # Exclude arkavo-mcp-macos since it's macOS-specific and needs platform paths
            if grep -r "$pattern" crates/ --include="*.rs" --exclude-dir=target --exclude-dir=arkavo-mcp-macos | grep -v test | grep -v comment | grep -v "require_xcode_message"; then
              echo "::error::Found hardcoded path: $pattern"
              exit 1
            fi
          done
          
      - name: Check for required environment variables
        run: |
          echo "Verifying no required environment variables..."
          
          # Check for env::var calls that require configuration
          # Exclude build.rs files and test files, and allow standard env vars and optional API keys
          if grep -r 'env::var("[A-Z_]*")\.\(expect\|unwrap\)' crates/ --include="*.rs" --exclude="build.rs" | grep -v test | grep -v "CARGO\|RUST\|PATH\|HOME\|TEMP\|TMP\|USER\|OUT_DIR\|OPENAI_API_KEY\|ANTHROPIC_API_KEY\|MOONSHOT_API_KEY\|DEEPSEEK_API_KEY\|DEEPSEEK_MODEL"; then
            echo "::error::Found required environment variables"
            exit 1
          fi

  # Verify no OpenSSL dependency for musl builds
  no-openssl-check:
    name: Verify No OpenSSL Dependency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "no-openssl"

      - name: Check for OpenSSL in musl dependency tree
        run: |
          set +e  # Don't exit on error - we want to handle errors ourselves
          echo "Checking musl target for OpenSSL dependencies..."

          # Check for openssl - if it's found in the tree (not the error message), fail
          OPENSSL_CHECK=$(cargo tree --target x86_64-unknown-linux-musl -e normal -i openssl 2>&1)
          OPENSSL_EXIT=$?

          if [ $OPENSSL_EXIT -ne 0 ] && ! echo "$OPENSSL_CHECK" | grep -q "did not match any packages"; then
            echo "::error::cargo tree failed to check OpenSSL dependencies"
            echo "$OPENSSL_CHECK"
            exit 1
          fi

          if echo "$OPENSSL_CHECK" | grep -q "openssl v" ; then
            echo "::error::Found OpenSSL dependency in musl build! This will cause cross-compilation failures."
            echo "::error::Use rustls instead of native-tls for all TLS dependencies."
            echo "$OPENSSL_CHECK"
            exit 1
          fi

          # Check for native-tls - if it's found in the tree (not the error message), fail
          NATIVE_TLS_CHECK=$(cargo tree --target x86_64-unknown-linux-musl -e normal -i native-tls 2>&1)
          NATIVE_TLS_EXIT=$?

          if [ $NATIVE_TLS_EXIT -ne 0 ] && ! echo "$NATIVE_TLS_CHECK" | grep -q "did not match any packages"; then
            echo "::error::cargo tree failed to check native-tls dependencies"
            echo "$NATIVE_TLS_CHECK"
            exit 1
          fi

          if echo "$NATIVE_TLS_CHECK" | grep -q "native-tls v" ; then
            echo "::error::Found native-tls dependency in musl build! This will cause cross-compilation failures."
            echo "::error::Configure reqwest and other HTTP clients with default-features = false, features = [\"rustls-tls\"]"
            echo "$NATIVE_TLS_CHECK"
            exit 1
          fi

          echo "✅ No OpenSSL or native-tls dependencies found in musl build"
          set -e  # Re-enable exit on error

  # Final check that depends on all critical jobs
  release-readiness:
    name: Release Readiness
    needs: [version-check, format, clippy, test, smoke-test-linux, smoke-test-macos, binary-smoke-test, performance-check, validate-openrpc, validate-doc-snippets, regression-tests, zero-config-check, validate-xtask-schema, no-openssl-check]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Check job results
        run: |
          # Required checks that must always pass
          if [[ "${{ needs.version-check.result }}" != "success" || \
                "${{ needs.format.result }}" != "success" || \
                "${{ needs.clippy.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.smoke-test-linux.result }}" != "success" || \
                "${{ needs.binary-smoke-test.result }}" != "success" || \
                "${{ needs.performance-check.result }}" != "success" || \
                "${{ needs.validate-openrpc.result }}" != "success" || \
                "${{ needs.validate-doc-snippets.result }}" != "success" || \
                "${{ needs.regression-tests.result }}" != "success" || \
                "${{ needs.zero-config-check.result }}" != "success" || \
                "${{ needs.validate-xtask-schema.result }}" != "success" || \
                "${{ needs.no-openssl-check.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          
          # Platform-specific checks - only fail if they ran and failed (not if skipped)
          if [[ "${{ needs.smoke-test-macos.result }}" == "failure" ]]; then
            echo "macOS smoke test failed"
            exit 1
          fi
          
          echo "All checks passed! This PR is ready for merge."
          
          # Informational: Show which platform builds were skipped
          if [[ "${{ needs.smoke-test-macos.result }}" == "skipped" ]]; then
            echo "ℹ️  macOS build was skipped (no platform-specific changes detected)"
          fi
