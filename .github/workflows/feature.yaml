name: Feature

# Feature Strategy:
# - Default features include: memory, mdns (portable across all platforms)
# - mdns uses pure Rust implementation (mdns-sd crate, no system dependencies)
# - All builds include mdns since it's now pure Rust
# - coverage tests may exclude some features due to tarpaulin limitations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 10

jobs:
  # Version check from PR
  version-check:
    name: Verify Version Increment
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR branch version
        id: pr_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR branch version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          git fetch origin main:main
          MAIN_VERSION=$(git show main:Cargo.toml | grep '^version =' | head -n 1 | cut -d'"' -f2)
          echo "version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $MAIN_VERSION"

      - name: Compare versions
        run: |
          PR_VERSION="${{ steps.pr_version.outputs.version }}"
          MAIN_VERSION="${{ steps.main_version.outputs.version }}"

          echo "Comparing versions:"
          echo "  Main branch: $MAIN_VERSION"
          echo "  PR branch:   $PR_VERSION"

          # Function to compare semantic versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "❌ ERROR: Version has not been incremented!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            echo ""
            echo "Please update the version in Cargo.toml to a higher version number."
            echo "For example, if current is 0.1.0, you could use 0.1.1, 0.2.0, or 1.0.0"
            exit 1
          elif version_gt "$MAIN_VERSION" "$PR_VERSION"; then
            echo "❌ ERROR: PR version is lower than main branch version!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            exit 1
          else
            echo "✅ Version has been properly incremented from $MAIN_VERSION to $PR_VERSION"
          fi

      - name: Check version format
        run: |
          VERSION="${{ steps.pr_version.outputs.version }}"

          # Verify semantic versioning format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERROR: Invalid version format!"
            echo "Version must follow semantic versioning (X.Y.Z)"
            echo "Current version: $VERSION"
            exit 1
          fi

          echo "✅ Version format is valid: $VERSION"


  # Quick checks that can run in parallel
  format:
    name: Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  hardcoded-paths:
    name: No Hardcoded Paths
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded user paths
        run: |
          echo "Checking for hardcoded user-specific paths in Rust source files..."

          # Patterns that indicate real hardcoded local paths (not test fixtures)
          # Excludes:
          #   - /home/user/ (generic test fixture)
          #   - /Users/arkavo-agent (documentation)
          #   - Paths inside #[cfg(test)] blocks are acceptable

          FOUND=0

          # Check for macOS user paths (e.g., /Users/paul/, /Users/john/)
          # but NOT /Users/user/ or /Users/arkavo-agent
          if grep -r --include="*.rs" -nE '/Users/[a-z]+/' crates/ 2>/dev/null | grep -vE '/Users/(user|arkavo-agent)/'; then
            echo "Found macOS user-specific paths:"
            grep -r --include="*.rs" -nE '/Users/[a-z]+/' crates/ 2>/dev/null | grep -vE '/Users/(user|arkavo-agent)/'
            FOUND=1
          fi

          # Check for /Volumes/ (macOS mounted volumes)
          if grep -r --include="*.rs" -n '/Volumes/' crates/ 2>/dev/null; then
            echo "Found macOS volume paths:"
            grep -r --include="*.rs" -n '/Volumes/' crates/ 2>/dev/null
            FOUND=1
          fi

          # Check for specific home directories (not generic /home/user/)
          if grep -r --include="*.rs" -nE '/home/[a-z]+/' crates/ 2>/dev/null | grep -vE '/home/user/'; then
            echo "Found Linux user-specific paths:"
            grep -r --include="*.rs" -nE '/home/[a-z]+/' crates/ 2>/dev/null | grep -vE '/home/user/'
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "❌ ERROR: Found hardcoded user-specific paths!"
            echo "These paths will fail on other machines and in CI."
            echo "Use runtime path discovery instead (e.g., dirs::home_dir(), model_discovery::find_gguf_model)"
            exit 1
          fi

          echo "✅ No hardcoded paths found"

  # Combined test + lint jobs for maximum cache reuse
  # Tests run first (full codegen), then clippy reuses artifacts (check-mode is nearly free)
  test-and-lint:
    name: Test & Lint (${{ matrix.group }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Run all groups even if one fails
      matrix:
        group:
          - core        # arkavo-llm, arkavo-memory, arkavo-budget, arkavo-context (32K LOC)
          - protocol    # arkavo-protocol, arkavo-observability, arkavo-mcp-workspace, arkavo-session, arkavo-critic
          - tools       # arkavo-mcp-tools (24K LOC, I/O heavy)
          - routing     # arkavo-router, arkavo-dataflow (42K LOC)
          - ui          # arkavo-terminal, arkavo-ui-generator, arkavo-agui
          - cli         # arkavo-cli (large dep tree, needs its own disk budget)
          - benches     # bench compile-checks only: release profile doubles disk, so isolate it
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # None of the test-and-lint groups exercise llama-cpp features, so skip
      # the ~700 MB vendor/llama.cpp clone and keep the hosted runner disk budget
      # for the Rust build artifacts.
      - name: Install CMake, mold linker, and build dependencies
        run: |
          # Remove Microsoft apt sources that cause 403 errors on GitHub runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache for C++ caching
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "test-lint-${{ matrix.group }}"

      # Step 1: Run tests first (produces full codegen artifacts)
      - name: Run tests with mold linker
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          if [ "${{ matrix.group }}" = "core" ]; then
            cargo test --locked -p arkavo-llm --lib --no-default-features --features llm-remote
            cargo test --locked -p arkavo-memory --lib
            cargo test --locked -p arkavo-memory --test mcp_integration_test
            cargo test --locked -p arkavo-budget
            cargo test --locked -p arkavo-context
          elif [ "${{ matrix.group }}" = "protocol" ]; then
            cargo test --locked -p arkavo-protocol
            cargo test --locked -p arkavo-observability
            cargo test --locked -p arkavo-mcp-workspace
            cargo test --locked -p arkavo-session --lib
            cargo test --locked -p arkavo-critic
          elif [ "${{ matrix.group }}" = "benches" ]; then
            # Compile-check benchmarks to prevent bitrot (no execution). The bench
            # profile is release-like, so this builds a second copy of the whole
            # dependency graph on top of any debug artifacts. Running it in its own
            # job keeps a single runner from doing both the debug and release
            # builds, which together overflow the hosted-runner disk budget.
            cargo bench --locked -p arkavo-protocol --no-run
            cargo bench --locked -p arkavo-critic --no-run
          elif [ "${{ matrix.group }}" = "tools" ]; then
            cargo test --locked -p arkavo-mcp-tools
          elif [ "${{ matrix.group }}" = "routing" ]; then
            cargo test --locked -p arkavo-router --no-default-features --features llm-remote,gemini
            cargo test --locked -p arkavo-dataflow
          elif [ "${{ matrix.group }}" = "ui" ]; then
            cargo test --locked -p arkavo-terminal
            cargo test --locked -p arkavo-ui-generator
            cargo test --locked -p arkavo-agui --no-default-features --features mdns
          elif [ "${{ matrix.group }}" = "cli" ]; then
            cargo test --locked -p arkavo-cli --lib --no-default-features --features memory,mdns,mcp-tools,llm-remote,web-ui
            # Check arkavo-cli with cef-ui feature to catch exhaustive match errors
            # Use --no-default-features to skip llama-cpp (saves disk space)
            cargo check --locked -p arkavo-cli --no-default-features --features memory,mdns,mcp-tools,llm-remote,web-ui,cef-ui
          fi

      # Step 2: Run clippy (reuses test artifacts, check-mode is fast)
      - name: Run clippy on lib and bins
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          if [ "${{ matrix.group }}" = "core" ]; then
            cargo clippy --locked -p arkavo-llm --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-memory --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-budget --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-context --lib --bins -- -D warnings
          elif [ "${{ matrix.group }}" = "protocol" ]; then
            cargo clippy --locked -p arkavo-protocol --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-observability --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-mcp-workspace --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-session --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-critic --lib --bins -- -D warnings
          elif [ "${{ matrix.group }}" = "tools" ]; then
            cargo clippy --locked -p arkavo-mcp-tools --lib --bins -- -D warnings
          elif [ "${{ matrix.group }}" = "routing" ]; then
            cargo clippy --locked -p arkavo-router --lib --bins --no-default-features --features llm-remote,gemini -- -D warnings
            cargo clippy --locked -p arkavo-dataflow --lib --bins -- -D warnings
          elif [ "${{ matrix.group }}" = "ui" ]; then
            cargo clippy --locked -p arkavo-terminal --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-ui-generator --lib --bins -- -D warnings
            cargo clippy --locked -p arkavo-agui --lib --bins --no-default-features --features mdns -- -D warnings
          elif [ "${{ matrix.group }}" = "cli" ]; then
            # Lint arkavo-cli with cef-ui feature (catches exhaustive match errors before release)
            # Use --no-default-features to skip llama-cpp (saves disk space)
            cargo clippy --locked -p arkavo-cli --lib --bins --no-default-features --features memory,mdns,mcp-tools,llm-remote,web-ui,cef-ui -- -D warnings
          fi

  test-kimi-feature:
    name: Test Kimi Feature
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install CMake and build dependencies
        run: |
          # Remove Microsoft apt sources that cause 403 errors on GitHub runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          # Install both runtime and static OpenMP libraries for static linking
          # Use gcc-multilib which includes static libgomp.a
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "test-kimi"
      
      - name: Test arkavo-kimi crate
        run: |
          # Test the arkavo-kimi crate directly (14 tests, should be fast)
          cargo test -p arkavo-kimi --all-targets
      
      - name: Test arkavo-llm with kimi feature
        run: |
          # Test arkavo-llm with kimi feature enabled (no live API calls)
          cargo test -p arkavo-llm --lib --no-default-features --features kimi
      
      - name: Check kimi dependencies
        run: |
          # Quick check that kimi feature doesn't add unexpected dependencies
          # Use cargo tree to analyze dependencies instead of building twice
          echo "=== Dependencies without kimi feature ==="
          cargo tree -p arkavo --no-default-features --edges normal --prefix none | sort > /tmp/deps-base.txt
          echo "=== Dependencies with kimi feature ==="
          cargo tree -p arkavo --no-default-features --features kimi --edges normal --prefix none | sort > /tmp/deps-kimi.txt
          echo "=== New dependencies added by kimi feature ==="
          comm -13 /tmp/deps-base.txt /tmp/deps-kimi.txt || true
          
          # Count new dependencies
          NEW_DEPS=$(comm -13 /tmp/deps-base.txt /tmp/deps-kimi.txt | wc -l)
          echo "Kimi feature adds $NEW_DEPS new dependencies"
          
          # Fail if kimi adds too many dependencies (more than 20)
          if [ $NEW_DEPS -gt 20 ]; then
            echo "ERROR: Kimi feature adds too many dependencies ($NEW_DEPS > 20)!"
            exit 1
          fi

  # Dependency audit with cargo-deny
  # Uses EmbarkStudios action with matrix strategy for optimal CI behavior
  cargo-deny:
    name: Dependency Audit (${{ matrix.checks }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          # Advisories run separately so new RustSec entries don't break unrelated PRs
          # bans, licenses, sources run together as they're deterministic

  cargo-audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  build-linux:
    name: Build Linux (${{ matrix.target || matrix.device }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            features: default
            artifact_name: arkavo-x86_64-linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            features: memory,mdns,mcp-tools
            artifact_name: arkavo-x86_64-linux-musl
          # ARM64 native builds (Raspberry Pi 5 and Arduino UNO Q)
          - os: ubuntu-24.04-arm
            features: memory,mdns,llm-remote,mcp-tools,gemini,web-ui
            artifact_name: arkavo-aarch64-linux-rpi5
            device: rpi5
          # Arduino UNO Q (QRB2210) - Hardware acceleration blocked
          # Investigation: All paths blocked (Vulkan/OpenCL/Hexagon NPU)
          # See: docs/uno-q-hardware-acceleration-blockers.md for details
          - os: ubuntu-24.04-arm
            features: llama-cpp,snpe,memory,mdns,gemini,mcp-tools
            artifact_name: arkavo-aarch64-linux-uno-q
            device: uno-q
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GDN fused ops, Metal/Vulkan kernels, Qwen3.5 NVFP4 support
          git checkout ef570f63087b6a5a2930210a13f87990e8113927
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"
      - name: Install CMake and build dependencies
        run: |
          # Remove Microsoft apt sources that cause 403 errors on GitHub runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update

          echo "DEBUG: matrix.device = '${{ matrix.device }}'"
          echo "DEBUG: matrix.target = '${{ matrix.target }}'"
          echo "DEBUG: matrix.features = '${{ matrix.feature }}'"

          if [ "${{ matrix.device }}" = "uno-q" ]; then
            echo "Installing dependencies for Arduino UNO Q (llama.cpp CPU-only)"
            sudo apt-get install -y cmake clang libclang-dev build-essential libgomp1
          elif [ "${{ matrix.device }}" = "rpi5" ]; then
            echo "Installing dependencies for Raspberry Pi 5 (llama.cpp with CPU backend)"
            sudo apt-get install -y cmake clang libclang-dev build-essential libgomp1
          else
            echo "Installing dependencies for x86_64 builds"
            sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib
          fi

      # SNPE SDK is dynamically loaded at runtime (no build-time dependency)
      # The Qualcomm Neural Processing SDK enables hardware-accelerated inference
      # on Arduino UNO Q (QRB2210) with GPU/DSP support.
      #
      # Runtime detection: Binary searches /opt/snpe, $SNPE_ROOT, $LD_LIBRARY_PATH
      # Download SDK from: https://developer.qualcomm.com/software/qualcomm-neural-processing-sdk
      # License: Proprietary (cannot redistribute - users install separately)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - name: Setup sccache for C++ caching
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-${{ matrix.device || matrix.target }}"

      - name: Install build tools
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            # Install musl tools for static build
            # Remove Microsoft apt sources that cause 403 errors on GitHub runners
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
            sudo apt-get update
            sudo apt-get install -y musl-tools musl-dev
          fi

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: musl-g++
          AR_x86_64_unknown_linux_musl: ar
          CXXFLAGS_x86_64_unknown_linux_musl: "-static"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
          # For glibc build, ensure static linking of OpenMP
          RUSTFLAGS: "-C link-args=-static-libgcc -C link-args=-static-libstdc++"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          if [ "${{ matrix.device }}" = "rpi5" ]; then
            # Raspberry Pi 5 - Native ARM64 build (Cortex-A76, CPU-only)
            echo "Building for Raspberry Pi 5 (native ARM64, CPU-only)"
            export ARKAVO_TARGET_DEVICE=rpi5
            cargo build --release -p arkavo --no-default-features --features ${{ matrix.features }}
          elif [ "${{ matrix.device }}" = "uno-q" ]; then
            # Arduino UNO Q - Native ARM64 build (Cortex-A53 with llama.cpp)
            # Note: Hardware acceleration blocked (Vulkan/OpenCL/Hexagon NPU)
            # See docs/uno-q-hardware-acceleration-blockers.md for investigation details
            echo "Building for Arduino UNO Q (Cortex-A53 with llama.cpp CPU backend)"
            export ARKAVO_TARGET_DEVICE=uno-q
            cargo build --release -p arkavo --no-default-features --features ${{ matrix.features }}
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            # Full featured build with local LLM support (x86_64)
            cargo build --release --target ${{ matrix.target }} -p arkavo
          else
            # Static musl build for containers
            cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }} -p arkavo
          fi

      - name: Prepare release artifact
        run: |
          mkdir -p release-package
          # For native ARM64 builds, binary is in target/release; for others, target/<triple>/release
          if [ -n "${{ matrix.device }}" ]; then
            cp target/release/arkavo release-package/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/arkavo release-package/${{ matrix.artifact_name }}
          fi
          chmod +x release-package/${{ matrix.artifact_name }}

          # Create feature manifest
          if [ "${{ matrix.device }}" = "rpi5" ]; then
            echo "Raspberry Pi 5 build (Cortex-A76, native ARM64, CPU-only)" > release-package/features.txt
            echo "llama.cpp with CPU backend (no GPU acceleration)" >> release-package/features.txt
            echo "Features: ${{ matrix.features }}" >> release-package/features.txt
          elif [ "${{ matrix.device }}" = "uno-q" ]; then
            echo "Arduino UNO Q build (Cortex-A53, CPU-only)" > release-package/features.txt
            echo "llama.cpp with CPU backend (no GPU acceleration)" >> release-package/features.txt
            echo "Note: Vulkan/OpenCL/Hexagon NPU acceleration unavailable" >> release-package/features.txt
            echo "See: docs/uno-q-hardware-acceleration-blockers.md" >> release-package/features.txt
            echo "SNPE runtime support for vision models (dynamic loading)" >> release-package/features.txt
            echo "Features: ${{ matrix.features }}" >> release-package/features.txt
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            echo "Full featured build (x86_64)" > release-package/features.txt
            echo "Features: ${{ matrix.features }}" >> release-package/features.txt
          else
            echo "Static build (${{ matrix.target }})" > release-package/features.txt
            echo "Features: ${{ matrix.features }}" >> release-package/features.txt
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-package/
          retention-days: 1

  build-macos:
    name: Build macOS (ARM64)
    needs: [format, hardcoded-paths]  # Start early, don't wait for tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup vendor/llama.cpp
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GDN fused ops, Metal/Vulkan kernels, Qwen3.5 NVFP4 support
          git checkout ef570f63087b6a5a2930210a13f87990e8113927
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Setup sccache for C++ caching
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-aarch64"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            vendor/llama.cpp/build
            target/aarch64-apple-darwin/release/build/arkavo-llama-cpp-sys-*/out
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('crates/arkavo-llama-cpp-sys/build.rs') }}-ef570f63087b6a5a2930210a13f87990e8113927
          restore-keys: |
            llama-cpp-${{ runner.os }}-

      # Regression test for Issue #114 - Run before full build to catch issues early
      - name: Test Issue #114 - No Xcode Prompts
        run: |
          echo "Testing regression for issue #114..."

          # Build without default features to avoid embeddings
          echo "Building arkavo-mcp-macos..."
          cargo build -p arkavo-mcp-macos --no-default-features || exit 1

          # Run the regression test
          echo "Running regression test..."
          cargo test -p arkavo-mcp-macos --no-default-features --test regression_issue_114 -- --nocapture || {
            echo "::error::Regression test failed"
            exit 1
          }

          # Test that discovery tools don't prompt
          echo "Testing Swift discovery tool..."
          cd crates/arkavo-mcp-macos

          # Create a minimal PATH that excludes Xcode but includes Rust
          CARGO_BIN="${HOME}/.cargo/bin"
          if [ ! -d "$CARGO_BIN" ]; then
            # GitHub Actions might have cargo in a different location
            CARGO_BIN=$(dirname $(which cargo))
          fi

          MINIMAL_PATH="/usr/bin:/bin:/usr/sbin:/sbin:${CARGO_BIN}"
          echo "Using PATH: $MINIMAL_PATH"

          PATH="$MINIMAL_PATH" cargo run --bin test_swift_discovery 2>&1 | tee output.log || true

          # Ensure no prompt-related output
          if grep -i "command line tools\|xcode-select" output.log; then
            echo "::error::Regression failure: Found Xcode installation prompt"
            exit 1
          fi

          echo "✅ Issue #114 regression test passed"
          cd ../..

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: cargo build --release --target aarch64-apple-darwin --features mcp-macos -p arkavo

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z target/aarch64-apple-darwin/release/arkavo 2>/dev/null || stat --format=%s target/aarch64-apple-darwin/release/arkavo)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 65 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 65MB limit"
            exit 1
          fi

      - name: Prepare release artifact with ONNX Runtime
        run: |
          mkdir -p release-package
          cp target/aarch64-apple-darwin/release/arkavo release-package/
          # Download ONNX Runtime for macOS ARM64
          curl -L -o ort-osx.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-osx-arm64-1.18.0.tgz
          mkdir -p ort-temp
          tar -xzf ort-osx.tgz -C ort-temp --strip-components=1
          # Copy the dylib next to the binary for zero-config
          cp ort-temp/lib/libonnxruntime*.dylib release-package/
          chmod +x release-package/arkavo

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-aarch64-apple-darwin
          path: release-package/
          retention-days: 1

  # Windows build job
  build-windows:
    name: Build Windows
    needs: [format, hardcoded-paths]  # Start early, don't wait for tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        shell: bash
        run: |
          echo "Cloning llama.cpp for local inference support"
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp
          # GDN fused ops, Metal/Vulkan kernels, Qwen3.5 NVFP4 support
          git checkout ef570f63087b6a5a2930210a13f87990e8113927
          echo "llama.cpp cloned at commit $(git rev-parse --short HEAD)"

      # Install C++ build tools for future llama.cpp support
      # Note: Currently building with windows-default (no C++ deps), but this
      # ensures we're ready when llama.cpp is enabled on Windows
      - name: Setup MSVC C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          cmake --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache for C++ caching
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "build-windows"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            vendor/llama.cpp/build
            target/x86_64-pc-windows-msvc/release/build/arkavo-llama-cpp-sys-*/out
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('crates/arkavo-llama-cpp-sys/build.rs') }}-ef570f63087b6a5a2930210a13f87990e8113927
          restore-keys: |
            llama-cpp-${{ runner.os }}-

      - name: Build Windows binary
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features windows-default -p arkavo

      - name: Check binary
        run: |
          Get-ChildItem target\x86_64-pc-windows-msvc\release\arkavo.exe | Select-Object Name, Length
          $size = (Get-Item target\x86_64-pc-windows-msvc\release\arkavo.exe).Length / 1MB
          Write-Host "Binary size: $([math]::Round($size, 2))MB"
          if ($size -gt 65) {
            Write-Error "Binary size exceeds 65MB limit"
            exit 1
          }
          Write-Host "✅ Binary size is within limit"

      - name: Prepare release artifact
        run: |
          New-Item -ItemType Directory -Force -Path release-package
          Copy-Item target\x86_64-pc-windows-msvc\release\arkavo.exe release-package\
          Write-Output "Windows build with memory and remote LLM support" > release-package\features.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-x86_64-windows
          path: release-package/
          retention-days: 1

  # Performance check can run independently
  performance-check:
    name: Performance Check
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-linux
      - name: Check binary size
        run: |
          SIZE=$(du -b arkavo-x86_64-linux | cut -f1)
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "Binary size: $SIZE_MB MB"

          if [ $SIZE_MB -gt 65 ]; then
            echo "ERROR: Binary size (${SIZE_MB}MB) exceeds 65MB limit"
            exit 1
          fi
          echo "✅ Binary size is within limit (${SIZE_MB}MB ≤ 65MB)"

  # Smoke tests depend on builds
  smoke-test-linux:
    name: Smoke Test Linux (${{ matrix.container }})
    needs: build-linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        container:
          - alpine:latest
          - ubuntu:latest
