name: Feature

# Feature Strategy:
# - Default features include: memory, mdns, local
# - mdns is CORE functionality for agent discovery (requires avahi on Linux)
# - musl builds exclude mdns due to static linking incompatibility
# - coverage tests may exclude some features due to tarpaulin limitations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 10
  # System dependencies needed for mdns (core feature for agent discovery)
  SYSTEM_DEPS_DEBIAN: "libavahi-client-dev libavahi-common-dev"

jobs:
  # Version check from PR
  version-check:
    name: Verify Version Increment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR branch version
        id: pr_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR branch version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          git fetch origin main:main
          MAIN_VERSION=$(git show main:Cargo.toml | grep '^version =' | head -n 1 | cut -d'"' -f2)
          echo "version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $MAIN_VERSION"

      - name: Compare versions
        run: |
          PR_VERSION="${{ steps.pr_version.outputs.version }}"
          MAIN_VERSION="${{ steps.main_version.outputs.version }}"

          echo "Comparing versions:"
          echo "  Main branch: $MAIN_VERSION"
          echo "  PR branch:   $PR_VERSION"

          # Function to compare semantic versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "❌ ERROR: Version has not been incremented!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            echo ""
            echo "Please update the version in Cargo.toml to a higher version number."
            echo "For example, if current is 0.1.0, you could use 0.1.1, 0.2.0, or 1.0.0"
            exit 1
          elif version_gt "$MAIN_VERSION" "$PR_VERSION"; then
            echo "❌ ERROR: PR version is lower than main branch version!"
            echo "The version in Cargo.toml must be greater than the current version on main branch."
            echo ""
            echo "Current version on main: $MAIN_VERSION"
            echo "Your PR version:        $PR_VERSION"
            exit 1
          else
            echo "✅ Version has been properly incremented from $MAIN_VERSION to $PR_VERSION"
          fi

      - name: Check version format
        run: |
          VERSION="${{ steps.pr_version.outputs.version }}"

          # Verify semantic versioning format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERROR: Invalid version format!"
            echo "Version must follow semantic versioning (X.Y.Z)"
            echo "Current version: $VERSION"
            exit 1
          fi

          echo "✅ Version format is valid: $VERSION"

  # Quick checks that can run in parallel
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS_DEBIAN }}
      
      # Note: Clippy warnings are shown but don't fail the build
      # See https://github.com/arkavo-org/arkavo-edge/issues/138 for remaining warnings to address
      - run: cargo clippy --workspace

  # Tests and builds can run in parallel
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS_DEBIAN }}
      
      # Tests now use isolated databases in temp directory, no cleanup needed
      - name: Run tests
        run: |
          # Run tests for all workspace members except those that need embeddings
          cargo test --workspace --exclude arkavo-memory --exclude arkavo-test
          # Run arkavo-memory tests without embeddings (non-embedding tests only)
          cargo test -p arkavo-memory --lib
          cargo test -p arkavo-memory --test mcp_integration_test
          # Run arkavo-test without embeddings
          cargo test -p arkavo-test

  test-coverage:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to get all history for detecting changed files
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-coverage"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS_DEBIAN }}

      - name: Install cargo-tarpaulin
        run: |
          curl -L https://github.com/xd009642/tarpaulin/releases/download/0.31.2/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C $HOME/.cargo/bin

      - name: Detect changed packages
        id: changed-packages
        run: |
          # If this is a PR, get the base branch to compare against
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
            echo "Comparing PR changes from $BASE_SHA to $HEAD_SHA"

            # Get list of changed files
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)

            # Extract crate names from changed files
            CHANGED_CRATES=""
            for FILE in $CHANGED_FILES; do
              if [[ $FILE == crates/* ]]; then
                CRATE=$(echo $FILE | cut -d'/' -f2)
                # Exclude crates that have issues with tarpaulin or need special handling
                if [[ $CRATE != "arkavo-memory" && $CRATE != "arkavo-test" && $CRATE != "arkavo-llm" ]]; then
                  CHANGED_CRATES="$CHANGED_CRATES $CRATE"
                fi
              fi
            done

            # Remove duplicates
            CHANGED_CRATES=$(echo $CHANGED_CRATES | tr ' ' '\n' | sort -u | tr '\n' ' ')

            if [[ -z "$CHANGED_CRATES" ]]; then
              echo "No relevant crates changed, using default set"
              CHANGED_CRATES="arkavo arkavo-cli arkavo-terminal"
            fi

            echo "Changed crates: $CHANGED_CRATES"
            echo "changed_crates=$CHANGED_CRATES" >> $GITHUB_OUTPUT
          else
            # For non-PR events, use a subset of important crates
            echo "Not a PR, using default set of crates"
            echo "changed_crates=arkavo arkavo-cli arkavo-terminal" >> $GITHUB_OUTPUT
          fi

      - name: Generate test coverage
        run: |
          # Convert space-separated list to package args
          PACKAGE_ARGS=""
          for CRATE in ${{ steps.changed-packages.outputs.changed_crates }}; do
            PACKAGE_ARGS="$PACKAGE_ARGS -p $CRATE"
          done

          echo "Running tarpaulin on packages: $PACKAGE_ARGS"
          
          # For crates that include LLM features, run without default features to avoid pulp/tarpaulin issue
          # Note: This excludes mdns from coverage, but it's necessary due to tarpaulin limitations
          FEATURE_ARGS=""
          if [[ "$PACKAGE_ARGS" == *"arkavo-cli"* ]] || [[ "$PACKAGE_ARGS" == *"arkavo"* ]]; then
            # Run with memory feature only, excluding local (which pulls in candle/pulp) and mdns
            FEATURE_ARGS="--no-default-features --features memory"
          fi
          
          cargo tarpaulin --ignore-tests $PACKAGE_ARGS $FEATURE_ARGS --out Xml --timeout 120 --skip-clean --locked --jobs 2

      - name: Check test coverage
        run: |
          COVERAGE=$(grep -E 'line-rate="[0-9.]+"' cobertura.xml | head -1 | grep -oE '[0-9.]+')
          COVERAGE_PERCENT=$(awk -v cov="$COVERAGE" 'BEGIN {printf "%.2f", cov * 100}')
          echo "Coverage: $COVERAGE_PERCENT%"

  test-embeddings:
    name: Test with Embeddings (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-embeddings"
      - name: Install ONNX Runtime for macOS
        run: |
          curl -L -o ort-osx.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-osx-arm64-1.18.0.tgz
          mkdir -p ort
          tar -xzf ort-osx.tgz -C ort --strip-components=1
      - name: Set ORT library path
        run: |
          echo "DYLD_LIBRARY_PATH=$PWD/ort/lib" >> $GITHUB_ENV
          echo "ORT_LIB_PATH=$PWD/ort/lib" >> $GITHUB_ENV
      - name: Download embedding model files
        run: |
          mkdir -p crates/arkavo-memory/models
          cd crates/arkavo-memory/models
          curl -L -O https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/model.onnx
          curl -L -O https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/tokenizer.json
          curl -L -O https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/config.json
          curl -L -O https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/special_tokens_map.json
          curl -L -O https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/tokenizer_config.json
      # Tests now use isolated databases in temp directory, no cleanup needed
      - name: Run embedding tests
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/ort/lib
          ORT_DYLIB_PATH: ${{ github.workspace }}/ort/lib
          ORT_LIB_PATH: ${{ github.workspace }}/ort/lib
        run: |
          # Test memory crate with embeddings enabled
          cargo test -p arkavo-memory --features embeddings
          # Test arkavo-test with embeddings enabled
          cargo test -p arkavo-test --features embeddings --lib

  build-linux:
    name: Build Linux (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-musl"

      - name: Install musl tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: musl-g++
          AR_x86_64_unknown_linux_musl: ar
          CXXFLAGS_x86_64_unknown_linux_musl: "-static"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          # Note: musl builds exclude mdns and local features due to C++ dependency incompatibility
          # - mdns: avahi doesn't work with static linking
          # - local: esaxx-rs (tokenizers dependency) requires C++ standard library
          # This is acceptable as musl builds are primarily for containerized/embedded environments
          cargo build --release --target x86_64-unknown-linux-musl --no-default-features --features memory -p arkavo

      - name: Prepare release artifact
        run: |
          mkdir -p release-package
          cp target/x86_64-unknown-linux-musl/release/arkavo release-package/
          chmod +x release-package/arkavo
          # Note: musl builds exclude local LLM feature due to C++ dependency issues
          # The binary is statically linked for maximum portability in containers/embedded systems

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-x86_64-unknown-linux-musl
          path: release-package/
          retention-days: 1

  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-arm64"

      - name: Install idb-companion
        run: |
          brew tap facebook/fb
          brew install idb-companion

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare release artifact with ONNX Runtime
        run: |
          mkdir -p release-package
          cp target/aarch64-apple-darwin/release/arkavo release-package/
          # Download ONNX Runtime for macOS ARM64
          curl -L -o ort-osx.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-osx-arm64-1.18.0.tgz
          mkdir -p ort-temp
          tar -xzf ort-osx.tgz -C ort-temp --strip-components=1
          # Copy the dylib next to the binary for zero-config
          cp ort-temp/lib/libonnxruntime*.dylib release-package/
          chmod +x release-package/arkavo

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: arkavo-aarch64-apple-darwin
          path: release-package/
          retention-days: 1

  # Performance check can run independently
  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "perf"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS_DEBIAN }}

      - name: Check build time
        run: |
          cargo clean
          BUILD_START=$(date +%s)
          cargo build --release
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))

          echo "Build time: $BUILD_TIME seconds"

          if [ $BUILD_TIME -gt 300 ]; then
            echo "Warning: Build time exceeds 5 minutes"
          fi

      - name: Check binary size
        run: |
          # Use the binary from the previous build step
          SIZE=$(du -b target/release/arkavo | cut -f1)
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "Binary size: $SIZE_MB MB"

          if [ $SIZE_MB -gt 100 ]; then
            echo "Warning: Binary size exceeds 100 MB"
          fi

  # Smoke tests depend on builds
  smoke-test-linux:
    name: Smoke Test Linux (${{ matrix.container }})
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          - alpine:latest
          - ubuntu:latest
          - ubuntu:22.04
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: arkavo-x86_64-unknown-linux-musl

      - name: Test binary
        run: |
          chmod +x arkavo
          ./arkavo --version

  smoke-test-macos:
    name: Smoke Test macOS
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: arkavo-aarch64-apple-darwin

      - name: Test binary
        run: |
          chmod +x arkavo
          # Test with bundled ONNX Runtime library
          ./arkavo --version

  # Schema validation jobs
  validate-openrpc:
    name: Validate OpenRPC Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "schema-validation"

      - name: Install validation tools
        run: |
          # Install jq for JSON validation
          sudo apt-get update
          sudo apt-get install -y jq

          # Install oasdiff for breaking change detection (Go binary, no npm)
          wget -q -O oasdiff.tar.gz https://github.com/Tufin/oasdiff/releases/download/v1.10.0/oasdiff_1.10.0_linux_amd64.tar.gz
          tar -xzf oasdiff.tar.gz
          sudo mv oasdiff /usr/local/bin/
          rm oasdiff.tar.gz

      - name: Build schema tools
        run: |
          cargo build -p arkavo-protocol --bin export-schema --bin validate-schema || echo "Schema tools not yet available"

      - name: Generate and validate schemas
        run: |
          # Check if export-schema exists
          if cargo run -p arkavo-protocol --bin export-schema > schema.json 2>/dev/null; then
            # Create schemas directory
            mkdir -p schemas/openrpc schemas/config schemas/wire/v1
            cp schema.json schemas/openrpc/

            # Basic JSON validation with jq
            if ! jq . schema.json > /dev/null 2>&1; then
              echo "❌ Invalid JSON in schema"
              exit 1
            fi

            # Validate OpenRPC structure
            echo "Validating OpenRPC schema structure..."

            # Check required fields
            if ! jq -e '.openrpc' schema.json > /dev/null; then
              echo "❌ Missing required field: openrpc"
              exit 1
            fi

            if ! jq -e '.info' schema.json > /dev/null; then
              echo "❌ Missing required field: info"
              exit 1
            fi

            if ! jq -e '.methods' schema.json > /dev/null; then
              echo "❌ Missing required field: methods"
              exit 1
            fi

            # Validate OpenRPC version
            OPENRPC_VERSION=$(jq -r '.openrpc' schema.json)
            if [[ ! "$OPENRPC_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid OpenRPC version: $OPENRPC_VERSION"
              exit 1
            fi

            # Check method structure
            jq -e '.methods[] | select(.name == null or .params == null or .result == null)' schema.json > /dev/null && {
              echo "❌ Methods must have name, params, and result fields"
              exit 1
            } || true

            # Validate method names follow convention
            INVALID_METHODS=$(jq -r '.methods[].name | select(test("^[a-z_]+$") | not)' schema.json || true)
            if [ -n "$INVALID_METHODS" ]; then
              echo "⚠️  Warning: Method names should be lowercase with underscores:"
              echo "$INVALID_METHODS"
            fi

            # Check for method descriptions
            METHODS_WITHOUT_DESC=$(jq -r '.methods[] | select(.description == null) | .name' schema.json || true)
            if [ -n "$METHODS_WITHOUT_DESC" ]; then
              echo "⚠️  Warning: Methods without descriptions:"
              echo "$METHODS_WITHOUT_DESC"
            fi

            # Run Rust-based validation
            if cargo run -p arkavo-protocol --bin validate-schema 2>/dev/null; then
              echo "✅ Rust schema validation passed"
            fi

            echo "✅ Schema validation completed"
          else
            echo "⚠️ Schema export not yet implemented - skipping validation"
          fi

  check-schema-backwards-compatibility:
    name: Check Schema Backwards Compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "schema-compat"

      - name: Install jq for JSON comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check for breaking changes
        run: |
          # Check if export-schema binary exists
          if cargo run -p arkavo-protocol --bin export-schema > /dev/null 2>&1; then
            # Generate current schema
            cargo run -p arkavo-protocol --bin export-schema > schema-current.json

            # Checkout base branch
            git checkout ${{ github.base_ref }}

            # Check if export-schema exists in base
            if cargo run -p arkavo-protocol --bin export-schema > schema-base.json 2>/dev/null; then
              # Switch back to PR branch
              git checkout -

              # Check for breaking changes using jq
              echo "Checking for breaking changes..."

              # Extract method names from both schemas
              BASE_METHODS=$(jq -r '.methods[].name' schema-base.json | sort)
              CURRENT_METHODS=$(jq -r '.methods[].name' schema-current.json | sort)

              # Check for removed methods (breaking change)
              REMOVED_METHODS=$(comm -23 <(echo "$BASE_METHODS") <(echo "$CURRENT_METHODS"))
              if [ -n "$REMOVED_METHODS" ]; then
                echo "❌ Breaking change: Methods removed:"
                echo "$REMOVED_METHODS"
                exit 1
              fi

              # Check for changes in required parameters
              for method in $BASE_METHODS; do
                if echo "$CURRENT_METHODS" | grep -q "^$method$"; then
                  # Get required params from base
                  BASE_REQUIRED=$(jq -r ".methods[] | select(.name == \"$method\") | .params[] | select(.required == true) | .name" schema-base.json 2>/dev/null | sort || true)
                  # Get required params from current
                  CURRENT_REQUIRED=$(jq -r ".methods[] | select(.name == \"$method\") | .params[] | select(.required == true) | .name" schema-current.json 2>/dev/null | sort || true)

                  # Check for removed required params (breaking change)
                  if [ -n "$BASE_REQUIRED" ]; then
                    REMOVED_PARAMS=$(comm -23 <(echo "$BASE_REQUIRED") <(echo "$CURRENT_REQUIRED") || true)
                    if [ -n "$REMOVED_PARAMS" ]; then
                      echo "❌ Breaking change: Required parameters removed from $method:"
                      echo "$REMOVED_PARAMS"
                      exit 1
                    fi
                  fi
                fi
              done

              echo "✅ No breaking changes detected"
            else
              echo "⚠️ Schema export doesn't exist in base branch - skipping compatibility check"
            fi
          else
            echo "⚠️ Schema export not yet implemented - skipping compatibility check"
          fi

  validate-doc-snippets:
    name: Validate Documentation Code Snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test documentation examples
        run: |
          # Test Rust doc examples
          cargo test --doc -p arkavo-protocol || echo "No doc tests in arkavo-protocol"

      - name: Validate JSON snippets in docs
        run: |
          # Extract and validate JSON snippets from markdown files
          for md in docs/**/*.md README.md; do
            if [ -f "$md" ]; then
              echo "Checking $md for JSON snippets..."
              # Extract JSON code blocks and validate them
              awk '/```json/{flag=1;next}/```/{flag=0}flag' "$md" > temp.json || true
              if [ -s temp.json ]; then
                jq . temp.json > /dev/null 2>&1 || echo "Invalid JSON in $md"
              fi
            fi
          done

  # Final check that depends on all critical jobs
  release-readiness:
    name: Release Readiness
    needs: [version-check, format, clippy, test, test-coverage, test-embeddings, smoke-test-linux, smoke-test-macos, performance-check, validate-openrpc, validate-doc-snippets]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.version-check.result }}" != "success" || \
                "${{ needs.format.result }}" != "success" || \
                "${{ needs.clippy.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.test-coverage.result }}" != "success" || \
                "${{ needs.test-embeddings.result }}" != "success" || \
                "${{ needs.smoke-test-linux.result }}" != "success" || \
                "${{ needs.smoke-test-macos.result }}" != "success" || \
                "${{ needs.performance-check.result }}" != "success" || \
                "${{ needs.validate-openrpc.result }}" != "success" || \
                "${{ needs.validate-doc-snippets.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed! This PR is ready for merge."
