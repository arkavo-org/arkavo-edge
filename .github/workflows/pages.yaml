name: Spec Coverage Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Baseline Coverage
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vendor/llama.cpp
        run: |
          git clone https://github.com/ggerganov/llama.cpp vendor/llama.cpp
          cd vendor/llama.cpp && git checkout ef570f63087b6a5a2930210a13f87990e8113927

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgomp1 gcc-multilib g++-multilib

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ runner.os }}"
          prefix-key: "xtask"

      - name: Generate baseline coverage files
        run: |
          mkdir -p _site
          cargo run -p xtask -- spec-test export-json --output _site/traceability.json
          cargo run -p xtask -- spec-test export-html --output _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
