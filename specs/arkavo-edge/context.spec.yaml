# yaml-language-server: $schema=../schema.json

feature: Context Management and Compression
module: arkavo_context
version: 0.57.2

invariants:
  - Context size managed via compression and chunking
  - Semantic chunking preserves meaning
  - Deduplication removes redundant content
  - Compression pipeline configurable
  - RLM activation triggered at 70% context threshold
  - Context ledger offloads old messages automatically

scenarios:
  - id: CTX-001
    name: Create semantic chunker
    criticality: high
    given:
      - Chunk size configured
      - Overlap specified
    when: SemanticChunker::new called
    then:
      - Chunker initialized
      - Ready for document processing
    refs: [crates/arkavo-context/src/chunker.rs:1-50]
    changed: "2025-01-31"

  - id: CTX-002
    name: Chunk document semantically
    criticality: critical
    given:
      - Chunker ready
      - Document text provided
    when: chunk_document called
    then:
      - Text split at boundaries
      - Chunks respect size limits
      - Overlap maintained
      - Chunks returned with metadata
    refs: [crates/arkavo-context/src/chunker.rs:50-100]
    changed: "2025-01-31"
    edge_cases:
      - condition: Document smaller than chunk size
        expected: Single chunk returned
      - condition: No natural boundaries
        expected: Hard split at limit

  - id: CTX-003
    name: Deduplicate chunks
    criticality: high
    given:
      - Multiple chunks generated
      - Similarity threshold set
    when: Deduplicator::deduplicate called
    then:
      - Similar chunks identified
      - Duplicates removed
      - Unique chunks returned
    refs: [crates/arkavo-context/src/deduplicator.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: Near-duplicate threshold
        expected: Configurable strictness
      - condition: All chunks unique
        expected: All retained

  - id: CTX-004
    name: Compress context with summarization
    criticality: high
    given:
      - Context compressor ready
      - Large context provided
      - Target size specified
    when: ContextCompressor::compress called
    then:
      - Content analyzed
      - Key information preserved
      - Summary generated
      - Compression ratio tracked
    refs: [crates/arkavo-context/src/compressor.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: Context already small
        expected: Minimal compression
      - condition: Critical detail at risk
        expected: Preserve with flag

  - id: CTX-005
    name: Build compression pipeline
    criticality: medium
    given:
      - Multiple processors configured
    when: CompressionPipeline::new called
    then:
      - Pipeline assembled
      - Stages ordered
      - Ready for execution
    refs: [crates/arkavo-context/src/pipeline.rs:1-50]
    changed: "2025-01-31"

  - id: CTX-006
    name: Enrich prompt with context
    criticality: high
    given:
      - PromptEnricher ready
      - Code context available
      - Problem statement defined
    when: enrich called
    then:
      - Template populated
      - Context inserted
      - Final prompt returned
    refs: [crates/arkavo-context/src/prompt_enricher.rs:1-60]
    changed: "2025-01-31"

  - id: CTX-007
    name: Check RLM activation threshold
    criticality: high
    given:
      - Input content provided
      - Model hint available
      - Cloud vs local flag set
    when: check_rlm_activation called
    then:
      - Input tokens estimated
      - Model context size determined
      - Activation checked at 70% threshold
      - Returns activation hint if exceeded
    refs: [crates/arkavo-context/src/rlm_detection.rs:20-60]
    changed: "2025-02-05"
    edge_cases:
      - condition: Input below 70% threshold
        expected: Returns None
      - condition: Input exceeds 70% threshold
        expected: Returns activation hint message
      - condition: Unknown model
        expected: Uses default context size

  - id: CTX-008
    name: Calculate context offload threshold by model size
    criticality: high
    wip: true
    issue: "No matching implementation file exists in the codebase"
    given:
      - Model size hint provided (270M, 1B, 2B, 7B, etc.)
      - Is cloud provider flag set
    when: Context ledger thresholds determined
    then:
      - "270M: 2KB threshold, 2 turns preserved"
      - "1B: 4KB threshold, 4 turns preserved"
      - "2B: 8KB threshold, 4 turns preserved"
      - "7B: 16KB threshold, 6 turns preserved"
      - "Large local: 32KB threshold, 8 turns preserved"
      - "Cloud (Gemini/Claude/GPT): 256KB threshold, 20 turns preserved"
    changed: "2025-02-05"

  - id: CTX-009
    name: Offload context to ledger when threshold exceeded
    criticality: high
    given:
      - Conversation context exceeds threshold
      - ContextLedger initialized
      - MemoryStorage available
    when: prepare_context_for_burst called
    then:
      - Oldest messages selected for offloading
      - N recent turns preserved based on model
      - Messages archived to ContextLedger
      - "[ARCHIVED: summary] pointers inserted"
      - Compressed context returned
    refs:
      - crates/arkavo-hrm/src/conductor/orchestrator.rs:111-140
      - crates/arkavo-memory/src/ledger.rs:15-28
    changed: "2025-02-05"

  - id: CTX-010
    name: Restore archived context from ledger
    criticality: high
    given:
      - ContextLedger has archived entries
      - Archived pointer in current context
      - MemoryStorage available
    when: Context restore requested
    then:
      - Archived content retrieved by ID
      - Full context reconstructed
      - Available for model processing
    refs: [crates/arkavo-memory/src/ledger.rs:30-37]
    changed: "2025-02-05"

  - id: CTX-011
    name: Generate summary for archived context
    criticality: medium
    given:
      - Messages being archived
      - Optional summary provided or auto-generate
    when: ContextSummarizer::summarize called
    then:
      - "If summary provided: used directly"
      - "If no summary: local LLM generates 10-20 word description"
      - "Summary embedded in [ARCHIVED: ...] pointer"
      - Meaningful context preserved
    refs: [crates/arkavo-context/src/summarizer.rs:1-80]
    changed: "2025-02-05"

  - id: CTX-012
    name: Skip offload for small contexts
    criticality: medium
    given:
      - Context below min_offload_chars threshold (default 2000)
    when: prepare_context_for_burst called
    then:
      - Offloading skipped
      - Full context preserved
      - No [ARCHIVED] pointers added
    refs: [crates/arkavo-hrm/src/conductor/orchestrator.rs:117-122]
    changed: "2025-02-05"

  - id: CTX-013
    name: Estimate tokens for content
    criticality: medium
    given:
      - Text content provided
    when: estimate_tokens called
    then:
      - Approximate token count returned
      - ~4 characters per token heuristic
      - Used for budget management
    refs: [crates/arkavo-context/src/rlm_detection.rs:25-28]
    changed: "2025-02-05"

  - id: CTX-014
    name: Determine if repository context should attach
    criticality: medium
    given:
      - User prompt provided
      - Repo context mode set (auto/on/off)
    when: should_attach_repo_context called
    then:
      - 'Mode "off": always false'
      - 'Mode "on": always true'
      - 'Mode "auto": keyword detection'
      - Code keywords trigger true (readme, cargo, error, etc.)
      - Greetings/math return false
    refs: [crates/arkavo-context/src/repo_context.rs:20-90]
    changed: "2025-02-05"

  - id: CTX-015
    name: Compress repository context for small models
    criticality: medium
    given:
      - Full repository context available
      - Max tokens for model specified
    when: compress_repo_context called
    then:
      - Context truncated to fit token budget
      - Headers and key sections prioritized
      - Digest format with clear header
      - Reference to full docs included
    refs: [crates/arkavo-context/src/repo_context.rs:91-130]
    changed: "2025-02-05"
