# yaml-language-server: $schema=../schema.json

feature: A2A Protocol and Agent Communication
module: arkavo_protocol
version: 0.58.0

invariants:
  - A2A protocol enables agent-to-agent communication
  - WebSocket and HTTP transports supported
  - Registration with challenge-response authentication
  - Task execution with persistence
  - mDNS discovery for local agents
  - Peer manager handles multiple concurrent peer connections
  - Transport auto-upgrade for streaming methods
  - "Large payloads take the data plane: a control-plane message carries references to file data, never the data (PROTO-020)"

scenarios:
  - id: PROTO-001
    name: Create A2A server
    criticality: critical
    given:
      - Configuration provided
      - Transport configured
    when: A2aServer::new called
    then:
      - Server initialized
      - Transports bound
      - Ready for connections
    refs: [crates/arkavo-server/src/server/a2a_server.rs:33-148]
    changed: "2026-06-12"

  - id: PROTO-002
    name: Establish WebSocket transport
    criticality: critical
    given:
      - WebSocket endpoint specified
      - TLS configured
    when: WebSocketTransport::new called
    then:
      - Connection established
      - Bidirectional messaging ready
      - Framing protocol applied
    refs: [crates/arkavo-protocol/src/websocket.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: TLS handshake fails
        expected: Security error
      - condition: Connection timeout
        expected: Timeout error

  - id: PROTO-003
    name: Send A2A request
    criticality: critical
    given:
      - Transport connected
      - Request serialized
    when: A2aTransport::send called
    then:
      - Request framed
      - Sent over transport
      - Response awaited
    refs: [crates/arkavo-protocol/src/transport.rs:1-60]
    changed: "2025-01-31"

  - id: PROTO-004
    name: Handle agent discovery via mDNS
    criticality: high
    given:
      - mDNS feature enabled
      - Network available
    when: DiscoveryService::discover called
    then:
      - mDNS browse started
      - Agents discovered
      - Service info extracted
    refs: [crates/arkavo-protocol/src/discovery.rs:1-60, crates/arkavo-protocol/src/mdns.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: mDNS unavailable
        expected: Discovery error
      - condition: No agents found
        expected: Empty result

  - id: PROTO-005
    name: Bridge A2A to MCP
    criticality: high
    given:
      - A2A message received
      - MCP tool invoked
    when: A2aMcpBridge::convert called
    then:
      - A2A parsed
      - MCP request created
      - Response bridged back
    refs: [crates/arkavo-protocol/src/a2a_mcp_bridge.rs:1-60]
    changed: "2025-01-31"

  - id: PROTO-006
    name: Execute task with persistence
    criticality: critical
    given:
      - TaskExecutor initialized
      - TaskStore available
      - Task defined
    when: TaskExecutor::execute called
    then:
      - Task persisted
      - Execution started
      - Events logged
      - Completion saved
    refs: [crates/arkavo-protocol/src/task_executor.rs:1-60, crates/arkavo-protocol/src/task_store.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: Store unavailable
        expected: Execution continues, warning logged
      - condition: Crash mid-execution
        expected: Recovery from persisted state

  - id: PROTO-007
    name: Enforce rate limiting
    criticality: high
    given:
      - RateLimiter configured
      - Request arrives
    when: RateLimiter::check called
    then:
      - Limit checked
      - Status returned (allow/deny)
      - Cleanup scheduled
    refs: [crates/arkavo-protocol/src/rate_limit.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: Limit exceeded
        expected: RateLimitStatus::Exceeded
      - condition: IP not tracked
        expected: New entry created

  - id: PROTO-008
    name: Configure agent security
    criticality: critical
    given:
      - Security settings provided
    when: SecurityConfig::apply called
    then:
      - AuthMethod set
      - TLS version configured
      - Settings validated
    refs: [crates/arkavo-protocol/src/security.rs:1-50]
    changed: "2025-01-31"

  - id: PROTO-009
    name: Collect RPC metrics
    criticality: medium
    given:
      - MetricsCollector active
      - RPC executed
    when: RpcTimer::record called
    then:
      - Latency measured
      - Counter incremented
      - Histogram updated
    refs: [crates/arkavo-protocol/src/metrics.rs:1-50]
    changed: "2025-01-31"

  - id: PROTO-010
    name: Handle protocol errors
    criticality: high
    given:
      - Protocol operation fails
    when: Error propagates
    then:
      - A2aError created
      - Transport errors wrapped
      - Context preserved
    refs: [crates/arkavo-protocol/src/error.rs:1-40]
    changed: "2025-01-31"

  - id: PROTO-011
    name: Create peer manager with configuration
    criticality: high
    given:
      - Agent ID provided
      - PeerManagerConfig optional
    when: PeerManager::new or PeerManager::with_config called
    then:
      - PeerManager initialized
      - Empty peer map created
      - Configuration applied
      - Ready for peer connections
    refs: [crates/arkavo-protocol/src/peer_manager.rs:72-85]
    changed: "2025-02-05"

  - id: PROTO-012
    name: Connect to peer with HTTP transport
    criticality: high
    given:
      - PeerManager initialized
      - Peer URL provided (http:// or https://)
      - TransportType::Http specified
    when: connect_to_peer_with_transport called
    then:
      - URL normalized to HTTP format
      - HttpTransport created
      - Connection established
      - Peer added to peer map
    refs: [crates/arkavo-protocol/src/peer_manager.rs:116-172]
    changed: "2025-02-05"

  - id: PROTO-013
    name: Connect to peer with WebSocket transport
    criticality: high
    given:
      - PeerManager initialized
      - Peer URL provided
      - TransportType::WebSocket specified
    when: connect_to_peer_with_transport called
    then:
      - URL normalized to WebSocket format (ws:// or wss://)
      - WebSocketTransport created
      - Connection established
      - Peer added to peer map with WebSocket transport
    refs: [crates/arkavo-protocol/src/peer_manager.rs:116-198]
    changed: "2025-02-05"

  - id: PROTO-014
    name: Auto-upgrade transport for streaming methods
    criticality: high
    given:
      - Peer connected with HTTP transport
      - Method ends with "_stream" or contains "/stream"
      - auto_upgrade_streaming enabled in config
    when: select_transport_for_method called
    then:
      - TransportType::WebSocket selected
      - ensure_transport upgrades peer to WebSocket
      - Streaming-capable transport ready
    refs: [crates/arkavo-protocol/src/peer_manager.rs:87-100,207-234]
    changed: "2025-02-05"
    edge_cases:
      - condition: auto_upgrade_streaming disabled
        expected: Default transport used
      - condition: Non-streaming method
        expected: Default transport used

  - id: PROTO-015
    name: Broadcast message to all connected peers
    criticality: high
    given:
      - PeerManager has connected peers
      - Method and params provided
    when: PeerManager::broadcast called
    then:
      - Transport type selected per method
      - Message sent to each peer
      - Results collected from all peers
      - Returns vector of Ok/Err results
    refs: [crates/arkavo-protocol/src/peer_manager.rs:236-288]
    changed: "2025-02-05"

  - id: PROTO-016
    name: Send request to specific peer
    criticality: high
    given:
      - Peer connected
      - Target peer URL known
      - Method and params provided
    when: PeerManager::send_to called
    then:
      - Transport ensured for method type
      - Request created and sent
      - Response awaited and returned
    refs: [crates/arkavo-protocol/src/peer_manager.rs:290-327]
    changed: "2025-02-05"

  - id: PROTO-017
    name: Get connected peer information
    criticality: medium
    given:
      - PeerManager has peers
    when: connected_peers or connected_peers_with_transport called
    then:
      - Returns list of peer URLs
      - Optionally includes transport types
      - Read lock held briefly
    refs: [crates/arkavo-protocol/src/peer_manager.rs:329-342]
    changed: "2025-02-05"

  - id: PROTO-018
    name: Check peer connection status
    criticality: medium
    given:
      - PeerManager initialized
    when: has_peers or peer_count called
    then:
      - has_peers returns true if any peers connected
      - peer_count returns number of connected peers
      - Read lock held briefly
    refs: [crates/arkavo-protocol/src/peer_manager.rs:344-354]
    changed: "2025-02-05"

  - id: PROTO-019
    name: Connect to multiple peers at once
    criticality: medium
    given:
      - PeerManager initialized
      - List of peer URLs provided
    when: connect_to_peers called
    then:
      - Each peer connection attempted
      - Failed connections logged but don't stop others
      - Returns Ok even if some fail
    refs: [crates/arkavo-protocol/src/peer_manager.rs:102-113]
    changed: "2025-02-05"

  - id: PROTO-020
    name: Large payloads take the data plane
    criticality: high
    wip: true
    issue: "Inline file data is accepted today: handle_message_send_from passes base64 image File parts to the model (messaging.rs:170-183), and arkavo-llm takes inline images up to 10 MB (image.rs:6)"
    given:
      - A2A message/send requests and the task results an agent writes
    when: A message or a result would carry file data
    then:
      - "A File part with is_uri false holds at most 64 KiB once decoded"
      - "Larger data is staged on the agent's data-plane node and carried as a reference: name, ticket, content hash, size and media type (IROH-009, IROH-011)"
      - "A message/send with a larger inline File part is refused with an error that names the data plane"
      - "A result the agent writes never carries more than 64 KiB inline"
    edge_cases:
      - condition: An image sent for an agent's vision model
        expected: Staged and referenced; the agent fetches it before the model call
      - condition: Generated assets (swarm-assets.spec.yaml)
        expected: Delivered only as references (ASSET-005)
    refs:
      - crates/arkavo-server/src/server/handlers/messaging.rs:170-183
      - crates/arkavo-llm/src/image.rs:6
      - crates/arkavo-protocol/src/types.rs:772-791
    changed: "2026-10-11"
