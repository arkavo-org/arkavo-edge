# yaml-language-server: $schema=../schema.json

feature: Task Orchestration and Execution
module: arkavo_tasks
version: 0.67.1

invariants:
  - Tasks have deterministic IDs based on content
  - Task state persists across restarts via SQLite
  - Executor respects concurrency limits
  - Failed tasks are retryable with backoff
  - Task dependencies resolved before execution
  - Intent analysis extracts entities and subtask specs
  - Agent cards describe capabilities for task routing

scenarios:
  - id: TASK-001
    name: Plan task with dependencies
    criticality: high
    given:
      - TaskPlanner initialized
      - Task description provided
    when: plan_task() called
    then:
      - Task analyzed for complexity
      - Subtasks generated if needed
      - Dependencies identified
      - Execution plan created
    refs: [crates/arkavo-tasks/src/task_planner.rs]

  - id: TASK-002
    name: Execute task with executor
    criticality: critical
    given:
      - TaskExecutor initialized
      - Task plan available
    when: execute_task() called
    then:
      - Dependencies checked
      - Resources acquired
      - Task executed
      - Results stored
    refs: [crates/arkavo-tasks/src/task_executor.rs]

  - id: TASK-003
    name: Store task state persistently
    criticality: high
    given:
      - SqliteTaskStore initialized
      - Task state changing
    when: TaskStore::save() called
    then:
      - State serialized
      - Written to SQLite
      - Timestamp recorded
      - Recoverable after restart
    refs: [crates/arkavo-tasks/src/task_store.rs]

  - id: TASK-004
    name: Retry failed task with backoff
    criticality: high
    given:
      - Task failed
      - Retry policy configured
    when: retry_task() called
    then:
      - Backoff calculated
      - Delay applied
      - Task re-executed
      - Max retries enforced
    refs: [crates/arkavo-tasks/src/task_executor.rs]

  - id: TASK-005
    name: Human review for ambiguous tasks
    criticality: medium
    given:
      - Conductor initialized
      - Task requires clarification
    when: request_human_review() called
    then:
      - Review request queued
      - Human notified
      - Task paused
      - Resumes after response
    refs: [crates/arkavo-hrm/src/conductor.rs]

  - id: TASK-006
    name: Parallel subtask execution
    criticality: medium
    given:
      - Task decomposed into subtasks
      - No dependencies between subtasks
    when: execute_subtasks() called
    then:
      - Subtasks executed concurrently
      - Results aggregated
      - Parent task completed
    refs: [crates/arkavo-tasks/src/task_executor.rs]

  - id: TASK-007
    name: Task cancellation
    criticality: medium
    given:
      - Task in progress
      - Cancellation requested
    when: cancel_task() called
    then:
      - Cancellation signal sent
      - Running tasks stopped
      - Subtasks cancelled
      - State updated to cancelled
    refs: [crates/arkavo-tasks/src/task_executor.rs]

  - id: TASK-008
    name: Task progress tracking
    criticality: low
    given:
      - Long-running task active
      - Progress updates available
    when: progress events generated
    then:
      - Progress percentage calculated
      - ETA computed
      - Events emitted
      - UI updated
    refs: [crates/arkavo-tasks/src/task_executor.rs]
    edge_cases:
      - condition: Circular dependency detected
        expected: Returns error with dependency cycle
      - condition: Resource exhaustion
        expected: Queues task, retries when available
      - condition: Human review timeout
        expected: Escalates or fails with timeout
    changed: "2026-03-19"

  - id: TASK-009
    name: Intent analysis with entity extraction
    criticality: high
    given:
      - RuleBasedAnalyzer initialized
      - User input with intent
    when: analyze() called
    then:
      - IntentAnalysis produced
      - Entities extracted from input
      - SubTaskSpecs generated
      - Confidence scores assigned
    refs: [crates/arkavo-tasks/src/intent_analyzer.rs]
    changed: "2026-03-19"

  - id: TASK-010
    name: Agent card capabilities matching
    criticality: high
    given:
      - AgentCard with AgentCapabilities
      - Task requiring specific skills
    when: Agent matched to task
    then:
      - AgentSkills checked against requirements
      - AiCapabilities verified
      - Best agent selected
    refs: [crates/arkavo-tasks/src/types.rs]
    changed: "2026-03-19"

  - id: TASK-011
    name: SQLite task store persistence
    criticality: critical
    given:
      - SqliteTaskStore with database connection
      - Task state to persist
    when: TaskStore save/load called
    then:
      - Task serialized to SQLite
      - Load retrieves exact state
      - Concurrent access safe
    refs: [crates/arkavo-tasks/src/task_store.rs]
    changed: "2026-03-19"

  - id: TASK-012
    name: Agent registry for task routing
    criticality: medium
    given:
      - AgentRegistry with registered agents
      - Task to route
    when: Registry queried for capable agents
    then:
      - Matching agents returned
      - Capabilities filter applied
      - Empty result if no match
    refs: [crates/arkavo-tasks/src/agent_registry.rs]
    changed: "2026-03-19"
