# yaml-language-server: $schema=../schema.json

feature: Budget and Cost Management
module: arkavo_budget
version: 0.87.0

invariants:
  - All LLM calls track token usage and cost
  - Budget limits enforced before expensive operations
  - Cost middleware intercepts all provider calls
  - Budget alerts trigger at configurable thresholds
  - Model selection policy prefers cheaper models when sufficient

scenarios:
  - id: BUDGET-001
    name: Track token cost for LLM call
    criticality: critical
    given:
      - BudgetTracker initialized
      - LLM call completed
    when: track_usage() called with token counts
    then:
      - Input tokens counted
      - Output tokens counted
      - Cost calculated from provider rates
      - Running total updated
    refs: [crates/arkavo-budget/src/tracker.rs]

  - id: BUDGET-002
    name: Enforce budget limit before call
    criticality: critical
    given:
      - Budget limit configured
      - Current spend near limit
    when: BudgetMiddleware intercepts request
    then:
      - Current spend checked
      - Request blocked if over budget
      - BudgetExceeded error returned
      - No provider call made
    refs: [crates/arkavo-budget/src/middleware.rs]

  - id: BUDGET-003
    name: Model selection based on cost policy
    criticality: high
    given:
      - Multiple models available
      - Task complexity assessed
      - Budget constraints active
    when: ModelSelectionPolicy selects model
    then:
      - Cheapest sufficient model chosen
      - Complex tasks may use expensive models
      - Budget runway considered
    refs: [crates/arkavo-budget/src/policy.rs]

  - id: BUDGET-004
    name: Alert when threshold exceeded
    criticality: high
    given:
      - Alert threshold configured (e.g., 80%)
      - Budget spend crosses threshold
    when: BudgetTracker checks limits
    then:
      - Alert triggered
      - Notification sent
      - Logs warning
      - Continues operating
    refs: [crates/arkavo-budget/src/tracker.rs]

  - id: BUDGET-005
    name: Provider cost configuration
    criticality: medium
    given:
      - Provider costs configured
      - Model rates specified in cents per million tokens
    when: Cost calculated
    then:
      - Per-provider rates applied
      - Per-model rates override defaults
      - Sub-cent per-1K rates preserved (e.g., GLM-5.2 at $1.40/MTok)
      - Currency normalized
    refs: [crates/arkavo-budget/src/provider_costs.rs]

  - id: BUDGET-006
    name: Budget status with projections
    criticality: medium
    given:
      - BudgetTracker has history
      - Usage trends analyzed
    when: get_status() called
    then:
      - Current spend returned
      - Remaining budget calculated
      - Runway projection provided
      - Recommendations included
    refs: [crates/arkavo-budget/src/tracker.rs]

  - id: BUDGET-007
    name: Architect savings report
    criticality: low
    given:
      - ArchitectPlanner used
      - Multiple routing decisions made
    when: generate_savings_report() called
    then:
      - Cost vs direct routing calculated
      - Savings percentage computed
      - Usage summary by model
    refs: [crates/arkavo-budget/src/tracker.rs]
    edge_cases:
      - condition: Budget limit is zero
        expected: All requests blocked immediately
      - condition: Provider rate missing
        expected: Uses default rate, logs warning
      - condition: Spend tracking fails
        expected: Continues with warning, alerts operator
    changed: "2025-01-31"

  - id: BUDGET-008
    name: Atomic budget reservation holds lock across check and deduct
    criticality: critical
    given:
      - BudgetTracker with a configured cap
      - Concurrent routing attempts
    when: try_spend is invoked
    then:
      - Budget lock is held across the check-and-deduct
      - Concurrent reservations cannot over-commit the cap
      - Reservation is recorded before the provider call
    refs:
      - crates/arkavo-budget/src/tracker.rs
      - crates/arkavo-budget/src/tracker_tests.rs
    changed: "2026-06-28"

  - id: BUDGET-009
    name: Reservation fails closed on over-limit and budget-store errors
    criticality: critical
    given:
      - Budget limit reached or budget store returns an error
    when: route_with_budget evaluates a request
    then:
      - Request is rejected when over budget
      - Budget-store errors fail closed and surface the cause
      - No provider call is made
    refs:
      - crates/arkavo-router/src/orchestrator.rs
      - crates/arkavo-router/tests/e2e_budget_reservation.rs
    changed: "2026-06-28"

  - id: BUDGET-010
    name: Manifest pricing is authoritative over static model estimate
    criticality: high
    given:
      - Routing decision uses a static cost estimate
      - AgentSpecializationBundle provides authored manifest_pricing for the model
    when: projected_cloud_cost is computed
    then:
      - Authored manifest rate takes precedence over the static estimate
      - Missing model in a populated registry falls back to static with a warning
      - Empty registry falls back silently for backward compatibility
    refs:
      - crates/arkavo-router/src/orchestrator.rs
      - crates/arkavo-router/src/lib.rs
      - crates/arkavo-swarmkit/src/pricing.rs
    changed: "2026-06-28"

  - id: BUDGET-011
    name: CloudPolicy gates cloud spend
    criticality: high
    given:
      - CloudPolicy configured as LocalOnly, AskBeforeCloud, or CloudWithinCap
      - A routing path considers a cloud model
    when: authorize_cloud_spend is checked
    then:
      - LocalOnly denies all cloud spend
      - AskBeforeCloud requires explicit user confirmation
      - CloudWithinCap authorizes spend only within the live cap
      - Exhausted cap denies cloud even when confirmed
    refs:
      - crates/arkavo-budget/src/cloud_policy.rs
      - crates/arkavo-server/src/spend_plane.rs
    changed: "2026-06-28"
