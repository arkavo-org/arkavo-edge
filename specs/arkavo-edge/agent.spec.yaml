# yaml-language-server: $schema=../schema.json

feature: Agent Lifecycle Management
module: arkavo_agent
version: 0.67.1

invariants:
  - Agents follow config -> register -> discover -> operate lifecycle
  - AgentConfig validated before use
  - Registry tracks agent state
  - Discovery supports mDNS and directory methods
  - Device capabilities reported accurately

scenarios:
  - id: AGENT-001
    name: Load and validate agent configuration from a SwarmKit kit
    criticality: critical
    given:
      - Working directory may contain a .arkavo/*.swarmkit.yaml kit
      - -c/--config may point at an explicit kit file
    when: resolve_agent_configs runs (discover_kit_path/load_kit_file, then agent_configs_from_kit)
    then:
      - Kit discovered via env override, explicit path, or directory search
      - Manifest validated and AgentRuntimeConfig derived
      - One AgentConfig per role produced, with MCP server configs loaded from runtime.mcp_servers
      - AGENTS.md content is never read; a lone AGENTS.md yields the zero-config default plus a migrate hint
    refs:
      - crates/arkavo-swarmkit/src/discover.rs
      - crates/arkavo-swarmkit/src/runtime_config.rs
      - crates/arkavo-cli/src/commands/agent_kit.rs
    changed: "2026-07-11"
    edge_cases:
      - condition: Multiple kit files with no ARKAVO_SWARMKIT_PATH override
        expected: Fatal Multiple-candidates error, no silent default fallback
      - condition: -n/--name role selector does not match any role in the kit
        expected: Fatal error listing available role ids
      - condition: No kit found anywhere in the resolution order
        expected: Falls through to the zero-config default AgentConfig

  - id: AGENT-002
    name: Register agent with control plane
    criticality: critical
    given:
      - AgentConfig valid
      - RegistrationService available
    when: Registration initiated with challenge-response
    then:
      - ChallengeRequest sent
      - ChallengeResponse verified
      - RegistrationStatus updated
    refs: [crates/arkavo-agent/src/lib.rs:40-43]
    changed: "2026-03-19"

  - id: AGENT-003
    name: Discover peers via mDNS
    criticality: high
    given:
      - DiscoveryService initialized
      - DiscoveryMethod set to mDNS
    when: Discovery scan triggered
    then:
      - Local network scanned
      - AgentInfo collected for peers
      - Registry updated with discovered agents
    refs: [crates/arkavo-agent/src/lib.rs:39]
    changed: "2026-03-19"

  - id: AGENT-004
    name: Report device capabilities
    criticality: medium
    given:
      - Agent running on device
    when: Capabilities requested
    then:
      - DeviceCapabilities populated
      - MCP tool info collected
      - AgentCapabilitiesGetResponse returned
    refs: [crates/arkavo-agent/src/types.rs]
    changed: "2026-03-19"

  - id: AGENT-005
    name: Handle agent errors
    criticality: high
    given:
      - Agent operation fails
    when: Error propagated
    then:
      - AgentError created with context
      - Error chain preserved
      - No panics on recoverable errors
    refs: [crates/arkavo-agent/src/error.rs]
    changed: "2026-03-19"
