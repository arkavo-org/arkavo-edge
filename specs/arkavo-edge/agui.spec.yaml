feature: Arkavo GUI Application Gateway
module: arkavo_agui
version: 0.57.2

invariants:
  - AgUiGateway manages agent connections
  - mDNS discovery for peer agents
  - Health monitoring and ROI metrics
  - Timeout analysis and handling

scenarios:
  - id: AGUI-001
    name: Initialize AGUI gateway
    criticality: critical
    given:
      - Network available
      - Configuration loaded
    when: AgUiGateway::new called
    then:
      - Gateway initialized
      - mDNS responder started
      - Ready for connections
    refs: [crates/arkavo-agui/src/gateway.rs:1-60, crates/arkavo-agui/src/gateway_mdns.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-002
    name: Discover agents via mDNS
    criticality: high
    given:
      - Gateway running
      - Agents on network
    when: mDNS browse executed
    then:
      - Agents discovered
      - Service info extracted
      - Registry updated
    refs: [crates/arkavo-agui/src/mdns_impl.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: No agents found
        expected: Empty list
      - condition: mDNS failure
        expected: Error, retry

  - id: AGUI-003
    name: Establish agent connection
    criticality: high
    given:
      - Agent discovered
      - Connection parameters known
    when: connect_agent called
    then:
      - Connection established
      - Handshake completed
      - Channel ready
    refs: [crates/arkavo-agui/src/agent_connection.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-004
    name: Collect command health data
    criticality: medium
    given:
      - Commands executed
      - Health collector active
    when: health data collected
    then:
      - Success/failure tracked
      - Latency measured
      - Timeout patterns analyzed
    refs: [crates/arkavo-agui/src/command_health_collector.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-005
    name: Analyze timeout patterns
    criticality: medium
    given:
      - Timeout data collected
    when: TimeoutAnalyzer::analyze called
    then:
      - Patterns identified
      - Root causes suggested
      - Recommendations provided
    refs: [crates/arkavo-agui/src/command_health_collector.rs:60-100]
    changed: "2025-01-31"

  - id: AGUI-006
    name: Calculate ROI metrics
    criticality: low
    given:
      - Task completion data
      - Cost information
    when: ROI calculated
    then:
      - Cost/benefit analyzed
      - Metrics computed
      - Report generated
    refs: [crates/arkavo-agui/src/roi_metrics.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-007
    name: Handle UI events
    criticality: high
    given:
      - UI active
      - User interaction occurs
    when: UiHandler processes event
    then:
      - Event routed
      - Handler invoked
      - Response rendered
    refs: [crates/arkavo-agui/src/ui_handler.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-008
    name: Stream dataflow updates
    criticality: medium
    given:
      - Dataflow active
      - Client subscribed
    when: streaming::send_update called
    then:
      - Update serialized
      - Streamed to client
      - Backpressure handled
    refs: [crates/arkavo-agui/src/streaming.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-009
    name: Aggregate context topology from pushed telemetry
    criticality: high
    given:
      - Agents connected via mDNS
      - system.metrics.subscribe active
      - context_topology data pushed every 5s
    when: RequestContextTopology received from browser
    then:
      - Per-agent topology cache read
      - ToolMemory, AntiPatterns, DecisionTraces, Gossip parsed
      - Thompson priors from LearningModule aggregated
      - ContextTopologyUpdate event sent to browser
    refs: [crates/arkavo-agui/src/gateway_context.rs:10-120]
    changed: "2026-03-24"

  - id: AGUI-010
    name: Parse pushed context topology snapshots
    criticality: high
    given:
      - Agent pushes context_topology in metrics stream
      - JSON contains toolMemory, gossip, antiPatterns, decisionTraces
    when: Snapshot parsed by gateway
    then:
      - ToolMemory fields extracted (entryCount, errorCount, duplicateCount)
      - AntiPatterns extracted with decayed weights
      - Decision traces extracted with abbreviated selection reason
      - Gossip stats extracted (peers, events, episodes, lessons)
      - Empty response handled safely
    refs: [crates/arkavo-agui/src/gateway_context.rs:120-300]
    changed: "2026-03-24"

  - id: AGUI-011
    name: Cache context topology per agent
    criticality: high
    given:
      - Agent metrics subscription active
      - context_topology telemetry event received
    when: Event forwarded to browser sessions
    then:
      - Latest snapshot cached in context_topology_cache by agent_id
      - Each agent has its own cache entry
      - Previous snapshot overwritten
    refs: [crates/arkavo-agui/src/mdns_impl.rs:200-225]
    changed: "2026-03-24"

  - id: AGUI-012
    name: Push context utilization via telemetry stream
    criticality: high
    given:
      - Conductor completes tool loop
      - Peak context tokens computed
    when: system.metrics.subscribe pushes next sample
    then:
      - contextUtilizationPct included in context_topology object
      - Value read from global PEAK_CONTEXT_UTILIZATION_BP atomic
      - Gateway enriches AgentContextInfo from cache
      - Ring gauges show actual context window pressure
    refs: [crates/arkavo-server/src/server/conductor.rs:17-20, crates/arkavo-server/src/server/mod.rs:1272-1280]
    changed: "2026-03-24"

  - id: AGUI-013
    name: Findings inbox renders tightening proposals as per-agent cards
    criticality: high
    given:
      - An ArpStatusUpdate snapshot carrying per-agent proposal lists
    when: renderArp runs
    then:
      - Each proposal renders as a card keyed by agent, never gateway-global
      - Card shows state, effect summary, rationale, and evidence counts
      - Proposals in proposed state expose Approve/Reject buttons carrying
        the agent id and proposal id
    refs: [crates/arkavo-agui/static/js/panels/arp.js, crates/arkavo-agui/src/arp_handler.rs]
    changed: "2026-06-10"

  - id: AGUI-014
    name: Proposal review action round-trips to a fresh snapshot
    criticality: high
    given:
      - A held proposal rendered in the findings inbox
    when: RequestArpProposalAction arrives from the client
    then:
      - The review is applied to that agent's ProposalQueue
      - An ArpProposalActionResult plus a fresh ArpStatusUpdate push to the
        acting client without waiting for the panel poll
      - Direction is re-checked at approval time
    refs: [crates/arkavo-agui/src/arp_handler.rs, crates/arkavo-agui/src/gateway_ws.rs]
    changed: "2026-06-10"

  - id: AGUI-015
    name: Bandit health view summarizes adaptation priors per agent
    criticality: medium
    given:
      - Agent snapshots carrying adaptation prior summaries
    when: the bandit health view renders
    then:
      - Beta curves render from alpha/beta counts as inline SVG
      - Evidence split separates live from distilled mass
      - Numeric interpolation only — no remote strings enter attributes
    refs: [crates/arkavo-agui/static/js/panels/arp.js, crates/arkavo-agui/src/types.rs]
    changed: "2026-06-10"

  - id: AGUI-016
    name: Gateway exposes a spec-compliant AG-UI SSE endpoint
    criticality: critical
    given:
      - The gateway is running
      - At least one agent is connected
    when: A client POSTs RunAgentInput to /api/agent
    then:
      - The endpoint returns an SSE stream
      - The stream emits RUN_STARTED and RUN_FINISHED lifecycle events
      - "The response uses data: <json> framing"
    refs: [crates/arkavo-agui/src/gateway_agent.rs, crates/arkavo-agui/src/gateway.rs]
    changed: "2026-06-12"

  - id: AGUI-017
    name: Canonical text messages follow Start→Content→End streaming
    criticality: high
    given:
      - An agent run is streaming via /api/agent
    when: The agent emits assistant text
    then:
      - A TEXT_MESSAGE_START event precedes content
      - Each fragment is delivered as TEXT_MESSAGE_CONTENT
      - A TEXT_MESSAGE_END event closes the message
    refs: [crates/arkavo-agui/src/agui_event_stream.rs]
    changed: "2026-06-12"

  - id: AGUI-018
    name: Canonical tool calls follow Start→Args→End→Result streaming
    criticality: high
    given:
      - An agent run is streaming via /api/agent
    when: The agent invokes a tool
    then:
      - TOOL_CALL_START carries tool_call_id and name
      - TOOL_CALL_ARGS streams argument fragments
      - TOOL_CALL_END marks completion
      - TOOL_CALL_RESULT carries the tool output
    refs: [crates/arkavo-agui/src/agui_event_stream.rs]
    changed: "2026-06-12"

  - id: AGUI-019
    name: Legacy WebSocket clients receive backward-compatible events
    criticality: high
    given:
      - A client is connected to /ws
      - Canonical AG-UI events are flowing
    when: The legacy bridge translates canonical events
    then:
      - TEXT_MESSAGE_CONTENT maps to MessageDelta
      - State and message snapshots preserve eventId
      - Lifecycle events map to legacy lifecycle.start/end/error
    refs: [crates/arkavo-agui/src/legacy_agui_bridge.rs]
    changed: "2026-06-12"

  - id: AGUI-020
    name: Custom Arkavo events are transported as spec CUSTOM events
    criticality: medium
    given:
      - A gateway producer emits an Arkavo-specific event
    when: It is placed on the canonical stream
    then:
      - "The event is wrapped as { type: \"CUSTOM\", name, value }"
      - The legacy bridge unwraps it back to the legacy shape
    refs: [crates/arkavo-agui/src/legacy_agui_bridge.rs]
    changed: "2026-06-12"
