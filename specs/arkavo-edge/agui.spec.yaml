feature: Arkavo GUI Application Gateway
module: arkavo_agui
version: 0.57.3

invariants:
  - AgUiGateway manages agent connections
  - mDNS discovery for peer agents
  - Health monitoring and ROI metrics
  - Timeout analysis and handling
  - "Only the gateway's own pages and non-browser clients reach it; a Host must name this machine"

scenarios:
  - id: AGUI-001
    name: Initialize AGUI gateway
    criticality: critical
    given:
      - Network available
      - Configuration loaded
    when: AgUiGateway::new called
    then:
      - Gateway initialized
      - mDNS responder started
      - Ready for connections
    refs: [crates/arkavo-agui/src/gateway.rs:1-60, crates/arkavo-agui/src/gateway_mdns.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-002
    name: Discover agents via mDNS
    criticality: high
    given:
      - Gateway running
      - Agents on network
    when: mDNS browse executed
    then:
      - Agents discovered
      - Service info extracted
      - Registry updated
    refs: [crates/arkavo-agui/src/mdns_impl.rs:1-60]
    changed: "2025-01-31"
    edge_cases:
      - condition: No agents found
        expected: Empty list
      - condition: mDNS failure
        expected: Error, retry

  - id: AGUI-003
    name: Establish agent connection
    criticality: high
    given:
      - Agent discovered
      - Connection parameters known
    when: connect_agent called
    then:
      - Connection established
      - Handshake completed
      - Channel ready
    refs: [crates/arkavo-agui/src/agent_connection.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-004
    name: Collect command health data
    criticality: medium
    given:
      - Commands executed
      - Health collector active
    when: health data collected
    then:
      - Success/failure tracked
      - Latency measured
      - Timeout patterns analyzed
    refs: [crates/arkavo-agui/src/command_health_collector.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-005
    name: Analyze timeout patterns
    criticality: medium
    given:
      - Timeout data collected
    when: TimeoutAnalyzer::analyze called
    then:
      - Patterns identified
      - Root causes suggested
      - Recommendations provided
    refs: [crates/arkavo-agui/src/command_health_collector.rs:60-100]
    changed: "2025-01-31"

  - id: AGUI-006
    name: Calculate ROI metrics
    criticality: low
    given:
      - Task completion data
      - Cost information
    when: ROI calculated
    then:
      - Cost/benefit analyzed
      - Metrics computed
      - Report generated
    refs: [crates/arkavo-agui/src/roi_metrics.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-007
    name: Handle UI events
    criticality: high
    given:
      - UI active
      - User interaction occurs
    when: UiHandler processes event
    then:
      - Event routed
      - Handler invoked
      - Response rendered
    refs: [crates/arkavo-agui/src/ui_handler.rs:1-60]
    changed: "2025-01-31"

  - id: AGUI-008
    name: Stream dataflow updates
    criticality: medium
    given:
      - Dataflow active
      - Client subscribed
    when: streaming::send_update called
    then:
      - Update serialized
      - Streamed to client
      - Backpressure handled
    refs: [crates/arkavo-agui/src/streaming.rs:1-50]
    changed: "2025-01-31"

  - id: AGUI-009
    name: Aggregate context topology from pushed telemetry
    criticality: high
    given:
      - Agents connected via mDNS
      - system.metrics.subscribe active
      - context_topology data pushed every 5s
    when: RequestContextTopology received from browser
    then:
      - Per-agent topology cache read
      - ToolMemory, AntiPatterns, DecisionTraces, Gossip parsed
      - Thompson priors from LearningModule aggregated
      - ContextTopologyUpdate event sent to browser
    refs: [crates/arkavo-agui/src/gateway_context.rs:10-120]
    changed: "2026-03-24"

  - id: AGUI-010
    name: Parse pushed context topology snapshots
    criticality: high
    given:
      - Agent pushes context_topology in metrics stream
      - JSON contains toolMemory, gossip, antiPatterns, decisionTraces
    when: Snapshot parsed by gateway
    then:
      - ToolMemory fields extracted (entryCount, errorCount, duplicateCount)
      - AntiPatterns extracted with decayed weights
      - Decision traces extracted with abbreviated selection reason
      - Gossip stats extracted (peers, events, episodes, lessons)
      - Empty response handled safely
    refs: [crates/arkavo-agui/src/gateway_context.rs:120-300]
    changed: "2026-03-24"

  - id: AGUI-011
    name: Cache context topology per agent
    criticality: high
    given:
      - Agent metrics subscription active
      - context_topology telemetry event received
    when: Event forwarded to browser sessions
    then:
      - Latest snapshot cached in context_topology_cache by agent_id
      - Each agent has its own cache entry
      - Previous snapshot overwritten
    refs: [crates/arkavo-agui/src/mdns_impl.rs:200-225]
    changed: "2026-03-24"

  - id: AGUI-012
    name: Push context utilization via telemetry stream
    criticality: high
    given:
      - Conductor completes tool loop
      - Peak context tokens computed
    when: system.metrics.subscribe pushes next sample
    then:
      - contextUtilizationPct included in context_topology object
      - Value read from global PEAK_CONTEXT_UTILIZATION_BP atomic
      - Gateway enriches AgentContextInfo from cache
      - Ring gauges show actual context window pressure
    refs: [crates/arkavo-server/src/server/conductor.rs:17-20, crates/arkavo-server/src/server/mod.rs:1272-1280]
    changed: "2026-03-24"

  - id: AGUI-013
    name: Findings inbox renders tightening proposals as per-agent cards
    criticality: high
    given:
      - An ArpStatusUpdate snapshot carrying per-agent proposal lists
    when: renderArp runs
    then:
      - Each proposal renders as a card keyed by agent, never gateway-global
      - Card shows state, effect summary, rationale, and evidence counts
      - Proposals in proposed state expose Approve/Reject buttons carrying
        the agent id and proposal id
    refs: [crates/arkavo-agui/static/js/panels/arp.js, crates/arkavo-agui/src/arp_handler.rs]
    changed: "2026-06-10"

  - id: AGUI-014
    name: Proposal review action round-trips to a fresh snapshot
    criticality: high
    given:
      - A held proposal rendered in the findings inbox
    when: RequestArpProposalAction arrives from the client
    then:
      - The review is applied to that agent's ProposalQueue
      - An ArpProposalActionResult plus a fresh ArpStatusUpdate push to the
        acting client without waiting for the panel poll
      - Direction is re-checked at approval time
    refs: [crates/arkavo-agui/src/arp_handler.rs, crates/arkavo-agui/src/gateway_ws.rs]
    changed: "2026-06-10"

  - id: AGUI-015
    name: Bandit health view summarizes adaptation priors per agent
    criticality: medium
    given:
      - Agent snapshots carrying adaptation prior summaries
    when: the bandit health view renders
    then:
      - Beta curves render from alpha/beta counts as inline SVG
      - Evidence split separates live from distilled mass
      - Numeric interpolation only — no remote strings enter attributes
    refs: [crates/arkavo-agui/static/js/panels/arp.js, crates/arkavo-agui/src/types.rs]
    changed: "2026-06-10"

  - id: AGUI-016
    name: Gateway exposes a spec-compliant AG-UI SSE endpoint
    criticality: critical
    given:
      - The gateway is running
      - At least one agent is connected
    when: A client POSTs RunAgentInput to /api/agent
    then:
      - The endpoint returns an SSE stream
      - The stream emits RUN_STARTED and RUN_FINISHED lifecycle events
      - "The response uses data: <json> framing"
    refs: [crates/arkavo-agui/src/gateway_agent.rs, crates/arkavo-agui/src/gateway.rs]
    changed: "2026-06-12"

  - id: AGUI-017
    name: Canonical text messages follow Start→Content→End streaming
    criticality: high
    given:
      - An agent run is streaming via /api/agent
    when: The agent emits assistant text
    then:
      - A TEXT_MESSAGE_START event precedes content
      - Each fragment is delivered as TEXT_MESSAGE_CONTENT
      - A TEXT_MESSAGE_END event closes the message
    refs: [crates/arkavo-agui/src/agui_event_stream.rs]
    changed: "2026-06-12"

  - id: AGUI-018
    name: Canonical tool calls follow Start→Args→End→Result streaming
    criticality: high
    given:
      - An agent run is streaming via /api/agent
    when: The agent invokes a tool
    then:
      - TOOL_CALL_START carries tool_call_id and name
      - TOOL_CALL_ARGS streams argument fragments
      - TOOL_CALL_END marks completion
      - TOOL_CALL_RESULT carries the tool output
    refs: [crates/arkavo-agui/src/agui_event_stream.rs]
    changed: "2026-06-12"

  - id: AGUI-019
    name: Legacy WebSocket clients receive backward-compatible events
    criticality: high
    given:
      - A client is connected to /ws
      - Canonical AG-UI events are flowing
    when: The legacy bridge translates canonical events
    then:
      - TEXT_MESSAGE_CONTENT maps to MessageDelta
      - State and message snapshots preserve eventId
      - Lifecycle events map to legacy lifecycle.start/end/error
    refs: [crates/arkavo-agui/src/legacy_agui_bridge.rs]
    changed: "2026-06-12"

  - id: AGUI-020
    name: Custom Arkavo events are transported as spec CUSTOM events
    criticality: medium
    given:
      - A gateway producer emits an Arkavo-specific event
    when: It is placed on the canonical stream
    then:
      - "The event is wrapped as { type: \"CUSTOM\", name, value }"
      - The legacy bridge unwraps it back to the legacy shape
    refs: [crates/arkavo-agui/src/legacy_agui_bridge.rs]
    changed: "2026-06-12"

  - id: AGUI-021
    name: Gateway refuses cross-site and rebound requests
    criticality: critical
    given:
      - The arkavo ui gateway is listening, on loopback by default
      - A web page the user visits is on another site, or on a DNS name pointed at this machine
    when: The page opens /ws or /debug, or sends any request, to the gateway
    then:
      - A request whose Origin is not the gateway's own scheme and host:port is refused with 403 before any handler runs
      - A request whose Host is not localhost, a loopback address, or an address literal the gateway listens on is refused with 403
      - A request without Origin (a non-browser client or a plain navigation) is admitted when its Host passes
      - The gateway's own pages, which connect to their own /ws, keep working
    refs: [crates/arkavo-agui/src/gateway_origin.rs, "crates/arkavo-agui/src/gateway.rs:486-495"]
    changed: "2026-10-04"
    edge_cases:
      - condition: "Origin https://evil.example on a WebSocket upgrade to /ws (accepted with 101 before this change)"
        expected: "403"
      - condition: Host evil.example with a matching Origin (DNS rebinding)
        expected: 403, refused on Host
      - condition: Origin null, a repeated Origin, or an Origin that is not valid header text
        expected: "403"
      - condition: ARKAVO_AGUI_BIND=0.0.0.0 and the page opened at http://192.168.1.5:7700
        expected: Admitted, since an address literal cannot be rebound; a host name such as box.local is refused
      - condition: HTTP/2 request with no Host header
        expected: The request authority is checked instead

  - id: AGUI-022
    name: A task submitted from the UI is followed while it reports change
    criticality: high
    given:
      - A task submitted in arkavo ui has gone to an agent
    when: The gateway polls the agent's task with tasks/get
    then:
      - "Polling goes on while the task's status, progress message or percentage changes, as for arkavo task and arkavo chat (CLI-019)"
      - "A poll the agent turns away, its rate limiter included, or whose report the gateway cannot read, is no change"
      - "After 5 minutes with no change the task is marked failed with the agent's task id and how to read its result with tasks/get"
    edge_cases:
      - condition: "A delegated image job that downloads weights and generates for longer than 5 minutes, reporting each step"
        expected: "It is followed to its result, not marked failed at 5 minutes as before"
    refs:
      - crates/arkavo-agui/src/gateway_task_dispatch.rs
      - crates/arkavo-protocol/src/task_watch.rs
    changed: "2026-10-17"

  - id: AGUI-023
    name: A task request is accepted once, and its receipt reaches every view
    criticality: high
    given:
      - An operator creates a task in arkavo ui, over localhost or a LAN address
    when: The browser sends submitTask with a request id
    then:
      - "The request id comes from crypto.randomUUID where the browser offers it, and from crypto.getRandomValues otherwise: browsers offer randomUUID only on HTTPS or localhost"
      - "The gateway records the request id on the task it opens and sends the receipt (taskSubmitted with requestId) to every open view, so one that reconnected after sending still hears it"
      - "A request whose id the gateway already holds opens no second task: the gateway answers it with the first task's receipt"
      - "With no receipt after 15 seconds or a dropped socket, the composer says the outcome is unknown, keeps the draft and offers Send again, which reuses the request id while the draft is unchanged"
      - "Reconnecting sends nothing by itself"
    edge_cases:
      - condition: "A policy review or an end-tracking request whose receipt does not come"
        expected: "Its buttons unlock with the outcome reported unknown; a late receipt still reports the outcome. End-tracking receipts reach every view"
    refs:
      - crates/arkavo-agui/static/js/task-composer.js
      - crates/arkavo-agui/src/gateway_task_dispatch.rs
      - crates/arkavo-agui/src/gateway_ws.rs
    changed: "2026-10-18"

  - id: AGUI-024
    name: The task list stays light, and an opened task fetches its own output
    criticality: medium
    given:
      - A long arkavo ui session with many tasks and large outputs
    when: Views poll the task list every few seconds
    then:
      - "The task list says whether each task has output (hasResult) and lists its images, without carrying the output"
      - "A view that opens a task without its output asks for it (requestTask) and gets the whole of it (taskDetail), after a reload included"
      - "The gateway keeps its 500 newest tasks, dropping the oldest finished ones first; a running task is never dropped"
      - "The open view is drawn at most once per animation frame, and Evidence rows are rebuilt only while Evidence is shown"
    refs:
      - crates/arkavo-agui/src/gateway_events.rs
      - crates/arkavo-agui/src/gateway.rs
      - crates/arkavo-agui/static/js/panels/tasks.js
      - crates/arkavo-agui/static/js/app.js
    changed: "2026-10-18"

  - id: AGUI-025
    name: Images a task's agent delivers are shown with the task
    criticality: high
    given:
      - A task submitted from arkavo ui completes with an answer whose data part lists assets (urn:arkavo:asset:manifest:v1, ASSET-008)
    when: The gateway sees the task complete
    then:
      - "The answer's text parts are its output, joined in order"
      - "The process running arkavo ui fetches each asset over the data plane and checks it against the manifest as arkavo chat does (CLI-018), into the user's data directory"
      - "Every open view gets the task with its images: name, size, dimensions, whether it has alpha, and the license line naming the generating agent (IMG-013)"
      - "The task's Output shows each image, transparent ones on a checkerboard, and the Overview shows the latest images"
      - "GET /assets/<task>/<name> serves only a file a fetch recorded on that task, as image/png"
    edge_cases:
      - condition: A build without a fetcher
        expected: "The task says the images stayed on the agent, rather than showing nothing"
      - condition: A fetch that fails
        expected: "The task says the images could not be fetched and why; its output text is kept"
    refs:
      - crates/arkavo-agui/src/gateway_assets.rs
      - crates/arkavo-cli/src/commands/ui_assets.rs
      - crates/arkavo-agui/static/js/task-assets.js
    changed: "2026-10-18"

  - id: AGUI-026
    name: Agents named with --agent join when they answer and keep their endpoint
    criticality: medium
    given:
      - arkavo ui started with --agent IP:PORT for a peer multicast cannot find
    when: The workspace starts, or the peer is down, or mDNS reports the same agent
    then:
      - "The workspace starts at once; each named peer is connected in the background, trying again with a pause that grows to one minute"
      - "The endpoint the operator named wins over one discovery found for the same agent, and two --agent peers never share a name"
      - "mDNS rediscovery does not replace a named peer's record, and an mDNS goodbye, which any host on the LAN can send, does not remove it"
    refs:
      - crates/arkavo-agui/src/gateway_direct.rs
      - crates/arkavo-agui/src/mdns_impl.rs
      - crates/arkavo-agui/src/gateway.rs
    changed: "2026-10-18"

  - id: AGUI-027
    name: Agents' notices reach every view, and may take the view where they point
    criticality: high
    given:
      - An arkavo ui workspace connected to agents that raise notices (SRV-016)
    when: A snapshot reports a notice that is new, changed or gone
    then:
      - "Each new or changed notice reaches every view once, though every snapshot repeats it; one no longer reported is resolved in every view"
      - "A view that connects asks for the open notices and gets every one, the gateway's own included"
      - "The header shows how many are open; warnings and critical notices wait in a banner with their actions, and the notices dialog lists them all"
      - "A critical notice takes the view to where it points (an agent, a task, a workspace view); the viewer can make that every notice or none, a setting kept in their browser"
      - "Nothing moves the view while the operator types or has a dialog open: the notice waits, says so, and opens once they stop"
      - "Titles, text and details are shown as text, never as markup"
      - "When an agent restarts, on the same port or a new one, the workspace subscribes to it again and its notices keep coming"
    refs:
      - crates/arkavo-agui/src/gateway_notices.rs
      - crates/arkavo-agui/src/agent_connection.rs
      - crates/arkavo-agui/src/mdns_impl.rs
      - crates/arkavo-agui/static/js/notices.js
    changed: "2026-10-18"

  - id: AGUI-028
    name: A workspace task that fails is a notice with a retry
    criticality: medium
    given:
      - A task submitted from arkavo ui
    when: The agent refuses it, it fails, or it reports nothing new for five minutes
    then:
      - "The gateway raises a warning to every view: what went wrong, the task to open, Retry task and Dismiss"
      - "Retry task submits the task's objective again as a new task and closes the notice; Dismiss closes it"
      - "The gateway keeps at most 20 notices of its own; a second failure of the same task replaces the first"
    refs:
      - crates/arkavo-agui/src/gateway_notices.rs
      - crates/arkavo-agui/src/gateway_task_dispatch.rs
    changed: "2026-10-18"

  - id: AGUI-029
    name: An operator's answer to a notice reaches the agent, and is on the record
    criticality: high
    given:
      - A notice open in arkavo ui
    when: The operator chooses one of its actions
    then:
      - "Inspect and Open act in the browser; every choice still goes to the gateway, which records it (target audit) with the session, agent, notice and action"
      - "Acknowledging an agent's notice calls that agent's operator.notices.respond; once it accepts, the notice is resolved in every view"
      - "Every view hears what came of the choice (noticeActionResult), with the reason when it was not done"
      - "An answer acts with the agent's own grants and checks: choosing an action grants nothing new"
    edge_cases:
      - condition: An action the notice does not offer, a notice no longer open, or an agent no longer connected
        expected: "Not done, with the reason"
      - condition: The gateway is disconnected
        expected: "Acknowledge and Retry are disabled; Inspect still opens"
    refs:
      - crates/arkavo-agui/src/gateway_notices.rs
      - crates/arkavo-agui/src/gateway_ws.rs
      - crates/arkavo-agui/static/js/notices.js
    changed: "2026-10-18"

