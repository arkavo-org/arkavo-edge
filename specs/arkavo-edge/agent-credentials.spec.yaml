# yaml-language-server: $schema=../schema.json

feature: Verifiable Agent Credentials and Governance Events
module: arkavo-trust, arkavo-device-identity, arkavo-agent-auth
version: 0.81.0

invariants:
  - "Credentials on the DID: agent attestation and issuer entitlements are expressible as verifiable credentials bound to the agent's did:key"
  - "Standard governance events: trust, attestation, and revocation state changes emit signed events a standard governance plane (CAEP / Shared Signals) can consume"
  - "did:key only: Ed25519 (0xed01) and P-256 (0x1200) did:key are the only DID methods in scope; org-hosted did:web is explicitly out of scope for this revision"
  - "Format per credential: SD-JWT VC for presented credentials (selective disclosure at access time); W3C JSON-LD VC 2.0 where semantic interop is required"
  - "Holder binding: a presented credential is cryptographically bound to the attested did:key and cannot be replayed by a different holder"

# Conformance targets (verified against live spec text on 2026-06-15 unless noted)
conformance_targets:
  - id: VC-DM-20
    name: "W3C Verifiable Credentials Data Model 2.0 (Recommendation, 2025-05-15)"
    url: https://www.w3.org/TR/vc-data-model-2.0/
    status: verified
  - id: DID-CORE
    name: "W3C Decentralized Identifiers (DIDs) 1.0 (Recommendation, 2022-07-19)"
    url: https://www.w3.org/TR/did-core/
    status: verified
  - id: DIDKEY
    name: "did:key Method v0.9 (W3C CCG draft); P-256 0x1200, Ed25519 0xed"
    url: https://w3c-ccg.github.io/did-key-spec/
    status: verified (community draft, not a Recommendation)
  - id: RFC9901
    name: "Selective Disclosure for JSON Web Tokens (SD-JWT)"
    url: https://www.rfc-editor.org/rfc/rfc9901
    status: verified
  - id: SD-JWT-VC
    name: "SD-JWT-based Verifiable Credentials (draft-ietf-oauth-sd-jwt-vc-16)"
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-sd-jwt-vc/
    status: verified (Internet-Draft, not yet an RFC)
  - id: BITSTRING-SL
    name: "W3C Bitstring Status List 1.0 (Recommendation, 2025-05-15) — supersedes StatusList2021"
    url: https://www.w3.org/TR/vc-bitstring-status-list/
    status: verified
  - id: CAEP-10
    name: "OpenID Continuous Access Evaluation Profile 1.0 (Final, 2025-08-29)"
    url: https://openid.net/specs/openid-caep-specification-1_0.html
    status: verified
  - id: SSF-10
    name: "OpenID Shared Signals Framework 1.0 (Final, 2025-08-29); SET = RFC 8417"
    url: https://openid.net/specs/openid-sharedsignals-framework-1_0.html
    status: verified
  - id: MCP-T-020
    name: "Model Context Protocol — Trust Extension (MCP-T) v0.2.0-draft"
    url: https://github.com/Percival-Labs/mcp-t/blob/main/spec/mcp-t-v0.2.0.md
    status: verified (draft spec)
  - id: MCP-I-KYA
    name: "MCP-I / KYA-OS (DIF Trusted AI Agents WG)"
    url: https://github.com/decentralized-identity/kya-os-mcp
    status: verified (active WG draft)

scenarios:
  - id: AGC-001
    name: Attestation as a verifiable credential
    criticality: high
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [VC-DM-20, SD-JWT-VC]
    conformance_status: verified
    given:
      - A verified attestation quote (HATT-007)
    when: A credential is issued
    then:
      - An AgentAttestationCredential is produced with the agent did:key as subject
      - Claims carry the attestation evidence and assurance tier, signed (ES256)
      - Semantic-interop form is W3C JSON-LD VC 2.0; presentation form is SD-JWT VC
    refs:
      - crates/arkavo-trust/src/events.rs
      - crates/arkavo-trust/src/signing.rs
    changed: "2026-06-15"

  - id: AGC-002
    name: Issuer entitlements as a credential with selective-disclosure presentation
    criticality: high
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [SD-JWT-VC, RFC9901]
    conformance_status: verified
    given:
      - An issuer (an enterprise IdP or any authority) grants entitlements
    when: The entitlement credential is issued and later presented
    then:
      - An EntitlementCredential binds entitlements to the agent did:key
      - The agent presents it as an SD-JWT VC at access time, disclosing only required claims
    changed: "2026-06-15"

  - id: AGC-003
    name: did:key resolution and key rotation (did:web out of scope)
    criticality: high
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [DIDKEY, DID-CORE]
    conformance_status: verified
    given:
      - An agent did:key (Ed25519 0xed01 and/or P-256 0x1200)
    when: A verifier resolves the identifier
    then:
      - The public key is recovered directly from the identifier (self-certifying, no network resolution)
      - Rotation issues a new did:key and revokes the old (ties HATT-012)
    edge_cases:
      - condition: Org-hosted, https-resolvable discovery wanted
        expected: did:web is deferred to a later revision; out of scope here
    changed: "2026-06-15"

  - id: AGC-004
    name: Trust and attestation events via CAEP / Shared Signals
    criticality: high
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [CAEP-10, SSF-10, MCP-T-020]
    conformance_status: verified
    given:
      - A trust or assurance change (e.g. Trusted to Suspended, assurance-level-change)
    when: The change occurs
    then:
      - A signed CAEP event (session-revoked, assurance-level-change, or credential-change) is emitted over Shared Signals for a governance plane to consume
      - An MCP-T trust event is also published internally via trust/publish
    refs:
      - crates/arkavo-trust/src/types.rs:273-289
    changed: "2026-06-15"

  - id: AGC-005
    name: Credential revocation and propagation
    criticality: critical
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [BITSTRING-SL, CAEP-10]
    conformance_status: verified
    given:
      - An orchestrator hard-revoke or a hardware key loss (HATT-012)
    when: Revocation is issued
    then:
      - A Bitstring Status List entry marks the credential revoked
      - A CAEP session-revoked event propagates to consumers
      - Outstanding tokens and credentials are invalidated (ties TOK-008)
      - A verifier presented a revoked credential rejects it
    changed: "2026-06-15"

  - id: AGC-006
    name: Re-attestation TTL feeds continuous verification
    criticality: high
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [MCP-T-020, CAEP-10]
    conformance_status: verified
    given:
      - An attestation TTL
    when: Re-attestation succeeds or fails
    then:
      - A verification event continuously updates the MCP-T score (not a one-shot evaluation)
      - Failure emits assurance-level-change or session-revoked
    changed: "2026-06-15"

  - id: AGC-007
    name: Selective-disclosure presentation into TDF/ABAC
    criticality: medium
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [SD-JWT-VC]
    conformance_status: verified
    given:
      - An EntitlementCredential held by the agent
    when: The agent presents it to access TDF/ABAC-protected data
    then:
      - Only the required claims are disclosed (SD-JWT VC; BBS+ is a future option)
      - The disclosed claims bind to the attested did:key for ABAC evaluation
    edge_cases:
      - condition: Re-specifying ABAC enforcement here
        expected: Cross-referenced to the TDF security spec; not duplicated
    changed: "2026-06-15"

  - id: AGC-008
    name: Interop with MCP-I / KYA-OS agent identity
    criticality: medium
    wip: true
    issue: https://github.com/arkavo-org/arkavo-edge/issues/630
    conformance: [MCP-I-KYA]
    conformance_status: aligned
    given:
      - An enterprise running MCP-I / KYA-OS (DIF Trusted AI Agents WG) for agent identity
    when: The Arkavo agent presents identity and delegation
    then:
      - The agent's did:key, verifiable credential, and delegation map onto KYA-OS conformance levels (L1 OIDC/JWT, L2 DID + credential delegation)
      - An MCP-I verifier accepts the Arkavo agent
    edge_cases:
      - condition: KYA-OS assumes but does not specify a hardware root
        expected: Arkavo supplies the hardware attestation (HATT) underneath the MCP-I identity layer
    changed: "2026-06-15"

# Security considerations (audience: offensive-security reviewers)
security:
  - id: SEC-AC-001
    name: No credential-not-required bypass
    description: Where a credential or presentation is required, its absence fails closed; there is no silent unauthenticated path.
  - id: SEC-AC-002
    name: Holder binding
    description: Presented credentials are bound to the attested did:key (SD-JWT key-binding JWT); a credential cannot be replayed by a different holder.
  - id: SEC-AC-003
    name: Revocation freshness
    description: Verifiers check the Bitstring Status List; a revoked credential is rejected within the propagation window, consistent with SEC-TA-005.
  - id: SEC-AC-004
    name: Selective disclosure
    description: Presentations disclose the minimum claims required; the full credential is not over-shared.
  - id: SEC-AC-005
    name: Event integrity
    description: Governance events are signed (MCP-T sec 4.2.5 JCS, or Security Event Token) and verifiable by the consumer.

# Composed and cross-referenced specs
composed_specs:
  - { spec: hardware-attestation.spec.yaml, relation: attestation evidence and key rotation feed the attestation credential and revocation }
  - { spec: token-binding.spec.yaml, relation: revocation/introspection events kill live tokens }
  - { spec: trusted-agent.spec.yaml, phases: [5, 6], relation: credential issuance and governance events extend the post-trust lifecycle }
