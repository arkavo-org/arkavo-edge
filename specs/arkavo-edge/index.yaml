    description: Agent behavioral sequence integrity and taint tracking
    criticality: critical
    scenario_count: 17
    invariants:
      - Every tool call is taint-tracked from data source to data sink
      - Action sequences are evaluated as directed graphs, not isolated calls
      - Cross-session decomposition detected via persistent sequence ledger
