# Arkavo Edge Behavior Specification Index

version: 0.91.0
last_updated: 2026-08-30

components:
  - name: trusted-agent
    file: trusted-agent.spec.yaml
    module: cross_cutting
    description: End-to-end trust establishment for agent mesh participation
    criticality: critical
    scenario_count: 7
    invariants:
      - Deny-by-default mesh access
      - Forward-only trust chain
      - No ambient authority from mesh membership
      - Attestation binds to device identity

  - name: hardware-attestation
    file: hardware-attestation.spec.yaml
    module: arkavo_attestation
    description: Hardware-rooted agent attestation — SEP/TPM P-256 key, signed quotes, assurance ladder
    criticality: critical
    scenario_count: 13
    invariants:
      - Non-extractable SEP/TPM attestation key
      - Quote verifiable by a remote party without trusting the host
      - No silent downgrade; software is never Trusted
      - Additive P-256 key; existing Ed25519 did:key identities remain valid

  - name: token-binding
    file: token-binding.spec.yaml
    module: arkavo_agent_auth
    description: Sender-constrained agent tokens (CWT/COSE cnf, mTLS) and attestation-based OAuth Token Exchange
    criticality: critical
    scenario_count: 10
    invariants:
      - Stolen bearer token is unusable without proof-of-possession
      - Proof-of-possession key equals the attested hardware key
      - IdP-agnostic issuance via RFC 8693; no IdP-specific code in core
      - No silent bearer downgrade

  - name: agent-credentials
    file: agent-credentials.spec.yaml
    module: arkavo_trust
    description: Verifiable agent credentials (SD-JWT/JSON-LD VC) on did:key and CAEP/SSF governance events
    criticality: critical
    scenario_count: 8
    invariants:
      - Attestation and entitlements expressed as verifiable credentials on did:key
      - State changes emit standard CAEP/Shared Signals events
      - did:key only; did:web out of scope this revision
      - Presented credentials bound to the attested did:key

