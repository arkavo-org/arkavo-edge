# Cross-component behaviors
integration_points:
  - name: Registration → Chat Session
    description: Authenticated sessions use verified device registrations
    specs: [REG-002, REG-003, CHAT-001]

  - name: Crypto → Gossip
    description: Message signing uses crypto primitives
    specs: [CRYPTO-002, GOSSIP-002]

  - name: Router → Chat Session
    description: Chat sessions use router for quality-gated responses
    specs: [ROUTER-002, CHAT-009]

  - name: Crypto → TDF
    description: TDF uses crypto for key wrapping and signatures
    specs: [CRYPTO-011, TDF-002]

  - name: Autolearn → Gossip
    description: Patchlets propagate via gossip protocol
    specs: [AUTO-005, GOSSIP-006]
