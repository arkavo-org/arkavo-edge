# Arkavo Edge Behavior Specification Index

version: 0.57.1
last_updated: 2025-01-31

components:
  - name: registration
    file: registration.spec.yaml
    module: arkavo_protocol::registration
    description: Device and agent onboarding with challenge-response
    criticality: critical
    scenario_count: 12
    invariants:
      - Challenge IDs are SHA-256 unique
      - 300-second TTL on challenges
      - Dual-key support (Ed25519 + P-256)

  - name: crypto
    file: crypto.spec.yaml
    module: arkavo_crypto
    description: Cryptographic primitives and key management
    criticality: critical
    scenario_count: 11
    invariants:
      - Ed25519: 32-byte keys, 64-byte signatures
      - P-256 SEC1: 65-byte uncompressed keys
      - DID:key with multicodec prefixes

  - name: chat-session
    file: chat-session.spec.yaml
    module: arkavo_protocol::chat_session
    description: LLM chat session lifecycle management
    criticality: high
    scenario_count: 13
    invariants:
      - UUID v4 session IDs
      - State machine: Active → Closing → Closed
      - 100-delta back-pressure threshold

  - name: gossip-protocol
    file: gossip-protocol.spec.yaml
    module: arkavo_gossip
    description: Decentralized message propagation and consensus
    criticality: high
    scenario_count: 8
    invariants:
      - Ed25519 signatures on all messages
      - 2/3 quorum threshold
      - 60-second anti-entropy interval

  - name: router
    file: router.spec.yaml
    module: arkavo_router
    description: LLM routing with quality gates and cost optimization
    criticality: critical
    scenario_count: 10
    invariants:
      - Preflight moderation before model selection
      - Max 3 quality gate retries with escalation
      - Streaming bounded channels (100 chunks)

  - name: tdf
    file: tdf.spec.yaml
    module: arkavo_tdf
    description: Trusted Data Format encryption and policy enforcement
    criticality: critical
    scenario_count: 9
    invariants:
      - AES-256-GCM payload encryption
      - Policy binding for integrity
      - KAS rewrap required for decryption

  - name: autolearn
    file: autolearn.spec.yaml
    module: arkavo_autolearn
    description: Auto-learning with patchlets and verification
    criticality: high
    scenario_count: 8
    invariants:
      - Patchlet verification before application
      - Exponential decay on signals
      - Network consensus for cross-swarm patchlets

  - name: memory
    file: memory.spec.yaml
    module: arkavo_memory
    description: Context memory, embeddings, and ledger storage
    criticality: high
    scenario_count: 7
    invariants:
      - Memories scoped to agent domain
      - Context ledger append-only
      - Embeddings normalized

  - name: budget
    file: budget.spec.yaml
    module: arkavo_budget
    description: Budget tracking, cost management, and policy
    criticality: critical
    scenario_count: 7
    invariants:
      - All LLM calls track cost
      - Budget limits enforced
      - Middleware intercepts all calls

  - name: authorization
    file: authorization.spec.yaml
    module: arkavo_authorization
    description: Access control and authorization decisions
    criticality: critical
    scenario_count: 6
    invariants:
      - All access requires explicit check
      - Decision cache with TTL
      - Bulk decisions optimize checks

  - name: device-identity
    file: device-identity.spec.yaml
    module: arkavo_device_identity
    description: Device ID management and secure storage
    criticality: high
    scenario_count: 6
    invariants:
      - Device ID unique per installation
      - Persists across restarts
      - Platform-appropriate storage

  - name: observability
    file: observability.spec.yaml
    module: arkavo_observability
    description: Metrics, health checks, and monitoring
    criticality: medium
    scenario_count: 8
    invariants:
      - Metrics include timestamps
      - Session lifecycle tracked
      - Health reports aggregate status

  - name: mcp-tools
    file: mcp-tools.spec.yaml
    module: arkavo_mcp_tools
    description: MCP tool registry and execution
    criticality: critical
    scenario_count: 10
    invariants:
      - Tools registered before execution
      - Schemas define valid parameters
      - Progressive disclosure supported

  - name: events
    file: events.spec.yaml
    module: arkavo_events
    description: Event system and audit logging
    criticality: high
    scenario_count: 8
    invariants:
      - Events have unique UUIDs
      - Events immutable once created
      - Schema version tracked

