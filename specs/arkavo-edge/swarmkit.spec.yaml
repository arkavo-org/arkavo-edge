# yaml-language-server: $schema=../schema.json

feature: SwarmKit Manifest, Runtime, and Gateway Integration
module: arkavo_swarmkit
version: 0.74.0

invariants:
  - SwarmKit manifest is parser+validator only — no runtime side effects
  - kit.id MUST equal BLAKE3 of canonical manifest minus kit.id and provenance.signatures
  - kit.expires - kit.created MUST NOT exceed 1 year (spec §10.1 cap)
  - evaluation.rubric.dimensions weight sum MUST equal 1.0 (spec §4.6)
  - role_type is free-form per spec §4.3 / Appendix C; orchestrator MUST NOT reject domain-specific values
  - SwarmFlight builds one ArpRuntime per role at launch (spec §1.2 / §5 handoff)
  - Each role's DecisionTrace and PolicyCache are isolated from other roles in the same flight
  - Per-role budget MUST NOT exceed constraints.global_budget when validated (spec §5.1)
  - SwarmFlight is a logical orchestration object — no process spawning, A2A wire, or TDF unwrap
  - ArpHandler stores flight roles under synthetic agent_id "flight:<flight_id>:<role_id>" so multi-flight role_id collisions are impossible
  - FlightContext on AgentArpStatus carries kit_id, kit_name, role_id, role_type for the AG-UI panel
  - ARKAVO_SWARMKIT_PATH auto-launch failures are logged and non-fatal — a misconfigured kit MUST NOT prevent gateway boot
  - Skill resolution is eager at SwarmFlight::launch when LaunchOptions.resolver_config is Some
  - Inline skill payloads are deserialized into typed SkillContent before signature verification
  - ed25519 signature is computed over BLAKE3 of JCS-canonical SkillContent bytes (matches kit.id canonicalization)
  - Kit MAY declare top-level mcp_servers — a registry of {name, command, args, transport} entries roles reference by name
  - Every roles[].mcp_tools[].server MUST resolve to a declared mcp_servers[].name or validation fails (ValidationError::UnknownMcpServer)
  - mcp_servers command/args MAY contain ${VAR} placeholders expanded by the runtime at launch, not at parse time (keeps kit.id stable)
  - mcp_servers is part of the canonical manifest and therefore covered by kit.id
  - A role with a non-empty mcp_tools grant is a live/orchestrator role that drives an MCP tool loop (observe→act) terminated by completion.rules; a role with no grants is advisory
  - coordination.topology=hub-spoke with exactly one live role is the canonical embodied-agent-plus-advisors pattern
  - A conformant runtime MAY realize a kit as a one-shot deliverable flight OR as a live MCP tool loop; arkavo swarmkit play is the reference for the live loop

scenarios:
  # --- Manifest layer (arkavo-swarmkit) -----------------------------------

  - id: SK-001
    name: Parse a SwarmKit manifest from YAML and run cross-block validation
    criticality: critical
    given:
      - YAML manifest conforming to spec §4
      - All required fields present (spec_version, kit, objective, roles, coordination, constraints, completion, provenance)
    when: parse_yaml called
    then:
      - Manifest deserializes into typed Rust structs
      - validate() runs all cross-block invariants
      - Returns Manifest on success
    refs:
      - crates/arkavo-swarmkit/src/lib.rs:39-44
      - crates/arkavo-swarmkit/src/manifest.rs:14-30
    changed: "2026-04-30"

  - id: SK-002
    name: Reject manifest with role budget exceeding global cap
    criticality: critical
    given:
      - Manifest with role.agent_provisioning.budget.max_total_tokens > constraints.global_budget.max_total_tokens
    when: validate called
    then:
      - Returns ValidationError::BudgetExceedsGlobal
      - Includes role id, field name, value, and limit in error
    refs:
      - crates/arkavo-swarmkit/src/validate.rs:137-171
    changed: "2026-04-30"

  - id: SK-003
    name: kit.id round-trips through BLAKE3 of canonical form
    criticality: critical
    given:
      - Manifest with declared kit.id
    when: validate called and kit.id is non-empty
    then:
      - canonical_json computed with kit.id and provenance.signatures stripped
      - BLAKE3 of canonical bytes base64url-encoded
      - Computed hash matches declared kit.id or returns KitIdHashMismatch
    refs:
      - crates/arkavo-swarmkit/src/canonical.rs:92-100
      - crates/arkavo-swarmkit/src/validate.rs:211-223
    changed: "2026-04-30"

  - id: SK-004
    name: Reject manifest with expiry horizon exceeding §10.1 cap
    criticality: high
    given:
      - kit.created and kit.expires set
      - expires - created > 365 days
    when: validate called
    then:
      - Returns ValidationError::ExpiryHorizonTooLarge
    refs:
      - crates/arkavo-swarmkit/src/validate.rs:188-202
    changed: "2026-04-30"
    edge_cases:
      - condition: expires <= created
        expected: ExpiryBeforeCreated error

  - id: SK-005
    name: Validate evaluation rubric weights sum to 1.0
    criticality: high
    given:
      - Manifest with evaluation block
      - dimensions[*].weight values
    when: validate called
    then:
      - Sum of weights computed
      - If |sum - 1.0| > 1e-6 returns RubricWeightsDoNotSumToOne
    refs:
      - crates/arkavo-swarmkit/src/validate.rs:116-126
    changed: "2026-04-30"

  - id: SK-006
    name: Accept domain-specific role_type values
    criticality: medium
    given:
      - Manifest role with role_type outside the recommended vocabulary (e.g. "campaign_lead", "asset_analyst")
    when: parse_yaml + validate called
    then:
      - Manifest parses successfully
      - role_type retains domain-specific value
    refs:
      - crates/arkavo-swarmkit/src/role.rs:5-25
    changed: "2026-04-30"

  # --- Runtime layer (arkavo-swarmkit-runtime) ----------------------------

  - id: SK-010
    name: SwarmFlight launch builds one ArpRuntime per role
    criticality: critical
    given:
      - Validated manifest with N roles
      - LaunchOptions with no overrides
    when: SwarmFlight::launch called
    then:
      - For each role, derive_arp_for_role produces a default ARP doc
      - ArpRuntime::from_document instantiated per role
      - RoleRuntime stored keyed by role_id, retains the ArpDocument
    refs:
      - crates/arkavo-swarmkit-runtime/src/flight.rs:98-137
      - crates/arkavo-swarmkit-runtime/src/derive.rs:56-117
    changed: "2026-04-30"

  - id: SK-011
    name: Per-role DecisionTrace and PolicyCache stay isolated
    criticality: critical
    given:
      - Active SwarmFlight with multiple roles
      - Tool outcomes recorded against role A
    when: outcomes recorded via record_tool_outcome
    then:
      - role A's DecisionTrace contains the outcome
      - role B's DecisionTrace does NOT contain the outcome
      - role A's PolicyCache holds the entry
      - role B's PolicyCache is unchanged
    refs:
      - crates/arkavo-swarmkit-runtime/src/flight.rs:165-184
      - crates/arkavo-swarmkit-runtime/tests/campaign_kit_flight.rs:15-115
    changed: "2026-04-30"

  - id: SK-012
    name: Below-quality-gate outcome degrades the role's prior
    criticality: high
    given:
      - SwarmFlight with role having default 0.7 quality gate
    when: record_tool_outcome called with quality < 0.7
    then:
      - AdaptationEngine prior beta increases for the tool
      - DecisionTrace entry has success=false
      - error_type tagged "below_quality_gate"
    refs:
      - crates/arkavo-swarmkit-runtime/tests/campaign_kit_flight.rs:117-147
    changed: "2026-04-30"

  - id: SK-013
    name: Default ARP doc derived from agent_provisioning + global budget
    criticality: high
    given:
      - Role with agent_provisioning block
      - constraints.global_budget.max_cost_usd
      - role_count = N
    when: derive_arp_for_role called
    then:
      - Adaptation method = thompson_sampling
      - Quality gate threshold = 0.7
      - PolicyCache TTL = 3600s with exponential decay
      - Budget task_ceiling_usd = global_cost / N
      - Velocity = task_ceiling / 5 minutes
      - adl_ref.uri = "urn:swarmkit:role:<role_id>"
    refs:
      - crates/arkavo-swarmkit-runtime/src/derive.rs:56-117
    changed: "2026-04-30"

  - id: SK-014
    name: LaunchOptions.arp_overrides supplies hand-authored ARP per role
    criticality: medium
    given:
      - LaunchOptions with arp_overrides containing a role_id present in the manifest
    when: SwarmFlight::launch called
    then:
      - The supplied ArpDocument is used instead of derive_arp_for_role
      - RoleRuntime.arp_document() returns the override
    refs:
      - crates/arkavo-swarmkit-runtime/src/flight.rs:106-117
    changed: "2026-04-30"
    edge_cases:
      - condition: override role_id not in manifest
        expected: LaunchError::UnknownOverrideRole

  - id: SK-015
    name: flight_id propagates into per-role DecisionTrace task_id
    criticality: medium
    given:
      - SwarmFlight launched with explicit flight_id
    when: record_tool_outcome called for any role
    then:
      - DecisionTrace entry's task_id equals the flight_id
      - DecisionTrace entry's agent_id equals the role_id
    refs:
      - crates/arkavo-swarmkit-runtime/src/flight.rs:170-182
    changed: "2026-04-30"

  # --- Gateway integration (arkavo-agui) ----------------------------------

  - id: SK-020
    name: SwarmFlightRegistry.register attaches every role to ArpHandler
    criticality: critical
    given:
      - Active SwarmFlight
      - ArpHandler instance
    when: SwarmFlightRegistry::register called
    then:
      - Each role surfaces in ArpHandler under flight:<flight_id>:<role_id>
      - Each AgentArpStatus carries FlightContext (kit_id, kit_name, role_id, role_type)
      - The role's ArpRuntime is reused — not rebuilt
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:36-56
      - crates/arkavo-agui/src/arp_handler.rs:204-235
    changed: "2026-04-30"

  - id: SK-021
    name: SwarmFlightRegistry.deregister removes only that flight's roles
    criticality: high
    given:
      - Multiple flights and mesh agents registered
    when: deregister called for one flight_id
    then:
      - All roles under that flight_id removed from ArpHandler
      - Other flights' roles remain
      - Mesh agents remain
      - Registry entry for flight_id removed
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:60-65
      - crates/arkavo-agui/src/arp_handler.rs:243-248
    changed: "2026-04-30"

  - id: SK-022
    name: ARKAVO_SWARMKIT_PATH auto-launches a flight at gateway boot
    criticality: high
    given:
      - ARKAVO_SWARMKIT_PATH env var points at a valid manifest
      - Gateway initializing
    when: auto_launch_from_environment called during AppState construction
    then:
      - Manifest parsed (YAML or JSON depending on extension)
      - SwarmFlight launched
      - Registry holds the flight
      - ArpHandler holds every role
      - Returns Ok(Some(flight_id))
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:91-102
      - crates/arkavo-agui/src/gateway.rs:401-417
    changed: "2026-04-30"
    edge_cases:
      - condition: env var unset
        expected: Ok(None) — no flight launched
      - condition: manifest fails to parse or validate
        expected: tracing::warn logged, gateway boot continues

  - id: SK-023
    name: ArpHandler snapshot orders local → mesh agents → flight roles
    criticality: medium
    given:
      - (local) agent registered
      - Multiple mesh agents registered with arbitrary ids
      - One or more flight roles registered
    when: snapshot called
    then:
      - First entry is the (local) synthetic agent
      - Mesh agents follow alphabetically by agent_id
      - Flight roles last, grouped by flight_id then role_id
    refs:
      - crates/arkavo-agui/src/arp_handler.rs:259-281
    changed: "2026-04-30"

  - id: SK-024
    name: AgentArpStatus serializes flightContext using camelCase
    criticality: medium
    given:
      - Flight role registered with FlightContext
    when: snapshot serialized to JSON for the AG-UI WebSocket
    then:
      - Field name is "flightContext" (camelCase)
      - Inner fields are flightId, kitId, kitName, roleId, roleType
      - flightContext omitted on non-flight agents (skip_serializing_if)
    refs:
      - crates/arkavo-agui/src/types.rs:1126-1156
    changed: "2026-04-30"

  # --- Panel UI -----------------------------------------------------------

  - id: SK-030
    name: ARP panel renders an Active SwarmFlights section when flights are present
    criticality: medium
    given:
      - WebSocket snapshot containing one or more agents with flightContext
    when: renderArp called
    then:
      - renderArpFlightsSection emits a section above the agent dropdown
      - Roles grouped by flightId in manifest insertion order
      - Each role rendered as a clickable pill carrying role_id, role_type, status glyph, count
    refs:
      - crates/arkavo-agui/static/js/panels/arp.js:134-208
    changed: "2026-04-30"
    edge_cases:
      - condition: snapshot contains no flightContext entries
        expected: section returns empty string and is not rendered

  - id: SK-031
    name: Clicking a flight pill selects the corresponding role
    criticality: medium
    given:
      - Active SwarmFlights section rendered
      - User clicks a role pill
    when: pill click event fires
    then:
      - AppState.arpSelectedAgent set to the synthetic flight:<id>:<role> agent_id
      - renderArp re-runs and the document/violations/cache/adaptation/traces sections show that role's state
    refs:
      - crates/arkavo-agui/static/js/panels/arp.js:91-101
    changed: "2026-04-30"

  - id: SK-032
    name: Pill status reflects violations, traces, or empty state
    criticality: low
    given:
      - Flight role with decisionTraces in the snapshot
    when: pill rendered
    then:
      - violationCount > 0 → ⚠ glyph and arp-flight-pill-violation class
      - traceCount > 0 and no violations → ✓ glyph and base class
      - traceCount = 0 → ○ glyph and base class
      - selected role gets arp-flight-pill-selected class
    refs:
      - crates/arkavo-agui/static/js/panels/arp.js:163-188
    changed: "2026-04-30"

  - id: SK-033
    name: ArpStatusUpdate skips re-render when snapshot is unchanged
    criticality: low
    given:
      - ARP panel rendered with a known snapshot
      - Server sends another ArpStatusUpdate whose payload is identical except for the timestamp field
    when: handleArpStatusUpdate runs
    then:
      - JSON fingerprint of the snapshot (excluding timestamp) is computed
      - Compared against AppState.arpLastFingerprint
      - If equal, renderArp is NOT called — DOM stays stable so <select> focus, scroll position, and pill hover state are preserved
      - If different (e.g. a flight stopped, a new outcome arrived), AppState.arpLastFingerprint is updated and renderArp runs
    refs:
      - crates/arkavo-agui/static/js/panels/arp.js:13-35
    changed: "2026-05-01"

  # --- TDF envelope (spec §6) ----------------------------------------------

  - id: SK-050
    name: TDF envelope round-trips a SwarmKit manifest losslessly
    criticality: critical
    given:
      - Validated SwarmKit manifest
      - TdfEncryptor + TdfDecryptor pair (e.g. OpenTdfService or MockTdfService)
      - SwarmKit-level orchestrator policy
    when: wrap_manifest then unwrap_manifest are called in sequence
    then:
      - Manifest serialized via canonical_full_manifest (sorted keys, no whitespace)
      - Encrypted bytes wrapped in TdfManifest with the policy bound
      - Decrypted plaintext parses back into an equal Manifest (including kit.id and provenance.signatures)
      - Wrap output is deterministic when the encryptor is deterministic
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:32-56
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:62-72
    changed: "2026-05-01"

  - id: SK-051
    name: unwrap_manifest re-validates the recovered manifest
    criticality: high
    given:
      - TdfManifest whose decrypted payload is corrupt or fails cross-block validation
    when: unwrap_manifest is called
    then:
      - TdfEnvelopeError::Decrypt returned when ciphertext fails MAC/AEAD check
      - TdfEnvelopeError::Utf8 returned when plaintext is not valid UTF-8
      - TdfEnvelopeError::Parse returned when JSON does not validate against the manifest schema
      - No partially-constructed Manifest is ever returned from a failed unwrap
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:74-86
    changed: "2026-05-01"

  - id: SK-052
    name: swarmkit_orchestrator_policy emits the §6.3 baseline gate
    criticality: medium
    given:
      - Optional clearance level (defaults to "internal")
      - Optional orchestrator DID
    when: swarmkit_orchestrator_policy is called
    then:
      - Policy includes attribute https://attr.arkavo.com/role with value "orchestrator"
      - Policy includes attribute https://attr.arkavo.com/clearance with the supplied or default value
      - When orchestrator_did is Some, dissemination contains exactly that DID
      - When orchestrator_did is None, dissemination is empty (attribute-only gating)
      - PolicyBuilder validation succeeds (every attribute has at least one value, FQNs are URLs)
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:103-122
    changed: "2026-05-01"

  - id: SK-053
    name: role_policy converts TdfAttributeReleasePolicy into a runnable Policy
    criticality: high
    given:
      - role's tdf_attribute_release_policy from the manifest
      - Optional agent DID for dissemination binding
    when: role_policy is called
    then:
      - Each attribute string split at the last "/" into (fqn, value)
      - Attributes sharing an FQN merged into a single OpenTDF attribute with multiple values
      - Policy id set to "swarmkit:role:<role_id>"
      - When agent_did is Some, dissemination contains exactly that DID
      - When agent_did is None, dissemination is empty
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:154-194
    changed: "2026-05-01"

  # --- KAS gate (spec §6.3) ------------------------------------------------

  - id: SK-058
    name: extract_embedded_policy decodes the policy carried in the TDF envelope
    criticality: high
    given:
      - TdfManifest produced by wrap_manifest with a SwarmKit-level policy
    when: extract_embedded_policy is called
    then:
      - encryption_information.policy is base64-decoded
      - The decoded JSON is parsed into a Policy struct
      - All attributes and dissemination entries from the wrap-time policy are recovered
      - verify_embedded_policy_requires accepts FQNs the policy carries
      - verify_embedded_policy_requires rejects FQNs that are absent with TdfEnvelopeError::PolicyMismatch listing missing and found
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:282-326
    changed: "2026-05-01"

  - id: SK-059
    name: unwrap_manifest_kas_gated succeeds when KAS healthy and policy matches
    criticality: critical
    given:
      - Healthy KasClient
      - TdfManifest carrying the required attributes
    when: unwrap_manifest_kas_gated is called
    then:
      - KAS health_check passes
      - Embedded policy contains the required FQNs
      - Underlying TdfDecryptor decrypts and the manifest is returned validated
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:344-382
    changed: "2026-05-01"

  - id: SK-060
    name: unwrap_manifest_kas_gated fails fast on unhealthy KAS or policy mismatch
    criticality: critical
    given:
      - KasClient that reports unhealthy OR a TdfManifest whose policy lacks the required attributes
    when: unwrap_manifest_kas_gated is called
    then:
      - Unhealthy KAS returns TdfEnvelopeError::KasUnavailable WITHOUT calling the decryptor
      - Policy mismatch returns TdfEnvelopeError::PolicyMismatch listing missing FQNs WITHOUT calling the decryptor
      - Distinct variant from KAS-side denial during decrypt (which surfaces as TdfEnvelopeError::Decrypt)
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:355-365
    changed: "2026-05-01"

  - id: SK-055
    name: write_kit_tdf and read_kit_tdf round-trip a TdfManifest losslessly
    criticality: high
    given:
      - TdfManifest produced by wrap_manifest
    when: serialized via write_kit_tdf and parsed back via read_kit_tdf
    then:
      - On-disk format is canonical JSON of the TdfManifest struct
      - Recovered TdfManifest is serde-equal to the original
      - Encryption metadata (encryptionInformation) and inline base64 payload preserved
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:269-289
    changed: "2026-05-01"

  - id: SK-056
    name: wrap_manifest_to_path / unwrap_manifest_from_path round-trip a Manifest
    criticality: high
    given:
      - Manifest, encryptor, policy, and target path
    when: wrap_manifest_to_path then unwrap_manifest_from_path are called
    then:
      - .swarmkit.tdf file written at the path
      - File reads back cleanly through the consumer flow
      - Recovered Manifest equals the original (kit.id, signatures, every field)
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:309-336
    changed: "2026-05-01"

  - id: SK-057
    name: file-format readers report distinct errors for I/O vs parse failures
    criticality: medium
    given:
      - Reader for a missing path or non-JSON content
    when: read_kit_tdf or unwrap_manifest_from_path is invoked
    then:
      - Missing file produces TdfEnvelopeError::Io
      - Malformed JSON produces TdfEnvelopeError::Serialize (serde_json failures map to that variant)
      - No partially-constructed TdfManifest is ever returned from a failed read
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:291-307
    changed: "2026-05-01"

  - id: SK-054
    name: role_policies extracts per-role policies and supports DID lookup
    criticality: high
    given:
      - Manifest with some roles declaring tdf_attribute_release_policy
      - Closure mapping role_id → Option<DID>
    when: role_policies is called
    then:
      - Roles without an ARP block are omitted from the result
      - Each role's policy carries the DID returned by the closure for that role_id
      - role_policies_for_current_agent loads the agent DID from arkavo-agent-auth StoredToken and binds every role to it
      - Malformed attribute strings (missing "/" or non-URL prefix) produce TdfError::Policy
    refs:
      - crates/arkavo-swarmkit-runtime/src/tdf.rs:212-245
    changed: "2026-05-01"

  # --- TDF auto-launch (slice 5) ------------------------------------------

  - id: SK-061
    name: is_tdf_path recognises .tdf and .swarmkit.tdf extensions case-insensitively
    criticality: medium
    given:
      - File path with various extensions
    when: is_tdf_path is called
    then:
      - .tdf returns true
      - .swarmkit.tdf returns true
      - mixed-case .SWARMKIT.TDF returns true
      - .yaml / .json / no extension return false
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:179-189
    changed: "2026-05-01"

  - id: SK-062
    name: auto_launch dispatches .tdf paths through unwrap_manifest_from_path
    criticality: high
    given:
      - ARKAVO_SWARMKIT_PATH points at a .swarmkit.tdf file
      - arkavo-agui built with the `tdf` feature
    when: auto_launch_from_environment runs at gateway boot
    then:
      - is_tdf_path returns true on the env-var path
      - launch_from_tdf_path used instead of launch_from_path
      - OpenTdfService default decryptor decrypts the envelope
      - Recovered manifest validated and SwarmFlight launched
      - Without the `tdf` feature, AutoLaunchError::TdfFeatureDisabled is returned (rebuild guidance in the message)
      - Decrypt failures (KAS unreachable, key denied) surface as AutoLaunchError::TdfUnwrap, distinct from Read / Parse / Launch
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:104-117
      - crates/arkavo-agui/src/swarm_flight_registry.rs:140-170
    changed: "2026-05-01"

  # --- Operator controls ---------------------------------------------------

  - id: SK-070
    name: orchestrator binds roles to mesh agents by capability matching
    criticality: high
    given:
      - A pool of identity-only agents has registered with arkavo-protocol::AgentRegistry
      - Each agent advertises capability strings that match either RoleSpec.skills or RoleSpec.mcp_tools[].server
      - A SwarmKit manifest with N roles is available on disk (plain YAML/JSON)
    when: orchestrator invokes apply_kit
    then:
      - Each role is matched to one agent via RoleCapabilityMatcher::match_role using AgentRegistry::find_best_agent
      - The returned RoleBinding records (role_id, role_type, agent_did, rationale)
      - When no agent in the pool covers any required capability for some role, ApplyKitError::RoleUncoverable is returned naming the unmatched role
    refs:
      - crates/arkavo-orchestrator/src/swarmkit_apply.rs:155-205
      - crates/arkavo-orchestrator/src/swarmkit_apply.rs:218-260
    changed: "2026-05-02"

  - id: SK-071
    name: per-role specialization bundle is TDF-wrapped with a policy bound to the recipient agent's DID
    criticality: high
    given:
      - apply_kit has matched all roles to agents
      - The orchestrator has a BundleEncryptor wired to a TDF service
    when: apply_kit constructs and ships each per-role AgentSpecializationBundle
    then:
      - For each role, a bundle is built with persona, api_tokens, arp_overlay, role_context populated from the manifest and TokenVault
      - The bundle is wrapped via BundleEncryptor::wrap with the assigned agent's DID
      - The receiving side's verify_dissemination_includes rejects the wrap when a different DID attempts unwrap
    refs:
      - crates/arkavo-orchestrator/src/swarmkit_apply.rs:262-320
      - crates/arkavo-protocol/src/agent_specialization.rs:123-141
      - crates/arkavo-protocol/src/agent_specialization.rs:162-176
    changed: "2026-05-02"

  - id: SK-072
    name: agent.specialize unwraps the bundle and applies persona, tokens, and role context
    criticality: high
    given:
      - An agent has registered its DID and is listening on A2A
      - The orchestrator has shipped a TDF-wrapped AgentSpecializationBundle via the agent.specialize RPC
    when: handle_agent_specialize processes the encrypted_bundle
    then:
      - encrypted_bundle is base64-decoded and the BundleDecryptor recovers the bundle
      - AgentMetadata.purpose, .model, and .api_keys are replaced from bundle.persona / bundle.api_tokens
      - The bundle's RoleContext is stored in RoleSpecializationStore so subsequent tool outcomes can be tagged with flight_id + role_id
      - When the bundle's policy dissemination list does not include this agent's DID, the handler returns -32603 and no metadata changes are applied
    refs:
      - crates/arkavo-server/src/server/handlers/specialization.rs:65-185
      - crates/arkavo-server/src/server/config_helpers.rs:8-30
    changed: "2026-05-02"

  - id: SK-073
    name: orchestrator launches the SwarmFlight with role_agent_bindings and dispatches the first per-role task
    criticality: high
    given:
      - All per-role bundles have been shipped successfully
      - The orchestrator has a RoleTaskTransport wired to A2A
    when: apply_kit calls SwarmFlight::launch and dispatch_initial_tasks
    then:
      - LaunchOptions.role_agent_bindings is populated from the assignment plan
      - Each RoleRuntime exposes the bound DID via bound_agent_did()
      - dispatch_initial_tasks calls the transport once per bound role with a RoleTaskEnvelope carrying flight_id, role_id, role_type, agent_did, and the role's first task
      - record_tool_outcome thereafter tags DecisionTrace entries with the bound agent DID rather than the bare role_id
    refs:
      - crates/arkavo-orchestrator/src/swarmkit_apply.rs:322-352
      - crates/arkavo-swarmkit-runtime/src/flight.rs:280-325
      - crates/arkavo-swarmkit-runtime/src/flight.rs:235-260
    changed: "2026-05-02"

  - id: SK-080
    name: SwarmKit auto-launch failures are captured and surfaced through ArpStatusSnapshot
    criticality: medium
    given:
      - The gateway is configured with ARKAVO_SWARMKIT_PATH pointing at a missing or malformed manifest
    when: gateway boot calls auto_launch_from_environment
    then:
      - The error is recorded into SwarmFlightRegistry::record_failure with the matching kind discriminator
      - On the next requestArpStatus, ArpStatusSnapshot.swarmkit_launch_errors carries one entry with path, kind, message, and occurred_at
      - A subsequent successful auto_launch_from_environment clears the recorded failure
    refs:
      - crates/arkavo-agui/src/swarm_flight_registry.rs:75-180
      - crates/arkavo-agui/src/gateway_ws.rs:347-355
      - crates/arkavo-agui/static/js/panels/arp.js:80-95
    changed: "2026-05-02"

  - id: SK-040
    name: requestStopFlight deregisters the flight and pushes a fresh snapshot
    criticality: high
    given:
      - WebSocket session connected
      - One or more SwarmFlights registered
    when: client sends requestStopFlight with a valid flight_id
    then:
      - SwarmFlightRegistry::deregister called with the parsed UUID
      - Every role of that flight removed from ArpHandler
      - FlightStopped emitted with error=None
      - ArpStatusUpdate emitted immediately so the panel re-renders without the stopped flight
    refs:
      - crates/arkavo-agui/src/gateway_ws.rs:351-385
      - crates/arkavo-agui/src/swarm_flight_registry.rs:60-65
    changed: "2026-05-01"
    edge_cases:
      - condition: flight_id is not a valid UUID
        expected: FlightStopped with error=Some(...) explaining the parse failure; no deregister call
      - condition: flight_id is a valid UUID but no flight is registered with it
        expected: FlightStopped with error=None (deregister is idempotent)

