  # --- Skill resolver (slice 6) -------------------------------------------
  #
  # Note: originally allocated SK-070..072 in Phase 2; renumbered to
  # SK-090..092 in commit resolving reviewer M1. SK-070..072 were already
  # claimed by orchestrator-apply scenarios (lines 574..608) via the
  # umbrella branch, and SK-080 was claimed by the auto-launch-failures
  # scenario (line 643). SK-090..092 sits cleanly outside both ranges.

  - id: SK-090
    name: Inline skill round-trips through sign → resolve → verify
    criticality: critical
    given:
      - SkillContent serialized as JSON in Skill.payload
      - Skill.signature is base64url(ed25519 over canonical bytes) using a known signing key
      - Skill.signed_by is the DID whose pubkey the resolver returns
    when: resolve_skill called with VerifyMode::Required
    then:
      - ResolvedSkill returned with content equal to the input
      - verified is true
    refs:
      - crates/arkavo-swarmkit-runtime/src/skill_resolver/mod.rs (t1_inline_skill_round_trip)
    changed: "2026-05-08"

  - id: SK-091
    name: Tampered payload fails verification with SignatureInvalid
    criticality: critical
    given:
      - A signed SkillContent
      - A modified copy of the content with the same signature
    when: resolve_skill called with VerifyMode::Required
    then:
      - ResolveError::SignatureInvalid returned
      - signer_did field carries the claimed signer
    refs:
      - crates/arkavo-swarmkit-runtime/src/skill_resolver/mod.rs (t2_tampered_payload_fails_verify)
    changed: "2026-05-08"

  - id: SK-092
    name: Registry cache hit resolves; miss returns RegistryMiss
    criticality: high
    given:
      - A registry-cache directory with a <blake3>.skill.json fixture
      - Skill.source = registry, signature + signed_by declared in manifest
    when: resolve_skill called
    then:
      - On hit, ResolvedSkill returned with verified=true
      - On miss (id not in cache), ResolveError::RegistryMiss returned with cache_path
    refs:
      - crates/arkavo-swarmkit-runtime/src/skill_resolver/mod.rs:209-235
    changed: "2026-06-12"

  # --- Plane governance and flight proposal apply ---------------------------

  - id: SK-093
    name: Audit-plane roles cannot ride the coordination plane
    criticality: critical
    given:
      - A kit manifest with a role declaring plane learning or audit
    when: manifest validation runs
    then:
      - A learning/audit role with handoffs fails validation
      - A learning/audit role with context_scope.can_write fails validation
      - Coordination roles are unaffected
    refs: [crates/arkavo-swarmkit/src/validate.rs, crates/arkavo-swarmkit/src/governance.rs]
    changed: "2026-06-10"

  - id: SK-094
    name: Flight-wide proposal apply is all-or-reverted
    criticality: critical
    given:
      - A flight whose roles each hold a ProposalQueue
      - A flight-radius tightening proposal
    when: apply_flight_proposal runs
    then:
      - Phase one prechecks every role side-effect-free before any apply
      - A precheck failure rejects the whole flight with no role touched
      - A phase-two failure force-reverts the roles already applied
      - Success applies to every role with reviewer recorded
    refs: [crates/arkavo-swarmkit-runtime/src/flight_apply.rs]
    changed: "2026-06-10"

  - id: SK-095
    name: Reconciliation converges a crash-partial flight apply
    criticality: high
    given:
      - Some flight roles hold an applied proposal and others never saw it
    when: reconcile_flight_proposal runs
    then:
      - Roles holding the proposal in a revertible state are force-reverted
      - The reverted role ids are returned for the audit trail
      - A converged flight reconciles to a no-op
    refs: [crates/arkavo-swarmkit-runtime/src/flight_apply.rs, crates/arkavo-swarmkit-runtime/tests/flight_proposal_apply.rs]
    changed: "2026-06-10"

