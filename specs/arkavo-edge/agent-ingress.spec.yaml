# yaml-language-server: $schema=../schema.json

feature: Agent Ingress, Discovery and Enrollment
module: arkavo-server, arkavo-cli, arkavo-registration, arkavo-gossip
version: 0.101.1

# Design: docs/swarm-trust-model.md, "Agent ingress, discovery and enrollment".
# Scenarios marked wip are not implemented; their refs name the code at
# 9f5faf03 that they change. INGRESS-001, INGRESS-004 and INGRESS-017 are implemented. The workload key is the P-256 key #766 adds, one per agent name.

invariants:
  - "The transport and discovery are untrusted: no bind address, announcement or connection grants anything"
  - "Apart from public requests (agent_card, health), every agent-to-agent and phone-to-agent message is a signed, sealed envelope, verified before its body is unwrapped"
  - "A non-member may send only public requests, and a pairing envelope while a pairing window is open"
  - "One workload key per agent: every channel names the same persistent did:key, and every other key is accepted only through a statement it signs"
  - "Trust has three roots before any authority exists: the workload key, the OS user that started the agent, and the terminal screen"
  - "Only the enrolled owner key issues membership, and that key is outside the worker's reach"
  - "Membership makes an agent Unassessed; promotion and demotion follow the states under State overrides score"

scenarios:
  - id: INGRESS-001
    name: Web page requests refused at the agent listener
    criticality: critical
    given:
      - An agent listening on any address, loopback included
    when: A request arrives carrying an Origin header, a WebSocket upgrade or a POST from a page in a browser
    then:
      - The request is refused with 403 before any JSON-RPC method is dispatched; an agent serves no web pages, so every Origin is another site's
      - A request without Origin (agents, the arkavo ui gateway, the CLI) is unaffected
    edge_cases:
      - condition: "Upgrade with Origin https://evil.example to a loopback agent (accepted with 101 on 2026-10-02)"
        expected: "403"
      - condition: Page on a DNS name pointed at the agent (rebinding)
        expected: Its upgrades and POSTs carry Origin and are refused; the listener checks no Host, so a plain GET of agent_card or health still answers
      - condition: Upgrade with no Origin header
        expected: Admitted as a non-browser caller (what it may call is INGRESS-002)
    refs:
      - crates/arkavo-server/src/server/browser_origin.rs
      - crates/arkavo-server/src/server/a2a_server.rs:995-1003
      - docs/swarm-trust-model.md
    changed: "2026-10-04"

  - id: INGRESS-002
    name: Non-member reaches public requests and pairing only
    criticality: critical
    wip: true
    given:
      - Envelopes are in place
      - A caller that is not a verified, enrolled member
    when: It sends anything over the network
    then:
      - Plain agent_card (public fields) and health requests are answered
      - A pairing envelope is accepted only while a pairing window is open
      - A member envelope from it is refused before its body is unwrapped
    edge_cases:
      - condition: "message/send, agent.config.update or kas.rewrap from a non-member"
        expected: Refused with no side effect
      - condition: Before envelopes exist (the stopgap)
        expected: "Whether remote callers are limited to public requests is an open decision: doing so also stops cross-host gossip/message"
    refs:
      - crates/arkavo-server/src/server/mod.rs:240-320
    changed: "2026-10-02"

  - id: INGRESS-003
    name: Operator socket admits only the owning OS user
    criticality: high
    wip: true
    given:
      - An agent started by an OS user
    when: The operator connects to control the agent
    then:
      - The channel is a Unix domain socket created 0600 in the user's runtime directory, or a named pipe whose ACL admits only that user on Windows
      - Loopback TCP is never an operator channel
      - The operator gains control of the agent and no data authority
    edge_cases:
      - condition: Another local account opens the socket
        expected: Refused by the kernel
    refs:
      - docs/swarm-trust-model.md
    changed: "2026-10-02"

  - id: INGRESS-004
    name: Gossip keys bound only with proof and replaced only after the peer leaves
    criticality: critical
    given:
      - agent/exchangeKeys, the interim path until membership statements exist
    when: A caller binds a gossip key to a peer id
    then:
      - The caller signs its id, its key, the recipient's id and a fresh challenge; the recipient signs its id, its key and that challenge back, and each side binds the other's key only on a valid signature
      - A key bound to the id is not replaced while the peer is present; binding the same key again is a no-op
      - A peer's key is forgotten when mDNS reports the peer gone, and an agent sends that goodbye when it shuts down
      - Only votes from this agent or a peer discovery found count toward a patch or lesson quorum, on the vote and the delivery paths
    edge_cases:
      - condition: "The old request {peer_id, public_key} without proof"
        expected: "Refused, so agents from before 0.101.1 and after it stop exchanging keys on the same network"
      - condition: Replayed request
        expected: Re-asserts a key the replayer does not hold; harmless since bound keys are not replaced, so no nonce is stored
      - condition: Peer restarted cleanly with a new gossip key
        expected: Its goodbye unbinds the old key and the new one is accepted
      - condition: Peer crashed and came back on a new port, with no goodbye
        expected: Discovery reports it again at its new address, so gossip follows it there. Its kept gossip key binds again (INGRESS-017). A peer from before kept gossip keys makes a new key on every start and is refused with a warning until the receiver restarts
      - condition: A host on the link spoofing mDNS announcements
        expected: Can still add a peer id and vote under it; membership (INGRESS-015) closes this
      - condition: A host on the link sends a spoofed mDNS goodbye for a peer, or races a real restart
        expected: "The receiver forgets the peer's key. If a workload key vouched for the peer, its id takes no other key but one that workload vouches for (INGRESS-017); an unvouched peer's id can be taken by a host binding its own key with a valid proof"
    refs:
      - crates/arkavo-gossip/src/key_exchange.rs
      - crates/arkavo-gossip/src/verification.rs
      - crates/arkavo-gossip/src/protocol.rs:163-179
      - crates/arkavo-server/src/server/mod.rs
      - crates/arkavo-cli/src/commands/agent/gossip_keys.rs
      - crates/arkavo-cli/src/commands/agent/discovered.rs
      - crates/arkavo-cli/src/commands/agent/advertise.rs
    changed: "2026-10-18"

  - id: INGRESS-005
    name: One persistent workload identity across channels and restarts
    criticality: critical
    wip: true
    given:
      - An agent with a stored workload key
    when: The agent restarts
    then:
      - Gossip, the agent card, trust scores, delegation and quarantine name the same did:key before and after
      - No key generated per start is an identity
      - Trust-score subject is the workload did:key, not the agent name
    refs:
      - crates/arkavo-cli/src/commands/agent.rs:479
      - crates/arkavo-cli/src/commands/agent.rs:509
      - crates/arkavo-server/src/server/a2a_server.rs:1198
      - crates/arkavo-config-encryption/src/lib.rs:175
      - crates/arkavo-server/src/server/trust_sync.rs:63
      - crates/arkavo-server/src/server/trust_init.rs:57
    changed: "2026-10-02"

  - id: INGRESS-006
    name: Subordinate key accepted only through a current key statement
    criticality: critical
    wip: true
    given:
      - A gossip, iroh or TDF key the agent uses
    when: A peer is asked to use that key
    then:
      - "The peer requires a statement signed by the workload key naming purpose, key, validity window and generation: a compact JWS, ES256, typ key-statement+jwt, whose kid is the workload did:key"
      - The key is named by its canonical did:key and is of the purpose's kind (Ed25519 for gossip and iroh, P-256 for TDF)
      - A statement with a lower generation than one already seen is refused, and so is a second key for a generation already seen
      - The workload key itself is never used as a TLS or TDF key, nor named as its own subordinate
    edge_cases:
      - condition: Statement signed after the workload's quarantine generation
        expected: Refused; quarantine covers every key the workload signs
      - condition: Statement past its validity window
        expected: Refused
      - condition: Another token the workload key signs, such as its agent card signature
        expected: Not read as a statement; its typ differs
      - condition: A statement signed by one workload key in another's name
        expected: Refused
    refs:
      - crates/arkavo-key-statement/src/lib.rs
      - docs/swarm-trust-model.md
    changed: "2026-10-18"

  - id: INGRESS-007
    name: Minimal announcement with no DID before enrollment
    criticality: high
    wip: true
    given:
      - An agent announcing _a2a._tcp over mDNS
    when: Its TXT record is built
    then:
      - It carries version, and after enrollment the workload did:key and its TDF key statement digest
      - It carries no model, purpose, capabilities or mcp_tools
      - Before enrollment it carries no DID
    refs:
      - crates/arkavo-cli/src/commands/agent/advertise.rs:45-76
    changed: "2026-10-02"

  - id: INGRESS-008
    name: Forged announcement or substituted key costs availability only
    criticality: high
    wip: true
    given:
      - A sender that expects a recipient's did:key
    when: A spoofed record, swapped address or substituted TDF key is presented
    then:
      - The substituted key fails statement verification and nothing is sealed to it
      - A message sent to a wrong address cannot be opened there
    refs:
      - docs/swarm-trust-model.md
    changed: "2026-10-02"

  - id: INGRESS-009
    name: Envelope verified before its body is unwrapped
    criticality: critical
    wip: true
    given:
      - A member or pairing envelope arriving over plain ws or a relay
    when: The receiver processes it
    then:
      - Size is bounded before parsing
      - The document is TDF-JSON 1.0.0 with an inline payload and exactly one a2a-envelope assertion
      - The assertion's JWS (ES256, typ a2a-envelope) verifies against the iss did:key and its digest matches the canonical document as received, ciphertext included
      - aud names this agent or its swarm, exp has not passed, iat is within the clock bound and the nonce is unseen
      - Sender standing (membership, state, deny latch) is established before the body is unwrapped; a member envelope from a non-member is refused there
      - The admitted call carries a TaskSecurityContext built from the verified sender
    edge_cases:
      - condition: Bad signature
        expected: Refused before unwrap
      - condition: Any byte of the document changed after signing, including the ciphertext or a key access object
        expected: The digest does not match; refused before unwrap
      - condition: No envelope assertion, two of them, or a JWS whose typ or alg differs
        expected: Refused before unwrap
      - condition: Any refusal
        expected: One unsealed JSON-RPC error with id null that does not say which check failed; the reason is logged locally
      - condition: Wrong audience
        expected: Refused before unwrap
      - condition: Expired or iat outside the clock bound
        expected: Refused before unwrap
      - condition: Nonce replayed within the window
        expected: Refused before unwrap
      - condition: Oversized envelope
        expected: Refused before parsing
      - condition: Pairing envelope while no pairing window is open
        expected: Refused before unwrap
      - condition: Pairing envelope whose body holds anything but the pairing exchange
        expected: Refused after unwrap, with no side effect
    refs:
      - crates/arkavo-server/src/server/handlers/messaging.rs
      - docs/swarm-trust-model.md
      - docs/a2a/tdf-json-binding.md
    changed: "2026-10-26"

  - id: INGRESS-010
    name: Re-signed ciphertext refused
    criticality: critical
    wip: true
    given:
      - An envelope whose sealed body repeats iss and nonce
    when: A third party re-signs the ciphertext under its own key
    then:
      - The inner iss or nonce differs from the signed outer values and the message is refused
    refs:
      - docs/swarm-trust-model.md
    changed: "2026-10-02"

  - id: INGRESS-011
    name: Reply sealed to the requester
    criticality: high
    wip: true
    given:
      - An admitted request whose stmt names the requester's TDF key statement
    when: The agent replies
    then:
      - The reply is an envelope signed by the responder, addressed to the requester and sealed to that key
      - The reply names the request's nonce in re; a reply whose re matches no outstanding request is dropped
      - Each stream event is its own envelope with re and a seq rising from 0
      - No method result crosses the wire in plaintext
    edge_cases:
      - condition: A stream event arrives with a gap or a repeat in seq
        expected: The stream fails with an error; it never ends as if complete
    refs:
      - docs/swarm-trust-model.md
      - docs/a2a/tdf-json-binding.md
    changed: "2026-10-26"

  - id: INGRESS-012
    name: Pairing enrolls the owner with a single-use secret
    criticality: critical
    wip: true
    given:
      - An agent run with --trust showing a QR code with its did:key, TDF key statement digest and a 128-bit secret
      - Showing the code opened a pairing window of fixed length (five minutes by default)
    when: A phone sends a pairing envelope signed by its enrollment key
    then:
      - The phone verifies the key statement against the digest and DID before sending
      - The secret proof travels only in the sealed body
      - The agent records the phone's enrollment key as the owner key, persists it with the workload and consumes the secret
      - The window closes at first use
    edge_cases:
      - condition: The same secret presented again
        expected: Refused
      - condition: The secret presented after its window closes, though --trust is still running
        expected: Refused
      - condition: The code shown again
        expected: A new secret and a new window; the old secret is void
      - condition: Terminal text, scrollback and logs
        expected: The secret never appears as text
      - condition: Traffic captured on the link
        expected: Reveals neither the secret nor the enrollment key
      - condition: Link emitted before arkavo-ios accepts the new parameters
        expected: Not emitted; the app refuses unknown parameters
    refs:
      - crates/arkavo-registration/src/lib.rs
      - crates/arkavo-registration/src/qr.rs
    changed: "2026-10-02"

  - id: INGRESS-013
    name: Delegation by another account gives no control
    criticality: high
    wip: true
    given:
      - An enrolled agent whose did:key another account authorized first at authnz-rs
    when: The agent obtains a token for that delegation
    then:
      - The delegation has no effect on the agent unless it ties to the enrolled owner
      - The documented recovery from a blocked owner delegation is a new workload key
    refs:
      - docs/swarm-trust-model.md
    changed: "2026-10-02"

  - id: INGRESS-014
    name: Membership signed by the owner key; new member Unassessed
    criticality: critical
    wip: true
    given:
      - An owner key from enrollment, held outside the worker's storage
    when: A workload joins a swarm
    then:
      - Its membership statement names workload did:key, swarm, validity window and generation, signed by the owner key
      - Members holding statements from the same owner key accept it as a member
      - It starts Unassessed; its gossip observations carry no weight until appraised
    edge_cases:
      - condition: A worker process tries to read the owner key
        expected: Not reachable from the worker's OS user or storage
      - condition: Membership statement from an unknown owner key
        expected: Sender treated as a non-member (INGRESS-002)
    refs:
      - docs/swarm-trust-model.md
    changed: "2026-10-02"

  - id: INGRESS-015
    name: Gossip keys come from membership and observers count once
    criticality: critical
    wip: true
    given:
      - Gossip between members
    when: A gossip message, vote or observation arrives
    then:
      - The sender's key comes from its membership statement, never from a registration call
      - Each member workload's observation counts once
      - Quorum and peer counts are computed over members
      - A Guardian incident is applied only after the reporter's authority and subject binding are checked
    refs:
      - crates/arkavo-gossip/src/protocol.rs:377-380
      - crates/arkavo-gossip/src/verification.rs:37-56
      - crates/arkavo-server/src/server/mod.rs:859-928
    changed: "2026-10-02"

  - id: INGRESS-016
    name: Agent KAS releases on a verified caller and current state
    criticality: critical
    wip: true
    given:
      - A rewrap request arriving as an envelope
    when: The agent KAS decides
    then:
      - The caller is the verified envelope sender, not a placeholder
      - Membership, state and the local deny latch are checked before policy
      - An Unassessed member gets keys under public policy only; a Suspended or Quarantined one gets nothing
      - A state change applies from the next request; a released key is reused only within the status lease
    refs:
      - crates/arkavo-server/src/server/mod.rs:1089-1115
    changed: "2026-10-02"

  - id: INGRESS-017
    name: Gossip keys kept across restarts and bound through the agent's key statement
    criticality: critical
    given:
      - An agent with a workload key and a gossip key kept in its directory
    when: It exchanges gossip keys with a peer (INGRESS-004)
    then:
      - Each side shows, beside its proof, the key statement in which its workload key vouches for its gossip key (INGRESS-006), and the other side binds the key through it and records which did:key the peer is
      - The gossip key and its generation are kept across restarts, so a peer that bound it binds the same key again
      - An id a workload key has vouched for takes no unvouched key and no other workload's statement while the receiver runs, even after the peer's goodbye; the refusal names the agent and says a new agent needs a new name
      - A newer generation from the same workload replaces the bound key; an older one, or a second key for one generation, is refused
      - The agent renews its statement before it runs out, so it never shows an expired one however long it runs
    edge_cases:
      - condition: A peer from before key statements, which sends none
        expected: Bound unvouched, as by INGRESS-004; it ignores the statement this agent shows
      - condition: A statement present but not holding (another key, another purpose, expired, malformed)
        expected: Refused, never bound as unvouched, so damaging a statement does not downgrade the peer
      - condition: An on-path host strips the statement from a first exchange
        expected: The peer is bound unvouched; once a peer has bound a vouched key under a name it refuses an unvouched one there
      - condition: The receiver restarts
        expected: Which workload owns each id and the generations seen are kept in memory only, so they start over
    refs:
      - crates/arkavo-gossip/src/key_exchange.rs
      - crates/arkavo-gossip/src/verification.rs
      - crates/arkavo-server/src/server/learning_bus_keys.rs
      - crates/arkavo-cli/src/commands/agent/gossip_keys.rs
      - crates/arkavo-device-identity/src/subordinate_key.rs
    changed: "2026-10-18"

  - id: INGRESS-018
    name: The agent card offers peers only the TDF-JSON binding
    criticality: critical
    wip: true
    issue: "The agent card is the pre-1.0 shape: extensions sit at the top level with a data field and there is no supportedInterfaces, and the listener answers plaintext JSON-RPC."
    given:
      - An enrolled agent serving its signed card at /.well-known/agent-card.json
    when: A peer reads the card to choose an interface
    then:
      - supportedInterfaces lists the binding https://arkavo.com/a2a/bindings/tdf-json/v1 with protocolVersion 1.0, and no unsealed A2A interface
      - capabilities.extensions carries the key statements (https://arkavo.com/a2a/key-statements/v1) in params, and the TDF-JSON Part extension when the agent opens Parts
      - The card declares no securitySchemes for the binding, and the agent sends peers no CWT; the envelope signature is the credential
      - The card stays signed by the workload key (A2A signatures, RFC 8785 form)
    edge_cases:
      - condition: Before enrollment
        expected: The card leaves out the key statements, so it names no DID
      - condition: A TDF-CBOR binding is supported
        expected: It is listed ahead of TDF-JSON, which stays listed
    refs:
      - crates/arkavo-protocol/src/types.rs
      - crates/arkavo-server/src/server/well_known.rs
      - docs/a2a/tdf-json-binding.md
    changed: "2026-10-26"
