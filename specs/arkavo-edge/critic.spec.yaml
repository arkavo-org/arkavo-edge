# yaml-language-server: $schema=../schema.json

feature: LLM Response Critic and Verification
module: arkavo_critic
version: 0.57.2

invariants:
  - Verification pipeline with priority-ordered checks
  - Fast checks first (Circuit <1μs, Schema <1ms)
  - Pluggable check architecture
  - Evidence collection for audits
  - Response analysis detects common model failure patterns
  - Feedback episodes stored for persistent learning

scenarios:
  - id: CRIT-001
    name: Create default verification pipeline
    criticality: critical
    given:
      - Default configuration
    when: default_pipeline called
    then:
      - CircuitCheck added (priority 5)
      - SchemaCheck added (priority 10)
      - PolicyCheck added (priority 15)
      - Pipeline ready
    refs: [crates/arkavo-critic/src/lib.rs:54-65]
    changed: "2025-01-31"

  - id: CRIT-002
    name: Add custom check to pipeline
    criticality: high
    given:
      - Pipeline exists
      - Check implementation provided
    when: add_check called
    then:
      - Check added
      - Priority respected
      - Pipeline updated
    refs: [crates/arkavo-critic/src/pipeline.rs:1-60]
    changed: "2025-01-31"

  - id: CRIT-003
    name: Run circuit check
    criticality: critical
    given:
      - TØR-G circuit loaded
      - Input provided
    when: CircuitCheck::verify called
    then:
      - Circuit evaluated (<1μs)
      - Pass/fail determined
      - Result returned
    refs: [crates/arkavo-critic/src/checks.rs:1-50]
    changed: "2025-01-31"
    edge_cases:
      - condition: Circuit violation
        expected: Fail with details

  - id: CRIT-004
    name: Run schema validation check
    criticality: high
    given:
      - Tool call candidate
      - Schema defined
    when: SchemaCheck::verify called
    then:
      - Parameters validated
      - Types checked
      - Result returned (<1ms)
    refs: [crates/arkavo-critic/src/checks.rs:50-100]
    changed: "2025-01-31"
    edge_cases:
      - condition: Missing required field
        expected: Validation error
      - condition: Type mismatch
        expected: Type error

  - id: CRIT-005
    name: Run semantic coherence check
    criticality: medium
    given:
      - Local LLM available
      - Response to verify
    when: SemanticCheck::verify called
    then:
      - Coherence analyzed (<50ms)
      - Score computed
      - Result returned
    refs: [crates/arkavo-critic/src/checks.rs:100-150]
    changed: "2025-01-31"

  - id: CRIT-006
    name: Collect verification evidence
    criticality: high
    given:
      - Checks executed
    when: evidence collected
    then:
      - All check results stored
      - Severity assessed
      - Status determined
    refs: [crates/arkavo-critic/src/evidence.rs:1-60]
    changed: "2025-01-31"

  - id: CRIT-007
    name: Judge response quality
    criticality: medium
    given:
      - Evidence collected
    when: ResponseJudge::judge called
    then:
      - Issues identified
      - Judgment rendered
      - Improvement suggestions
    refs: [crates/arkavo-critic/src/judge.rs:1-60]
    changed: "2025-01-31"

  - id: CRIT-008
    name: Configure critic behavior
    criticality: medium
    given:
      - Config options provided
    when: CriticConfig::apply called
    then:
      - Thresholds set
      - Enabled checks configured
      - Timeouts defined
    refs: [crates/arkavo-critic/src/config.rs:1-50]
    changed: "2025-01-31"

  - id: CRIT-009
    name: Analyze response for code fence issues
    criticality: high
    given:
      - ResponseAnalyzer initialized with model name
      - Simple query prompt provided (e.g., "what is 2+2")
      - Response contains code fences
    when: ResponseAnalyzer::analyze called
    then:
      - Issue detected as UnwantedCodeFence
      - Feedback created with model_family and issue type
      - Prompt keywords extracted for pattern matching
    refs: [crates/arkavo-critic/src/response_analyzer.rs:60-100]
    changed: "2025-02-05"
    edge_cases:
      - condition: Complex coding query with code fences
        expected: No issue detected (appropriate use)
      - condition: Greeting with code fences
        expected: UnwantedCodeFence detected

  - id: CRIT-010
    name: Detect output loops in model responses
    criticality: high
    given:
      - ResponseAnalyzer initialized
      - Response with repetitive content provided
    when: ResponseAnalyzer::analyze called
    then:
      - Repetition pattern detected
      - OutputLoop issue identified
      - Feedback created with loop metadata
    refs: [crates/arkavo-critic/src/response_analyzer.rs:100-130]
    changed: "2025-02-05"
    edge_cases:
      - condition: Repeated consecutive lines (3+ times)
        expected: Loop detected
      - condition: Q&A pattern repetition (3+ questions)
        expected: Loop detected
      - condition: Normal varied response
        expected: No loop detected

  - id: CRIT-011
    name: Record feedback as learning episode
    criticality: high
    given:
      - Model name and prompt available
      - Response analyzed with detected issue
      - LearningStore initialized
    when: record_model_feedback called
    then:
      - Episode created with observation and outcome
      - Category formatted as "model:{family}:{issue}"
      - Episode stored in LearningStore
      - Issue type returned for caller handling
    refs: [crates/arkavo-critic/src/response_analyzer.rs:346-406]
    changed: "2025-02-05"

  - id: CRIT-012
    name: Check for pattern-based prompt adjustment
    criticality: medium
    given:
      - Model name provided
      - Prompt text available
      - LearningStore has loop episodes for model
    when: check_for_pattern_adjustment called
    then:
      - Math query pattern detected ("what is" + operators)
      - Loop episode count checked for model family
      - PatternAdjustment returned if threshold met
      - Suggested max_tokens reduced for loopy models
    refs: [crates/arkavo-critic/src/response_analyzer.rs:488-536]
    changed: "2025-02-05"
    edge_cases:
      - condition: No loop history for model
        expected: No adjustment suggested
      - condition: Non-math query
        expected: No adjustment suggested

  - id: CRIT-013
    name: Detect wrong expert routing for GLM models
    criticality: medium
    given:
      - GLM model family detected
      - Chat query prompt (greeting, casual)
      - Response contains code indicators (def, import, etc.)
    when: ResponseAnalyzer::analyze called
    then:
      - WrongExpert issue detected
      - Expected "conversation" expert noted
      - Feedback created for routing improvement
    refs: [crates/arkavo-critic/src/response_analyzer.rs:120-130]
    changed: "2025-02-05"

  - id: CRIT-014
    name: Extract first answer from loopy response
    criticality: medium
    given:
      - Loopy response with repetition
      - is_math_query flag set
    when: extract_first_answer called
    then:
      - For math: First line with number extracted
      - For non-math: Content before repetition returned
      - Clean answer without loop artifacts
    refs: [crates/arkavo-critic/src/response_analyzer.rs:265-315]
    changed: "2025-02-05"

  - id: CRIT-015
    name: Record timeout feedback
    criticality: high
    given:
      - Model name provided
      - Prompt that caused timeout
    when: record_timeout_feedback called
    then:
      - Timeout episode created
      - Category set as "model:{family}:timeout"
      - Episode stored in LearningStore
    refs: [crates/arkavo-critic/src/response_analyzer.rs:408-446]
    changed: "2025-02-05"

  - id: CRIT-016
    name: Get model issue counts by category
    criticality: medium
    given:
      - Model family specified
      - LearningStore has episodes
    when: get_model_issue_counts called
    then:
      - Returns counts for each issue category
      - Categories: loop, code_fence, timeout, wrong_expert, hallucinated_tool
      - Empty categories omitted from results
    refs: [crates/arkavo-critic/src/response_analyzer.rs:449-476]
    changed: "2025-02-05"

  - id: CRIT-017
    name: Detect model family from name
    criticality: low
    given:
      - Model name string provided
    when: detect_model_family called
    then:
      - '"glm" returned for GLM models'
      - '"gemma" returned for Gemma models'
      - '"qwen" returned for Qwen models'
      - '"mistral" returned for Mistral/Ministral models'
      - '"deepseek" returned for DeepSeek models'
      - '"unknown" returned for unrecognized models'
    refs: [crates/arkavo-critic/src/response_analyzer.rs:328-344]
    changed: "2025-02-05"
