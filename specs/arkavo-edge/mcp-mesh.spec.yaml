feature: MCP Tools for Agent Mesh Orchestration
module: arkavo_mcp_mesh
version: 0.58.0

invariants:
  - Agent discovery via mDNS
  - Task delegation to specialist agents
  - A2A protocol for mesh communication
  - Tool-based mesh operations
  - "A member's capabilities come from its own report over the member channel, not from its announcement"

scenarios:
  - id: MESH-001
    name: Create mesh tools state
    criticality: high
    given:
      - AgentRegistry available
    when: MeshToolsState::new called
    then:
      - Registry initialized
      - Address cache created
      - State ready
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:47-68]
    changed: "2025-01-31"

  - id: MESH-002
    name: Register mesh tools
    criticality: high
    given:
      - ToolRegistry available
      - MeshToolsState initialized
    when: register_tools called
    then:
      - ListAgentsTool registered
      - AgentQueryTool registered
      - SendTaskTool registered
      - GetTaskStatusTool registered
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:15-25]
    changed: "2025-01-31"

  - id: MESH-003
    name: List discovered agents
    criticality: high
    given:
      - Agents discovered via mDNS
      - MeshToolsState has registry
    when: ListAgentsTool executed
    then:
      - Registry queried
      - Agent list returned
      - Capabilities included
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:70-120]
    changed: "2025-01-31"

  - id: MESH-004
    name: Query agents by capability
    criticality: high
    given:
      - Registry populated
      - Capability filter provided
    when: AgentQueryTool executed
    then:
      - Registry filtered
      - Matching agents returned
      - Sorted by relevance
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:120-180]
    changed: "2025-01-31"

  - id: MESH-005
    name: Delegate task to agent
    criticality: critical
    given:
      - Target agent known
      - Task details provided
      - A2A transport ready
    when: SendTaskTool executed
    then:
      - Task serialized
      - A2A message sent
      - Task ID returned
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:432-658]
    changed: "2026-09-30"
    edge_cases:
      - condition: agent_id is within edit distance 2 of a known agent but matches none exactly
        expected: The task is delivered to, addressed as, recorded under and reported as the matched agent's ID
      - condition: Agent unreachable
        expected: Transport error
      - condition: Task rejected
        expected: Rejection with reason

  - id: MESH-006
    name: Get delegated task status
    criticality: high
    given:
      - Task ID known
      - Agent available
    when: GetTaskStatusTool executed
    then:
      - Status query sent
      - Current status returned
      - Result if complete
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:250-320]
    changed: "2025-01-31"
    edge_cases:
      - condition: Task not found
        expected: Not found error
      - condition: Agent timeout
        expected: Timeout status

  - id: MESH-007
    name: Cache discovered agent addresses
    criticality: medium
    given:
      - mDNS discovery complete
    when: Address cached
    then:
      - Map updated
      - RwLock for thread safety
      - Expiration policy applied
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:48-62]
    changed: "2025-01-31"

  - id: MESH-008
    name: Handle mesh tool errors
    criticality: high
    given:
      - Mesh operation fails
    when: Error propagates
    then:
      - MeshToolError created
      - Transport errors wrapped
      - Context preserved
    refs: [crates/arkavo-mcp-mesh/src/lib.rs:44-46]
    changed: "2025-01-31"

  - id: MESH-009
    name: Delegated task answers keep data parts
    criticality: high
    given:
      - A member's completed task whose result has text and data parts
    when: send_and_wait or get_task_status reads the result
    then:
      - "The answer keeps the text and every data part with its schema"
      - "A urn:arkavo:asset:manifest:v1 part comes back as references; the mesh layer fetches nothing"
    refs:
      - crates/arkavo-mcp-mesh/src/request.rs:34-44
      - crates/arkavo-mcp-mesh/src/peer.rs:152-173
      - crates/arkavo-mcp-mesh/src/lib.rs:719-730
    changed: "2026-10-11"

  - id: MESH-010
    name: Choosing a member for work reads members' reports, not announcements
    criticality: high
    given:
      - Members found by discovery
    when: An agent chooses a member for work by capability (ASSET-002)
    then:
      - "Each member's capabilities come from its agent.capabilities.get answer, reused for 60 seconds while the member stays at the same address"
      - "A member that does not answer within 5 seconds is left out of that choice"
      - "The mDNS TXT capabilities and mcp_tools keys are not read"
      - "image_generation matches only a member whose report carries the image_generation descriptor (ASSET-001)"
    edge_cases:
      - condition: agent_query, which still matches on announced capabilities
        expected: Unchanged here; INGRESS-007 removes what it reads
    refs:
      - crates/arkavo-mcp-mesh/src/members.rs
      - crates/arkavo-server/src/server/handlers/discovery.rs:240
    changed: "2026-10-11"
