# yaml-language-server: $schema=../schema.json

feature: A2A Server and Runtime Orchestration
module: arkavo_server
version: 0.68.0

invariants:
  - Server binds to configured address
  - JSON-RPC 2.0 compliance for all A2A methods
  - Tool memory persists observations across sessions
  - Learning pipeline processes episodes asynchronously
  - Gossip transport maintains peer connections
  - Anti-entropy runs on configured interval
  - Agent goals have defined lifecycle
  - Well-known state endpoint is discoverable

scenarios:
  - id: SRV-001
    name: Server startup and binding
    criticality: critical
    given:
      - A2aServer configured
      - Address and port specified
    when: Server starts
    then:
      - Binds to address
      - Transports initialized
      - Startup loops launched
      - Ready to accept connections
    refs:
      - crates/arkavo-server/src/server/a2a_server.rs:990-1030
      - crates/arkavo-server/src/server/a2a_server.rs:1319-1399
    changed: "2026-03-19"
    edge_cases:
      - condition: Port already in use
        expected: Bind error with details
      - condition: TLS cert missing for non-localhost
        expected: Startup fails with TLS error

  - id: SRV-002
    name: JSON-RPC request handling
    criticality: critical
    given:
      - Server running
      - Client connected
    when: JSON-RPC request received
    then:
      - Method dispatched to handler
      - Response returned with matching id
      - Errors follow JSON-RPC 2.0 format
    refs:
      - crates/arkavo-server/src/server/mod.rs:107-350
      - crates/arkavo-server/src/server/mod.rs:414-1000
    changed: "2026-03-19"

  - id: SRV-003
    name: Tool memory observation storage
    criticality: high
    given:
      - ToolMemory initialized
      - Tool executed with result
    when: ToolObservation recorded
    then:
      - ToolMemoryEntry created
      - Observation persisted
      - Pattern cache updated
    refs: [crates/arkavo-server/src/server/tool_memory.rs:1-118]
    changed: "2026-03-19"

  - id: SRV-004
    name: Learning pipeline episode processing
    criticality: high
    given:
      - LearningBus active
      - LearningConfig set
    when: LearningEvent emitted
    then:
      - Episode buffered
      - AutoLearnBridge processes episodes
      - Behavior advice generated
    refs:
      - crates/arkavo-server/src/server/episode_buffer.rs:1-174
      - crates/arkavo-server/src/server/event_loop.rs:215-563
      - crates/arkavo-server/src/server/learning_bus_synthesis.rs:1-49
      - crates/arkavo-server/src/server/autolearn_bridge.rs:1-98
    changed: "2026-03-19"

  - id: SRV-005
    name: Gossip transport peer management
    criticality: high
    given:
      - start_gossip_transport() called
    when: Peers discovered
    then:
      - Connections established
      - Messages propagated
      - Peer state tracked
    refs:
      - crates/arkavo-server/src/server/gossip_transport.rs:12-47
      - crates/arkavo-server/src/server/learning_bus.rs:386-527
    changed: "2026-03-19"

  - id: SRV-006
    name: Anti-entropy reconciliation
    criticality: medium
    given:
      - start_anti_entropy_loop() running
    when: Interval triggers
    then:
      - State compared with peers
      - Missing data requested
      - Consistency restored
    refs:
      - crates/arkavo-server/src/server/gossip_transport.rs:49-68
      - crates/arkavo-server/src/server/learning_bus_gossip.rs:214-243
    changed: "2026-03-19"

  - id: SRV-007
    name: Agent goal lifecycle
    criticality: high
    given:
      - AgentGoal created
    when: Goal progresses through states
    then:
      - GoalStatus transitions tracked
      - AgentPlan generated
      - Completion or failure recorded
    refs:
      - crates/arkavo-server/src/server/startup.rs:7-27
      - crates/arkavo-server/src/server/startup.rs:167-215
      - crates/arkavo-server/src/server/agent_loop.rs:81-624
    changed: "2026-03-19"

  - id: SRV-008
    name: Well-known state endpoint
    criticality: medium
    given:
      - WellKnownState populated
    when: Discovery endpoint queried
    then:
      - Agent capabilities returned
      - Version information included
      - State reflects current runtime
    refs: [crates/arkavo-server/src/server/well_known.rs:1-130]
    changed: "2026-03-19"

  - id: SRV-009
    name: Execute with conductor and learning
    criticality: high
    given:
      - Task to execute
      - Conductor available
      - Learning pipeline active
    when: execute_with_conductor_and_learning() called
    then:
      - Task executed via conductor
      - Learning events emitted
      - Results returned to caller
    refs: [crates/arkavo-server/src/server/conductor.rs:62-643]
    changed: "2026-03-19"

  - id: SRV-010
    name: Cleanup loop maintenance
    criticality: low
    given:
      - start_cleanup_loop() running
    when: Cleanup interval triggers
    then:
      - Stale sessions removed
      - Expired data purged
      - Resources reclaimed
    refs: [crates/arkavo-server/src/server/gossip_transport.rs:108-136]
    changed: "2026-03-19"

  - id: SRV-011
    name: Consolidation teacher requires a layer budget for frontier models
    criticality: critical
    given:
      - A non-local teacher model (Fable)
    when: run_teacher starts
    then:
      - A missing budget.per_layer consolidation limit refuses the run
      - A local teacher runs without a layer budget
      - Every reply's cost accrues against the limit
    refs: [crates/arkavo-server/src/server/consolidation_teacher.rs]
    changed: "2026-06-10"

  - id: SRV-012
    name: Teacher budget exhaustion stops between batches keeping partial output
    criticality: critical
    given:
      - Cumulative teacher spend reaching the consolidation layer limit
    when: the next batch would start
    then:
      - The run stops between batches, never mid-call
      - Lessons and proposals from completed batches are preserved
      - A budget_exhausted BudgetEvent is traced
    refs: [crates/arkavo-server/src/server/consolidation_teacher.rs]
    changed: "2026-06-10"

  - id: SRV-013
    name: Large state broadcasts hand specialists a data-plane reference
    criticality: medium
    given:
      - The agent loop broadcasting an observation over 4000 bytes to its specialists
      - The agent's long-lived data-plane node
    when: The state is broadcast
    then:
      - "The full state is staged as a reference named state, text/plain, fetchable for 10 minutes (IROH-010) within the store bound (IROH-011)"
      - "Each specialist's advisory task carries the summary and the iroh_fetch arguments holding the reference (MCP-018)"
    edge_cases:
      - condition: No data-plane node, or staging fails
        expected: "The advisory task carries the summary alone"
    refs:
      - crates/arkavo-server/src/server/agent_loop.rs
    changed: "2026-10-12"

  - id: SRV-014
    name: A requester's answer is the model's own text even when its rounds end on tool calls
    criticality: high
    given:
      - A cycle a requester is waiting on, in the agent loop or a direct execution of message/send
      - The planner's rounds end on tool calls whose results came back, or on a round that said nothing after them
    when: The cycle's answer is written to the requester's task
    then:
      - "The planner waits up to 5 minutes for a batch's results, not its inference timeout, so a tool that bounds its own wait (generate_image answers after up to 90 s) reaches the model"
      - "It waits for one result per call in the batch, not the first to arrive, with a call the model repeated in the batch run and counted once"
      - "A call the role's grants deny is reported to the model as denied, as the sequential loop reports it, so every batch has results to wait for"
      - "One more round runs on the same model with the results in context, offered no tools and told to answer from them"
      - "Its text is the requester's answer, ahead of any assets the cycle produced (ASSET-008)"
    edge_cases:
      - condition: A batch whose calls finish at different times, such as a denied call reported at once beside a generate_image that takes minutes
        expected: "The next round sees every result in the batch"
      - condition: A batch cut short by the 5-minute wait or a closed judge channel after some of its results
        expected: "The results that came back reach the answer round"
      - condition: That round fails, times out, answers with a tool call or says nothing
        expected: "The requester gets the record of the cycle's tool results, as before"
      - condition: A cycle nobody is waiting on, a round that already answered in text, a refused or failed round, or a spent compute budget
        expected: "No extra round runs"
    refs:
      - crates/arkavo-server/src/server/conductor_parallel.rs
      - crates/arkavo-server/src/server/conductor_parallel/answering.rs
      - crates/arkavo-server/src/server/conductor_tool_loop.rs
    changed: "2026-10-17"

  - id: SRV-015
    name: An orchestrator that answers requesters is not pushed to act
    criticality: high
    given:
      - An agent in orchestrator mode, such as a kit role like writer, whose cycles serve message/send requesters
    when: Its cycles end without a tool the loop counts as a meaningful action
    then:
      - "A cycle that answered a requester counts as action: the run of idle cycles that sets off the dead-man's switch starts again"
      - "Only cycles nobody asked for, that took no action, count toward the switch"
      - "The answer round tells the model that what the tools produced, a generated image included, is attached to the reply, so it does not promise to send it later"
    edge_cases:
      - condition: "2026-10-17: a writer answered three image requests in a row"
        expected: "No forced cycle follows. Before, the switch forced one that replayed the last request from history and generated its image again for nobody, and showed in arkavo ui as a task such as 'Immediately call one tool with concrete parameters'"
    refs:
      - crates/arkavo-server/src/server/agent_loop.rs
      - crates/arkavo-server/src/server/agent_loop/cycle_prompt.rs
      - crates/arkavo-server/src/server/conductor_parallel/answering.rs
    changed: "2026-10-18"

