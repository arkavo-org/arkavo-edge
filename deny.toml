# cargo-deny configuration for arkavo-edge
# Helps track and prevent duplicate dependencies, security advisories, and license issues
# Compatible with cargo-deny 0.18.x

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa timing sidechannel — no fixed version available.
    # Transitive: sqlx-macros-core unconditionally pulls in sqlx-mysql which depends on rsa.
    # Project only uses sqlite; rsa is compile-time only, not used at runtime.
    { id = "RUSTSEC-2023-0071", reason = "sqlx-macros-core unconditionally includes sqlx-mysql; compile-time only" },
    # iroh P2P library transitive deps (no alternatives available)
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill in iroh -> postcard -> heapless" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error in iroh transitive deps" },
    { id = "RUSTSEC-2024-0384", reason = "instant in iroh transitive deps" },
    # Transitive unmaintained crates with no alternatives
    { id = "RUSTSEC-2024-0436", reason = "paste in alloy-primitives (no replacement available)" },
    { id = "RUSTSEC-2025-0141", reason = "bincode in hnsw_rs (transitive, no direct usage)" },
    # alloy-primitives -> ruint -> ark-ff -> derivative
    { id = "RUSTSEC-2024-0388", reason = "derivative in alloy-primitives transitive deps" },
    # fastembed -> hf-hub -> indicatif -> number_prefix
    { id = "RUSTSEC-2025-0119", reason = "number_prefix in fastembed transitive deps" },
    # rand unsoundness when log + thread_rng + custom logger accesses ThreadRng — not applicable,
    # we don't use a custom logger that calls rand::rng() inside the log handler
    { id = "RUSTSEC-2026-0097", reason = "rand unsoundness requires custom logger accessing ThreadRng; not applicable" },
]

[bans]
# Multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Skip expected duplicates that cannot be easily resolved
skip = [
    # Dev/build dependencies - Different contexts (acceptable)
    { crate = "itertools@0.12.1", reason = "bindgen build-dependency" },

    # Transitive deps requiring upstream updates
    { crate = "tower@0.4.13", reason = "jsonrpsee v0.24.x requirement" },
    { crate = "base64@0.13.1", reason = "spm_precompiled via tokenizers" },
    { crate = "base64@0.21.7", reason = "tiktoken-rs v0.6.0" },
    { crate = "tungstenite@0.23.0", reason = "chromiumoxide v0.7.0" },

    # Minor duplicates with low impact
    { crate = "fancy-regex@0.14.0", reason = "tokenizers older version" },
    { crate = "bit-set@0.5.3", reason = "old syntect dependency" },
    { crate = "bit-vec@0.6.3", reason = "old syntect dependency" },
]

# skip-tree entries ignore entire dependency trees
skip-tree = [
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "NCSA",
    "LicenseRef-Intel-Simplified",
]
confidence-threshold = 0.8

# Ignore private (unpublished) workspace crates
[licenses.private]
ignore = true

# Clarifications for crates with custom or missing license fields
# Internal workspace crates use Apache-2.0
[[licenses.clarify]]
crate = "arkavo-crypto"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "arkavo-registration"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "arkavo-llama-cpp"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "arkavo-llama-cpp-sys"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "xtask"
expression = "Apache-2.0"
license-files = []

# Intel MKL uses Intel Simplified Software License (permissive, allows redistribution)
[[licenses.clarify]]
crate = "intel-mkl-src"
expression = "LicenseRef-Intel-Simplified"
license-files = []

# Ring uses custom license that is ISC + OpenSSL compatible
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# webpki also has custom licensing
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# rustls-webpki
[[licenses.clarify]]
crate = "rustls-webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/arkavo-org/opentdf-rs",
    "https://github.com/huggingface/hf-hub",
]

[sources.allow-org]
github = ["arkavo-org"]
